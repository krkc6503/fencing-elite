<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FENCING ELITE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a14;color:#f5f8ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}button,input,select{font:inherit}button{color:inherit;cursor:pointer;touch-action:none}
#app{position:relative;width:100%;height:100dvh;overflow:hidden;background:#050a14}
.screen{position:absolute;inset:0}
#title{z-index:10;background:#071023 url("title-screen.jpg") center center/cover no-repeat}
#startHotspot{position:absolute;left:34%;top:77%;width:32%;height:11%;border:0;border-radius:18px;background:transparent}
#fallback{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse,#174c85,#050b16 70%);text-align:center}
#fallback h1{font-size:clamp(44px,10vw,90px);font-style:italic;line-height:.9;margin:0}#fallback span{display:block;color:#42aaff}#fallback button{margin-top:24px;padding:14px 42px;background:#ffffff18;border:1px solid white;letter-spacing:.2em}
#menu,#result{display:none;z-index:8;align-items:center;justify-content:center;padding:14px;background:#030914ed;backdrop-filter:blur(8px)}
.panel{width:min(680px,100%);max-height:96%;overflow:auto;border:1px solid #31557d;background:linear-gradient(145deg,#132744f5,#07101df5);border-radius:16px;padding:clamp(16px,4vw,28px);box-shadow:0 20px 80px #0009}
.brand{text-align:center;font-size:clamp(28px,6vw,45px);font-weight:1000;font-style:italic;margin:0}.brand span{color:#4aaaff}.sub{text-align:center;color:#9cb5d5;letter-spacing:.2em;font-size:11px;margin:7px 0 18px}
.label{color:#82bfff;font-size:12px;font-weight:800;letter-spacing:.14em;margin:15px 0 8px}.row{display:flex;gap:8px}.choice{flex:1;border:1px solid #365574;background:#0b1728;padding:12px 7px;border-radius:9px;font-weight:800}.choice.active{border-color:#4daaff;background:#12345a}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:flex;flex-direction:column;gap:5px;color:#b8c9df;font-size:12px}.field input,.field select{width:100%;min-width:0;border:1px solid #304966;background:#071321;color:white;border-radius:8px;padding:10px;font-size:14px}
.primary,.secondary{width:100%;border-radius:9px;padding:14px;font-weight:1000;margin-top:18px}.primary{border:0;background:linear-gradient(90deg,#1476df,#2ea7ff);letter-spacing:.12em}.secondary{margin-top:8px;border:1px solid #365574;background:#0b1728}
#game{display:none;background:#050a14}canvas{display:block;width:100%;height:100%}
#controls{position:absolute;z-index:3;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0));display:flex;justify-content:space-between;gap:7px;padding:0 9px;pointer-events:none}
.group{display:flex;gap:5px;align-items:end;pointer-events:auto}.ctrl{min-width:49px;min-height:52px;padding:6px;border:1px solid #6785a8;background:#0b1c30ed;border-radius:10px;font-weight:900;box-shadow:0 5px 14px #0006}.ctrl small{display:block;font-size:9px;color:#a7c3e4}.ctrl.attack{min-width:64px;background:linear-gradient(#1764ad,#0b2d52);border-color:#64b9ff}.ctrl.pressed{background:#256db0;transform:scale(.97)}
#topButtons{position:absolute;z-index:4;top:calc(7px + env(safe-area-inset-top,0));left:9px;right:9px;display:flex;justify-content:space-between;pointer-events:none}#topButtons button{pointer-events:auto;border:1px solid #5b7697;background:#09172bd9;border-radius:9px;padding:8px 11px;font-size:12px}
@media(max-width:600px){.ctrl{min-width:43px;font-size:11px}.ctrl.attack{min-width:57px}#controls{padding:0 5px}.group{gap:4px}.panel{padding:16px}}
</style></head>
<body><div id="app">
<section id="title" class="screen" aria-label="FENCING ELITE title"><div id="fallback"><h1>FENCING <span>ELITE</span></h1><p>TACTICS · SPEED · PRECISION</p><button id="fallbackStart">▶ START ◀</button></div><button id="startHotspot" aria-label="START ゲーム開始"></button></section>
<section id="menu" class="screen"><div class="panel"><h1 class="brand">FENCING <span>ELITE</span></h1><div class="sub">TACTICS · SPEED · PRECISION</div><div class="label">GAME MODE</div><div class="row"><button class="choice active" data-mode="cpu">1 PLAYER vs CPU</button><button class="choice" data-mode="2p">2 PLAYER LOCAL</button></div><div class="label">FENCERS</div><div class="fields"><label class="field">LEFT PLAYER NAME<input id="nameP" maxlength="18" value="BLUE"></label><label class="field">RIGHT PLAYER NAME<input id="nameC" maxlength="18" value="RED"></label><label class="field">LEFT COLOR<input id="colorP" type="color" value="#168cff"></label><label class="field">RIGHT COLOR<input id="colorC" type="color" value="#ff4168"></label><label class="field">LEFT SPEED<select id="speedP"><option value="0.23">Standard</option><option value="0.30">Fast</option><option value="0.18">Heavy</option></select></label><label class="field">CPU LEVEL<select id="levelC"><option value=".62">Easy</option><option value=".85" selected>Normal</option><option value="1.08">Hard</option></select></label></div><button id="begin" class="primary">▶ START MATCH</button><button id="backTitle" class="secondary">TITLE SCREEN</button></div></section>
<section id="game" class="screen"><canvas id="cv"></canvas><div id="topButtons"><button id="menuBtn">☰ MENU</button><button id="pauseBtn">Ⅱ PAUSE</button></div><div id="controls"><div class="group"><button class="ctrl" data-side="p" data-act="back">◀<small>BACK (A)</small></button><button class="ctrl" data-side="p" data-act="forward">▶<small>ADVANCE (D)</small></button><button class="ctrl attack" data-side="p" data-act="attack">LUNGE<small>F / SPACE</small></button></div><div class="group" id="rightControls"><button class="ctrl attack" data-side="c" data-act="attack">LUNGE<small>ENTER</small></button><button class="ctrl" data-side="c" data-act="forward">◀<small>ADVANCE (←)</small></button><button class="ctrl" data-side="c" data-act="back">▶<small>BACK (→)</small></button></div></div></section>
<section id="result" class="screen"><div class="panel" style="text-align:center"><h1 id="resultTitle" class="brand">VICTORY</h1><p id="resultText"></p><button id="again" class="primary">REMATCH</button><button id="resultMenu" class="secondary">MENU</button></div></section></div>
<script>
(()=>{const $=id=>document.getElementById(id),canvas=$('cv'),ctx=canvas.getContext('2d');const title=$('title'),menu=$('menu'),game=$('game'),result=$('result');let mode='cpu',running=false,paused=false,phase='menu',last=0,raf=0,timer=0,elapsed=0,flash=0,flashColor='#fff',flashText='',speedP=.23,levelC=.85, introUntil=0;
const S={p:{x:.31,score:0,cd:0,charge:0,lunge:0},c:{x:.69,score:0,cd:0,charge:0,lunge:0}},I={p:{forward:false,back:false,attack:false},c:{forward:false,back:false,attack:false}};let W=0,H=0,D=1;
function resize(){D=Math.min(devicePixelRatio||1,2);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);
function clearInput(){for(const s of ['p','c'])for(const a of ['forward','back','attack'])I[s][a]=false}
function showMenu(){running=false;cancelAnimationFrame(raf);clearTimeout(timer);game.style.display='none';result.style.display='none';title.style.display='none';menu.style.display='flex';phase='menu'}
function showTitle(){running=false;cancelAnimationFrame(raf);menu.style.display='none';game.style.display='none';result.style.display='none';title.style.display='block';phase='menu'}
function start(){clearTimeout(timer);S.p.x=.31;S.c.x=.69;S.p.score=S.c.score=0;for(const s of ['p','c']){S[s].cd=0;S[s].charge=0;S[s].lunge=0}clearInput();speedP=+$('speedP').value;levelC=+$('levelC').value;$('rightControls').style.display=mode==='2p'?'flex':'none';menu.style.display='none';title.style.display='none';result.style.display='none';game.style.display='block';resize();phase='intro';running=true;paused=false;elapsed=0;introUntil=performance.now()+1900;last=performance.now();raf=requestAnimationFrame(loop)}
function name(s){return $('name'+(s==='p'?'P':'C')).value.trim()||(s==='p'?'BLUE':'RED')}
function color(s){return $('color'+(s==='p'?'P':'C')).value}
function score(who,why){if(!running||phase!=='fight')return;phase='point';S[who].score++;flash=1;flashColor=color(who);flashText='TOUCHÉ!';if(why==='END-LINE')flashText='END-LINE FAULT';if(S[who].score>=15){timer=setTimeout(()=>finish(who),1050);return}timer=setTimeout(()=>{if(!running)return;S.p.x=.31;S.c.x=.69;S.p.lunge=S.c.lunge=0;S.p.charge=S.c.charge=0;phase='fight';},1000)}
function finish(who){running=false;phase='result';game.style.display='none';result.style.display='flex';$('resultTitle').textContent='VICTORY';$('resultTitle').style.color=color(who);$('resultText').textContent=name(who)+' wins · '+S.p.score+' : '+S.c.score}
function setI(s,a,v){if(s==='c'&&mode==='cpu'&&a!=='attack')return;I[s][a]=v;if(a==='attack'&&v)S[s].charge=Math.min(1,S[s].charge+.12)}
function move(s,dt){const f=S[s],o=S[s==='p'?'c':'p'];let fw=I[s].forward,bk=I[s].back;
 if(s==='c'&&mode==='cpu'&&phase==='fight'){const dist=f.x-o.x;fw=dist>.27;bk=dist<.14;if(dist<.42&&f.cd<=0&&Math.random()<.85)I.c.attack=true;else if(Math.random()<.025)I.c.attack=false}
 const dir=(fw?1:0)-(bk?1:0),vel=(s==='p'?speedP:.23*(mode==='cpu'?levelC:1));f.x+=(s==='p'?dir:-dir)*vel*dt;
 // The left fencer's own end line is on the left; the right fencer's is on the right.
 if(s==='p'&&f.x<.105){score('c','END-LINE');return}if(s==='c'&&f.x>.895){score('p','END-LINE');return}
 // Keep the blades facing each other; bodies cannot cross.
 const gap=.155;if(s==='p'&&f.x>o.x-gap)f.x=o.x-gap;if(s==='c'&&f.x<o.x+gap)f.x=o.x+gap;
 f.x=Math.max(.02,Math.min(.98,f.x));
 if(I[s].attack&&phase==='fight'){f.charge=Math.min(1,f.charge+dt*1.4);if(f.cd<=0){f.lunge=Math.min(1,f.lunge+dt*4.8);if(f.lunge>.22){const dist=Math.abs(S.p.x-S.c.x),reach=.245+f.charge*.16;if(dist<reach&&Math.random()<(s==='p'?.83:(mode==='cpu'?.62:.83))){score(s,'TOUCHÉ');return}if(f.lunge>=1){f.cd=.48;f.lunge=0}}}}else{f.lunge=Math.max(0,f.lunge-dt*3.8);f.charge=Math.max(0,f.charge-dt*1.2)}
 f.cd=Math.max(0,f.cd-dt)}
function loop(t){if(!running)return;const dt=Math.min((t-last)/1000,.035);last=t;if(!paused){elapsed+=dt;if(phase==='intro'&&t>=introUntil)phase='fight';if(phase==='fight'){move('p',dt);if(running&&phase==='fight')move('c',dt)}draw()}raf=requestAnimationFrame(loop)}
function roundRect(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}
function drawFencer(s){const f=S[s],left=s==='p',x=f.x*W,y=H*.665,scale=Math.min(W/900,H/520),sgn=left?1:-1,accent=color(s),lunge=f.lunge;ctx.save();ctx.translate(x,y);ctx.scale(sgn*scale,scale);
 // Feet are planted directly on the piste plane; the stance is fencing-like, not a floating stick figure.
 const stride=17+lunge*36;ctx.lineCap='round';ctx.lineJoin='round';
 // back leg
 ctx.strokeStyle='#111d2d';ctx.lineWidth=20;ctx.beginPath();ctx.moveTo(-8,-68);ctx.lineTo(-stride-17,-8);ctx.stroke();
 ctx.strokeStyle='#a9b8cb';ctx.lineWidth=15;ctx.beginPath();ctx.moveTo(-8,-68);ctx.lineTo(-stride-17,-8);ctx.stroke();
 ctx.fillStyle='#17253a';roundRect(ctx,-stride-34,-10,39,10,4);
 // front leg lunges forward
 ctx.strokeStyle='#18283d';ctx.lineWidth=21;ctx.beginPath();ctx.moveTo(7,-72);ctx.lineTo(45+lunge*45,-12);ctx.stroke();
 ctx.strokeStyle='#b9c7d8';ctx.lineWidth=15;ctx.beginPath();ctx.moveTo(7,-72);ctx.lineTo(45+lunge*45,-12);ctx.stroke();
 ctx.fillStyle='#17253a';roundRect(ctx,28+lunge*45,-11,42,10,4);
 // jacket and torso
 ctx.fillStyle='#07101d';ctx.beginPath();ctx.moveTo(-25,-153);ctx.lineTo(20,-157);ctx.lineTo(39,-76);ctx.lineTo(10,-59);ctx.lineTo(-31,-75);ctx.closePath();ctx.fill();
 const grad=ctx.createLinearGradient(-26,0,35,0);grad.addColorStop(0,'#f1f5fb');grad.addColorStop(.45,'#d8e1ec');grad.addColorStop(1,'#8193a9');ctx.fillStyle=grad;ctx.beginPath();ctx.moveTo(-22,-153);ctx.lineTo(17,-157);ctx.lineTo(32,-82);ctx.lineTo(8,-68);ctx.lineTo(-28,-81);ctx.closePath();ctx.fill();ctx.strokeStyle='#f4f8ff';ctx.lineWidth=2;ctx.stroke();
 // colored lamé stripe
 ctx.strokeStyle=accent;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-12,-146);ctx.lineTo(3,-83);ctx.stroke();
 // neck and mask
 ctx.fillStyle='#b5c4d6';roundRect(ctx,-8,-171,18,20,4);
 const mg=ctx.createLinearGradient(-24,-204,26,-172);mg.addColorStop(0,'#e4ebf5');mg.addColorStop(.55,'#a6b7cc');mg.addColorStop(1,'#526a85');ctx.fillStyle=mg;ctx.beginPath();ctx.ellipse(0,-188,29,23,-.08,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f3f7ff';ctx.lineWidth=3;ctx.stroke();
 ctx.save();ctx.beginPath();ctx.ellipse(0,-188,25,19,-.08,0,Math.PI*2);ctx.clip();ctx.strokeStyle='#51657c';ctx.lineWidth=1;for(let yy=-208;yy<-167;yy+=4){ctx.beginPath();ctx.moveTo(-30,yy);ctx.lineTo(30,yy-2);ctx.stroke()}ctx.restore();
 // sword arm reaches toward opponent; lunge animation extends the arm
 const shoulder={x:10,y:-143},elbow={x:29+lunge*16,y:-127},hand={x:55+lunge*42,y:-133};
 ctx.strokeStyle='#d8e2ef';ctx.lineWidth=17;ctx.beginPath();ctx.moveTo(shoulder.x,shoulder.y);ctx.lineTo(elbow.x,elbow.y);ctx.lineTo(hand.x,hand.y);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
 ctx.fillStyle='#1a2b41';ctx.beginPath();ctx.arc(hand.x,hand.y,9,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#b8d6f4';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(hand.x+2,hand.y);ctx.lineTo(hand.x+14,hand.y);ctx.stroke();
 // blade points inward
 const swordLen=112+lunge*72+f.charge*12;ctx.strokeStyle='#eaf6ff';ctx.lineWidth=2.6;ctx.beginPath();ctx.moveTo(hand.x+10,hand.y);ctx.lineTo(hand.x+swordLen,hand.y-5);ctx.stroke();ctx.strokeStyle='#74bfff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(hand.x+14,hand.y+3);ctx.lineTo(hand.x+swordLen,hand.y-2);ctx.stroke();
 // subtle ground shadow
 ctx.restore();ctx.save();ctx.globalAlpha=.23;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(x,y+2,scale*62,scale*8,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function draw(){if(!W||!H)return;ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#071327');bg.addColorStop(.5,'#142b47');bg.addColorStop(1,'#030711');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 // crowd with blue lights and colored spectator LEDs
 for(let row=0;row<7;row++){for(let col=0;col<Math.ceil(W/15);col++){const x=col*15+(row%2)*7,y=H*.12+row*H*.035;const wave=Math.sin(col*.4+row+elapsed*1.5);ctx.fillStyle=wave>.86?(S.p.score>S.c.score?color('p'):color('c')):(wave>.25?'#456c9a':'#243a59');ctx.globalAlpha=.45+Math.abs(wave)*.3;ctx.beginPath();ctx.arc(x,y,1.1+(wave>.85?1:0),0,Math.PI*2);ctx.fill()}}ctx.globalAlpha=1;
 // overhead arena lamps
 for(let i=0;i<6;i++){const x=W*(.08+i*.168);const glow=ctx.createRadialGradient(x,H*.16,1,x,H*.16,W*.11);glow.addColorStop(0,'#a9d8ff20');glow.addColorStop(1,'#6dbaff00');ctx.fillStyle=glow;ctx.fillRect(x-W*.11,H*.06,W*.22,H*.25)}
 // piste perspective and regulation markings
 const horizon=H*.53,base=H*.78;ctx.beginPath();ctx.moveTo(W*.12,horizon);ctx.lineTo(W*.88,horizon);ctx.lineTo(W*.99,base);ctx.lineTo(W*.01,base);ctx.closePath();const pg=ctx.createLinearGradient(0,horizon,0,base);pg.addColorStop(0,'#64778e');pg.addColorStop(.18,'#dce5ef');pg.addColorStop(.46,'#71849b');pg.addColorStop(.7,'#c5d0dd');pg.addColorStop(1,'#4c6078');ctx.fillStyle=pg;ctx.fill();ctx.strokeStyle='#e3efff';ctx.lineWidth=3;ctx.stroke();
 function pisteLine(frac,col,width){const xx=W*(.12+frac*.76);ctx.strokeStyle=col;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(xx,horizon);ctx.lineTo(W*(.01+frac*.98),base);ctx.stroke()}
 pisteLine(.12,'#ff496d',Math.max(2,W*.0025));pisteLine(.88,'#ff496d',Math.max(2,W*.0025));pisteLine(.5,'#f4f8ff',2);pisteLine(.32,'#eaf4ff99',1.5);pisteLine(.68,'#eaf4ff99',1.5);
 // faint piste center lane and colored audience panels
 ctx.fillStyle='#fff';ctx.globalAlpha=.12;ctx.fillRect(W*.12,H*.61,W*.76,2);ctx.globalAlpha=1;
 drawFencer('p');drawFencer('c');
 // score overlay
 ctx.fillStyle='#030914d9';roundRect(ctx,W/2-Math.min(145,W*.36),H*.12,Math.min(290,W*.72),H*.13,13);ctx.strokeStyle='#355779';ctx.lineWidth=1;ctx.strokeRect(W/2-Math.min(145,W*.36),H*.12,Math.min(290,W*.72),H*.13);
 ctx.textAlign='center';ctx.font='700 12px system-ui';ctx.fillStyle=color('p');ctx.fillText(name('p'),W/2-63,H*.155);ctx.fillStyle=color('c');ctx.fillText(name('c'),W/2+63,H*.155);
 ctx.font=`1000 ${Math.min(48,H*.07)}px system-ui`;ctx.fillStyle=color('p');ctx.fillText(S.p.score,W/2-63,H*.225);ctx.fillStyle='#a6b9d0';ctx.font='900 22px system-ui';ctx.fillText(':',W/2,H*.218);ctx.font=`1000 ${Math.min(48,H*.07)}px system-ui`;ctx.fillStyle=color('c');ctx.fillText(S.c.score,W/2+63,H*.225);
 let status=phase==='intro'?'ON GUARD':phase==='point'?'TOUCHÉ!':paused?'PAUSED':'ALLEZ!';ctx.font=`1000 ${Math.min(34,H*.05)}px system-ui`;ctx.fillStyle='#f6f9ff';ctx.shadowColor='#000';ctx.shadowBlur=12;ctx.fillText(status,W/2,H*.36);ctx.shadowBlur=0;
 ctx.font='600 11px system-ui';ctx.fillStyle='#d0e0f5';ctx.fillText(phase==='intro'?'READY · EN GARDE':phase==='point'?flashText:paused?'TAP PAUSE TO RESUME':'FOOTWORK  ·  DISTANCE  ·  TIMING',W/2,H*.405);
 // small color penlight rails
 for(let i=0;i<Math.ceil(W/8);i++){const x=i*8,y=H*.47+(i%3)*3;ctx.fillStyle=(i%9===0)?(S.p.score>S.c.score?color('p'):color('c')):'#547ba5';ctx.globalAlpha=.6;ctx.fillRect(x,y,2,2)}ctx.globalAlpha=1;
 if(flash>0&&phase==='point'){ctx.globalAlpha=Math.min(.25,flash*.25);ctx.fillStyle=flashColor;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;flash=Math.max(0,flash-.025)}
 if(paused){ctx.fillStyle='#030914a8';ctx.fillRect(0,0,W,H);ctx.fillStyle='white';ctx.font='900 30px system-ui';ctx.fillText('PAUSED',W/2,H*.48)}
}
$('startHotspot').onclick=showMenu;$('fallbackStart').onclick=showMenu;$('begin').onclick=start;$('backTitle').onclick=showTitle;$('menuBtn').onclick=showMenu;$('again').onclick=start;$('resultMenu').onclick=showMenu;$('pauseBtn').onclick=()=>{if(!running)return;paused=!paused;$('pauseBtn').textContent=paused?'▶ RESUME':'Ⅱ PAUSE';if(!paused)last=performance.now();draw()};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));$('rightControls').style.display=mode==='2p'?'flex':'none'});
document.querySelectorAll('.ctrl').forEach(b=>{const s=b.dataset.side,a=b.dataset.act;const down=e=>{e.preventDefault();b.classList.add('pressed');setI(s,a,true)};const up=e=>{e.preventDefault();b.classList.remove('pressed');setI(s,a,false)};b.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,up))});
const key=e=>e.key===' '?'space':e.key.toLowerCase();addEventListener('keydown',e=>{const k=key(e);if(['arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();if(k==='a')setI('p','back',true);if(k==='d')setI('p','forward',true);if(k==='f'||k==='space')setI('p','attack',true);if(mode==='2p'){if(k==='arrowleft')setI('c','forward',true);if(k==='arrowright')setI('c','back',true);if(k==='enter')setI('c','attack',true)}else{if(k==='arrowleft')setI('p','forward',true);if(k==='arrowright')setI('p','back',true)}});
addEventListener('keyup',e=>{const k=key(e);if(k==='a')setI('p','back',false);if(k==='d')setI('p','forward',false);if(k==='f'||k==='space')setI('p','attack',false);if(k==='arrowleft'){if(mode==='2p')setI('c','forward',false);else setI('p','forward',false)}if(k==='arrowright'){if(mode==='2p')setI('c','back',false);else setI('p','back',false)}if(k==='enter')setI('c','attack',false)});
const im=new Image();im.onload=()=>{$('fallback').style.display='none'};im.onerror=()=>{$('fallback').style.display='flex';$('startHotspot').style.display='none'};im.src='title-screen.jpg';resize();
})();
</script></body></html>
