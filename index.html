<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FENCING ELITE - Épée Championship</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .game-container {
            position: relative;
            width: 800px;
            max-width: 100%;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            border: 1px solid #334155;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .score-board {
            display: flex;
            gap: 24px;
            font-size: 1.2rem;
            font-weight: 700;
        }
        .score-p1 { color: #35b96d; }
        .score-p2 { color: #e34e5a; }
        .timer {
            font-variant-numeric: tabular-nums;
            background: #334155;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 1rem;
        }
        canvas {
            display: block;
            background: linear-gradient(to bottom, #1e293b 0%, #0f172a 100%);
            width: 100%;
            height: auto;
        }
        .controls-info {
            padding: 12px 24px;
            background: #0f172a;
            border-top: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .touch-controls {
            display: none;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 12px;
            background: #0f172a;
            border-top: 1px solid #334155;
        }
        @media (pointer: coarse) {
            .touch-controls { display: grid; }
        }
        .btn {
            background: #334155;
            color: #fff;
            border: none;
            padding: 14px 0;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:active {
            background: #475569;
        }
        .modal {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 10;
            transition: opacity 0.3s;
        }
        .modal.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .modal h2 {
            font-size: 2rem;
            font-weight: 800;
        }
        .modal p {
            color: #94a3b8;
            max-width: 400px;
            text-align: center;
            line-height: 1.5;
        }
        .menu-btn {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.6);
        }
    </style>
</head>
<body>

<div class="game-container">
    <header>
        <h1>FENCING ELITE</h1>
        <div class="score-board">
            <span class="score-p1">P1: <span id="score1">0</span></span>
            <div class="timer" id="timer">03:00</div>
            <span class="score-p2">P2: <span id="score2">0</span></span>
        </div>
    </header>

    <div style="position: relative;">
        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <!-- スタート・ゲームオーバーモーダル -->
        <div id="modal" class="modal">
            <h2 id="modalTitle">FENCING ELITE</h2>
            <p id="modalDesc">本格エペ競技シミュレーション。相手の隙を突き、正確なランジでポイントを奪え！</p>
            <div style="display: flex; gap: 12px;">
                <button class="menu-btn" onclick="startGame('cpu')">1P vs CPU</button>
                <button class="menu-btn" onclick="startGame('2p')" style="background: linear-gradient(135deg, #10b981, #059669);">2P対戦</button>
            </div>
        </div>
    </div>

    <div class="controls-info">
        <span>P1: [A][D] 移動 / [W] ランジ / [S] パリー</span>
        <span>P2: [←][→] 移動 / [↑] ランジ / [↓] パリー</span>
    </div>

    <div class="touch-controls">
        <button class="btn" ontouchstart="handleTouch('p1', 'left')" ontouchend="handleTouch('p1', 'stop')">◀ P1</button>
        <button class="btn" ontouchstart="handleTouch('p1', 'right')" ontouchend="handleTouch('p1', 'stop')">P1 ▶</button>
        <button class="btn" style="background:#059669;" ontouchstart="handleTouch('p1', 'lunge')">P1 ランジ</button>
        <button class="btn" style="background:#b91c1c;" ontouchstart="handleTouch('p1', 'parry')">P1 パリー</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = 'menu'; // menu, playing, round_over, game_over
let gameMode = 'cpu'; // cpu, 2p
let timeLeft = 180;
let timerInterval = null;

const p1 = {
    id: 1,
    x: 220,
    y: 0,
    vx: 0,
    dir: 1,
    score: 0,
    action: 'idle', // idle, advance, retreat, lunge, parry
    actionTimer: 0,
    cooldown: 0
};

const p2 = {
    id: 2,
    x: 580,
    y: 0,
    vx: 0,
    dir: -1,
    score: 0,
    action: 'idle',
    actionTimer: 0,
    cooldown: 0
};

const keys = {};

window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (gameState === 'playing') {
        if (e.key === 'w' || e.key === 'W') triggerAction(p1, 'lunge');
        if (e.key === 's' || e.key === 'S') triggerAction(p1, 'parry');
        if (gameMode === '2p') {
            if (e.key === 'ArrowUp') triggerAction(p2, 'lunge');
            if (e.key === 'ArrowDown') triggerAction(p2, 'parry');
        }
    }
});

window.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
});

function handleTouch(player, action) {
    if (gameState !== 'playing') return;
    const p = player === 'p1' ? p1 : p2;
    if (action === 'lunge' || action === 'parry') {
        triggerAction(p, action);
    } else {
        p.action = action;
    }
}

function triggerAction(p, act) {
    if (p.cooldown > 0) return;
    p.action = act;
    p.actionTimer = act === 'lunge' ? 25 : 15;
    p.cooldown = 35;
}

function startGame(mode) {
    gameMode = mode;
    p1.score = 0;
    p2.score = 0;
    p1.x = 220;
    p2.x = 580;
    document.getElementById('score1').textContent = '0';
    document.getElementById('score2').textContent = '0';
    document.getElementById('modal').classList.add('hidden');
    gameState = 'playing';
    timeLeft = 180;
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        if (gameState === 'playing') {
            timeLeft--;
            let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            let s = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer').textContent = `${m}:${s}`;
            if (timeLeft <= 0) endGame("タイムアップ！");
        }
    }, 1000);
}

function resetRound() {
    p1.x = 220;
    p2.x = 580;
    p1.action = 'idle';
    p2.action = 'idle';
    p1.cooldown = 0;
    p2.cooldown = 0;
    gameState = 'playing';
}

function update() {
    if (gameState !== 'playing') return;

    // 向きの調整 (常にお互いを向く)
    if (p1.x < p2.x) {
        p1.dir = 1;
        p2.dir = -1;
    } else {
        p1.dir = -1;
        p2.dir = 1;
    }

    // P1 操作
    if (p1.actionTimer > 0) {
        p1.actionTimer--;
        if (p1.actionTimer === 0) p1.action = 'idle';
    } else {
        if (keys['a']) { p1.x -= 3.5; p1.action = 'retreat'; }
        else if (keys['d']) { p1.x += 3.5; p1.action = 'advance'; }
        else { p1.action = 'idle'; }
    }

    // P2 操作
    if (gameMode === '2p') {
        if (p2.actionTimer > 0) {
            p2.actionTimer--;
            if (p2.actionTimer === 0) p2.action = 'idle';
        } else {
            if (keys['arrowleft']) { p2.x -= 3.5; p2.action = 'retreat'; }
            else if (keys['arrowright']) { p2.x += 3.5; p2.action = 'advance'; }
            else { p2.action = 'idle'; }
        }
    } else {
        // CPU ロジック (エペらしい間合いの駆け引きとランジ)
        if (p2.actionTimer > 0) {
            p2.actionTimer--;
            if (p2.actionTimer === 0) p2.action = 'idle';
        } else {
            const dist = p1.x - p2.x; // p2から見た距離
            if (Math.random() < 0.02) {
                if (Math.abs(dist) < 180 && Math.random() < 0.6) {
                    triggerAction(p2, 'lunge');
                } else if (Math.abs(dist) < 120) {
                    triggerAction(p2, 'parry');
                }
            }
            if (p2.actionTimer === 0) {
                if (dist > -140) { p2.x += 2.2; p2.action = 'retreat'; }
                else if (dist < -200) { p2.x -= 2.2; p2.action = 'advance'; }
                else { p2.action = 'idle'; }
            }
        }
    }

    // クールダウン減少
    if (p1.cooldown > 0) p1.cooldown--;
    if (p2.cooldown > 0) p2.cooldown--;

    // 画面端と衝突判定（すり抜け防止）
    const minDistance = 75;
    if (p2.x - p1.x < minDistance) {
        const mid = (p1.x + p2.x) / 2;
        p1.x = mid - minDistance / 2;
        p2.x = mid + minDistance / 2;
    }

    p1.x = Math.max(60, Math.min(canvas.width - 60, p1.x));
    p2.x = Math.max(60, Math.min(canvas.width - 60, p2.x));

    // 突き判定 (Hitbox for Épée - simultaneous touch allowed in Épée)
    const hitDistance = 115;
    const distanceBetween = Math.abs(p1.x - p2.x);
    
    if (distanceBetween <= hitDistance) {
        let p1Scored = p1.action === 'lunge';
        let p2Scored = p2.action === 'lunge';

        // パリーによる防御判定
        if (p2.action === 'parry') p1Scored = false;
        if (p1.action === 'parry') p2Scored = false;

        if (p1Scored || p2Scored) {
            if (p1Scored && p2Scored) {
                // 相打ちの場合は両者ポイント（エペのルール）
                p1.score++;
                p2.score++;
            } else if (p1Scored) {
                p1.score++;
            } else if (p2Scored) {
                p2.score++;
            }
            document.getElementById('score1').textContent = p1.score;
            document.getElementById('score2').textContent = p2.score;

            gameState = 'round_over';
            if (p1.score >= 5 || p2.score >= 5) {
                endGame(p1.score >= 5 ? "Player 1 勝利！" : "Player 2 勝利！");
            } else {
                setTimeout(resetRound, 1500);
            }
        }
    }
}

function endGame(msg) {
    gameState = 'game_over';
    clearInterval(timerInterval);
    document.getElementById('modalTitle').textContent = msg;
    document.getElementById('modalDesc').textContent = `最終スコア - P1: ${p1.score} | P2: ${p2.score}`;
    document.getElementById('modal').classList.remove('hidden');
}

function drawFencer(p) {
    const x = p.x;
    const dir = p.dir;
    const red = p.id === 2;
    const base = 292;
    const lunging = p.action === "lunge";

    const suit = "#f8f9fc";
    const shade = "#c6d7eb";
    const blue = "#416fae";

    ctx.save();
    ctx.translate(x, base);
    ctx.scale(dir, 1);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // 地面の影
    ctx.fillStyle = "rgba(22,24,70,.4)";
    ctx.beginPath();
    ctx.ellipse(0, 48, 112, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // 後ろ脚
    ctx.strokeStyle = blue;
    ctx.lineWidth = 28;
    ctx.beginPath();
    ctx.moveTo(-8, -45);
    ctx.quadraticCurveTo(-61, -36, -88, 16);
    ctx.stroke();

    ctx.strokeStyle = suit;
    ctx.lineWidth = 20;
    ctx.beginPath();
    ctx.moveTo(-8, -46);
    ctx.quadraticCurveTo(-61, -36, -88, 16);
    ctx.stroke();

    ctx.strokeStyle = shade;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-15, -43);
    ctx.quadraticCurveTo(-62, -30, -86, 12);
    ctx.stroke();

    // 前脚 (ランジ時はより大きく伸ばす)
    const lungeOffset = lunging ? 25 : 0;
    ctx.strokeStyle = blue;
    ctx.lineWidth = 30;
    ctx.beginPath();
    ctx.moveTo(8, -43);
    ctx.quadraticCurveTo(48 + lungeOffset/2, -20, 67 + lungeOffset, 1);
    ctx.quadraticCurveTo(92 + lungeOffset, 22, 119 + lungeOffset, 23);
    ctx.stroke();

    ctx.strokeStyle = suit;
    ctx.lineWidth = 21;
    ctx.beginPath();
    ctx.moveTo(8, -44);
    ctx.quadraticCurveTo(48 + lungeOffset/2, -21, 67 + lungeOffset, 0);
    ctx.quadraticCurveTo(92 + lungeOffset, 21, 119 + lungeOffset, 22);
    ctx.stroke();

    ctx.strokeStyle = shade;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(15, -41);
    ctx.quadraticCurveTo(49 + lungeOffset/2, -18, 66 + lungeOffset, 1);
    ctx.stroke();

    // シューズ
    ctx.fillStyle = "#234b91";
    ctx.beginPath();
    ctx.moveTo(-105, 23);
    ctx.quadraticCurveTo(-91, 13, -77, 15);
    ctx.lineTo(-68, 26);
    ctx.lineTo(-99, 33);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(108 + lungeOffset, 18);
    ctx.quadraticCurveTo(128 + lungeOffset, 14, 143 + lungeOffset, 25);
    ctx.lineTo(143 + lungeOffset, 31);
    ctx.lineTo(112 + lungeOffset, 31);
    ctx.closePath();
    ctx.fill();

    // 胴体・ジャケット
    ctx.fillStyle = blue;
    ctx.beginPath();
    ctx.moveTo(-21, -122);
    ctx.quadraticCurveTo(8, -137, 36, -108);
    ctx.lineTo(27, -53);
    ctx.quadraticCurveTo(8, -34, -18, -49);
    ctx.lineTo(-37, -82);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = suit;
    ctx.beginPath();
    ctx.moveTo(-22, -126);
    ctx.quadraticCurveTo(8, -139, 32, -110);
    ctx.lineTo(23, -56);
    ctx.quadraticCurveTo(7, -38, -15, -52);
    ctx.lineTo(-32, -84);
    ctx.closePath();
    ctx.fill();

    // ジャケットの陰影
    ctx.strokeStyle = shade;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-15, -116);
    ctx.quadraticCurveTo(0, -97, 15, -90);
    ctx.moveTo(18, -80);
    ctx.quadraticCurveTo(2, -66, -12, -63);
    ctx.stroke();

    // 腰ベルト
    ctx.strokeStyle = "#244d8e";
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(-20, -54);
    ctx.quadraticCurveTo(2, -47, 25, -55);
    ctx.stroke();

    // 後方に伸ばす腕
    ctx.strokeStyle = blue;
    ctx.lineWidth = 22;
    ctx.beginPath();
    ctx.moveTo(-15, -111);
    ctx.quadraticCurveTo(-44, -94, -58, -73);
    ctx.quadraticCurveTo(-76, -65, -87, -82);
    ctx.stroke();

    ctx.strokeStyle = suit;
    ctx.lineWidth = 15;
    ctx.beginPath();
    ctx.moveTo(-15, -111);
    ctx.quadraticCurveTo(-44, -94, -58, -73);
    ctx.quadraticCurveTo(-76, -65, -87, -82);
    ctx.stroke();

    ctx.fillStyle = "#e9b99b";
    ctx.beginPath();
    ctx.ellipse(-89, -84, 8, 6, -0.5, 0, Math.PI * 2);
    ctx.fill();

    // 剣を持つ腕 (ランジ時は前方に鋭く突き出す)
    const armExtension = lunging ? 35 : 0;
    ctx.strokeStyle = blue;
    ctx.lineWidth = 23;
    ctx.beginPath();
    ctx.moveTo(22, -111);
    ctx.quadraticCurveTo(50 + armExtension/2, -120, 73 + armExtension, -135);
    ctx.stroke();

    ctx.strokeStyle = suit;
    ctx.lineWidth = 16;
    ctx.beginPath();
    ctx.moveTo(22, -111);
    ctx.quadraticCurveTo(50 + armExtension/2, -120, 73 + armExtension, -135);
    ctx.stroke();

    ctx.fillStyle = "#e9b99b";
    ctx.beginPath();
    ctx.ellipse(79 + armExtension, -137, 9, 6, -0.3, 0, Math.PI * 2);
    ctx.fill();

    // マスク
    ctx.fillStyle = "#e8b99b";
    ctx.fillRect(-1, -140, 17, 17);

    ctx.fillStyle = red ? "#e34e5a" : "#35b96d";
    ctx.beginPath();
    ctx.ellipse(-1, -158, 20, 29, -0.08, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = red ? "#a92f48" : "#187f4d";
    ctx.beginPath();
    ctx.ellipse(4, -158, 14, 24, -0.08, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#dcecff";
    ctx.beginPath();
    ctx.ellipse(7, -161, 10, 19, -0.08, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(7, -161, 10, 19, -0.08, 0, Math.PI * 2);
    ctx.stroke();

    // マスクの首部分
    ctx.fillStyle = suit;
    ctx.beginPath();
    ctx.moveTo(-10, -139);
    ctx.lineTo(12, -139);
    ctx.lineTo(19, -124);
    ctx.lineTo(-7, -124);
    ctx.closePath();
    ctx.fill();

    // エペのガードと剣身
    const swordOffset = lunging ? 35 : 0;
    ctx.strokeStyle = "#b6c6d8";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(80 + swordOffset, -136);
    ctx.lineTo(91 + swordOffset, -145);
    ctx.stroke();

    ctx.strokeStyle = "#e6eff9";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(88 + swordOffset, -143);
    ctx.lineTo(230 + swordOffset, -233);
    ctx.stroke();

    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(90 + swordOffset, -144);
    ctx.lineTo(230 + swordOffset, -233);
    ctx.stroke();

    // ランジ時の動きのアクセント
    if (lunging) {
        ctx.strokeStyle = "rgba(255,255,255,.7)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-130, -5);
        ctx.lineTo(-151, -5);
        ctx.moveTo(-124, 8);
        ctx.lineTo(-143, 14);
        ctx.stroke();
    }

    ctx.restore();
}

function drawPiste() {
    // ピスト（床）の描画
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // メタルピストの床面
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(40, 240, canvas.width - 80, 100);

    // ピストのグリッド・ライン
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(40, 292);
    ctx.lineTo(canvas.width - 40, 292);
    ctx.stroke();

    // センターラインと警告線
    ctx.strokeStyle = "#ef4444";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 240);
    ctx.lineTo(canvas.width / 2, 340);
    ctx.stroke();
}

function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    drawPiste();
    
    if (gameState === 'playing' || gameState === 'round_over') {
        update();
    }

    drawFencer(p1);
    drawFencer(p2);

    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
