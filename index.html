
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FENCING ELITE</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030713;color:#fff;font-family:Arial,sans-serif;touch-action:none}
canvas{width:100%;height:100%;display:block}
button{color:#fff;background:#102641;border:1px solid #587795;border-radius:8px;padding:12px;font-weight:bold;font-size:14px;touch-action:none;user-select:none}
button:active{filter:brightness(1.4)}
.hidden{display:none!important}
.screen{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(#193452,#030713 80%)}
.panel{width:min(460px,100%);padding:24px;text-align:center;background:#071426f5;border:1px solid #587693;border-radius:14px}
.logo{font-size:clamp(34px,8vw,56px);font-weight:1000;font-style:italic;color:#f3ce80}
.sub{font-size:11px;letter-spacing:5px;color:#9db8d5;margin:8px 0 24px}
.buttons{display:grid;gap:12px;margin-top:20px}
.hud{position:fixed;z-index:3;top:8px;left:8px;right:8px;display:grid;grid-template-columns:1fr auto 1fr;gap:7px;align-items:start;pointer-events:none}
.hud button{pointer-events:auto}
.team{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:#071426ed;border:1px solid #345674;border-top:2px solid #38aaff;border-radius:8px}
.team.red{border-top-color:#ff536b}
.name{font-size:clamp(10px,2vw,14px)}
.score{font-size:clamp(27px,5vw,40px);font-weight:900}
.clock{text-align:center;background:#071426ed;border:1px solid #345674;border-radius:8px;padding:5px 12px}
.timer{font-size:clamp(24px,4vw,35px);font-weight:900;font-variant-numeric:tabular-nums}
.round{font-size:10px}
.menu{position:absolute;right:0;top:0;transform:translateY(54px)}
.controls{position:fixed;z-index:4;bottom:0;left:0;right:0;padding:8px 6px 12px;display:flex;justify-content:space-between;align-items:end;gap:5px;background:linear-gradient(0deg,#020610d9,transparent)}
.group{display:flex;gap:4px;align-items:end}
.ctrl{min-width:42px;height:51px;padding:5px;font-size:17px}
.tiny{display:block;font-size:9px;font-weight:normal;color:#b8cce0}
.attack{min-width:75px;height:61px;background:linear-gradient(#a82c43,#4e0c1c);border-color:#ff7180;font-size:13px}
.charge{height:3px;background:#172438;margin-top:4px}
.charge div{height:100%;width:0;background:#ffe28b}
.ready{position:fixed;z-index:4;left:50%;top:43%;transform:translate(-50%,-50%);display:none;min-width:160px;background:#102641ee;border:1px solid #8bb9df;font-size:20px;padding:15px 24px}
.ready.show{display:block}
@media(max-width:600px){
.hud{gap:4px;left:5px;right:5px}
.team{padding:6px;gap:4px}
.controls{padding:7px 5px 12px;gap:3px}
.group{gap:3px}
.ctrl{min-width:39px;height:48px;padding:5px}
.attack{min-width:70px;height:59px;font-size:12px}
.menu{transform:translateY(50px)}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="home" class="screen">
 <div class="panel">
  <div class="logo">FENCING ELITE</div>
  <div class="sub">WORLD CHAMPIONSHIP</div>
  <p>一本を決めろ。</p>
  <div class="buttons">
   <button onclick="start(false)">1 PLAYER / CPU MATCH</button>
   <button onclick="start(true)">2 PLAYERS / LOCAL MATCH</button>
  </div>
  <p style="font-size:11px;color:#91a9c4;line-height:1.8;margin-top:20px">左右で移動・攻撃ボタン長押しで間合いを調整</p>
 </div>
</div>

<div id="hud" class="hud hidden">
 <div class="team"><span class="name">🔵 BLUE</span><span id="ps" class="score">0</span></div>
 <div class="clock"><div id="timer" class="timer">3:00</div><div class="round">FINAL BOUT</div></div>
 <div class="team red"><span id="cs" class="score">0</span><span class="name">RED 🔴</span></div>
 <button class="menu" onclick="home()">☰ MENU</button>
</div>

<div id="controls" class="controls hidden">
 <div class="group">
  <button class="ctrl" id="left">◀<span class="tiny">後退</span></button>
  <button class="ctrl" id="right">▶<span class="tiny">前進</span></button>
  <button class="attack" id="atk">ATTACK<div class="charge"><div id="ch1"></div></div></button>
 </div>
 <div id="g2" class="group">
  <button class="ctrl" id="left2">◀<span class="tiny">後退</span></button>
  <button class="ctrl" id="right2">▶<span class="tiny">前進</span></button>
  <button class="attack" id="atk2">P2 ATTACK<div class="charge"><div id="ch2"></div></div></button>
 </div>
</div>

<button id="ready" class="ready" onclick="playBout()">ON GUARD<br><small>タップして PLAY</small></button>

<div id="result" class="screen hidden">
 <div class="panel">
  <div class="logo">BOUT OVER</div><h2 id="winner"></h2><p id="final"></p>
  <div class="buttons">
   <button onclick="start(two)">もう一度対戦</button>
   <button onclick="home()">ホームに戻る</button>
  </div>
 </div>
</div>

<script>
'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d',{alpha:false});
const $=id=>document.getElementById(id);
let W=0,H=0,D=1,run=false,two=false,phase='home',last=0,time=0,sp=0,sc=0;
let boutLive=false,raf=0,lights=[],scoreFlash=0,scoreColor='#168cff',keys={p:0,c:0},aiTimer=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function fighter(x,dir,color){
 return {x,dir,color,vx:0,step:0,lift:0,phase:Math.random()*6,
 charge:0,charging:false,attack:0,attackTime:.18,reach:0,cool:0,
 stamina:100,hit:false,aiMove:0,aiPause:0};
}
let p=fighter(0,1,'#39caff'),c=fighter(0,-1,'#ff4c68');

function resize(){
 D=Math.min(devicePixelRatio||1,1.15);
 W=innerWidth;H=innerHeight;
 cv.width=Math.round(W*D);cv.height=Math.round(H*D);
 ctx.setTransform(D,0,0,D,0,0);
 makeLights();draw();
}
addEventListener('resize',resize);

function makeLights(){
 lights=[];
 const count=Math.min(200,Math.max(90,Math.floor(W*H/6000)));
 for(let i=0;i<count;i++){
  lights.push({x:Math.random()*W,y:H*.18+Math.random()*H*.36,
   hue:[190,205,225,275,305,345,355,45,125][Math.floor(Math.random()*9)],
   phase:Math.random()*6.28,size:1+Math.random()*1.2,flash:0});
 }
}

function start(local){
 two=local;sp=0;sc=0;time=0;scoreFlash=0;boutLive=false;aiTimer=0;
 run=true;phase='fight';
 p=fighter(W*.36,1,'#39caff');c=fighter(W*.64,-1,'#ff4c68');
 keys.p=keys.c=0;
 $('ps').textContent='0';$('cs').textContent='0';
 $('home').classList.add('hidden');$('result').classList.add('hidden');
 $('hud').classList.remove('hidden');$('controls').classList.remove('hidden');
 $('ready').classList.add('show');
 $('g2').style.display=two?'flex':'none';
 $('ready').innerHTML='ON GUARD<br><small>タップして PLAY</small>';
 last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function playBout(){
 if(!run)return;
 boutLive=true;$('ready').classList.remove('show');last=performance.now();
}
function home(){
 run=false;boutLive=false;phase='home';keys.p=keys.c=0;
 $('home').classList.remove('hidden');$('hud').classList.add('hidden');
 $('controls').classList.add('hidden');$('result').classList.add('hidden');
 $('ready').classList.remove('show');draw();
}

function begin(f){
 if(!run||!boutLive||f.cool>0||f.attack>0||f.charging||f.stamina<3)return;
 f.charging=true;f.charge=0;
}
function release(f){
 if(!f.charging||!run||!boutLive)return;
 f.charging=false;
 f.reach=clamp(f.charge/.35,0,1);
 f.attackTime=.18+f.reach*.04;
 f.attack=f.attackTime;f.hit=false;
 f.stamina=Math.max(0,f.stamina-3-f.reach*6);
 f.cool=.06;
}
function bindAttack(id,f){
 const el=$(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}
  begin(f);
 });
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>
  el.addEventListener(ev,()=>release(f)));
}
function bindMove(id,side,value){
 const el=$(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}
  keys[side]=value;
 });
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>
  el.addEventListener(ev,()=>{if(keys[side]===value)keys[side]=0}));
}
bindAttack('atk',p);bindAttack('atk2',c);
bindMove('left','p',-1);bindMove('right','p',1);
bindMove('left2','c',1);bindMove('right2','c',-1);

addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault();
 if(e.key==='ArrowLeft')keys.p=-1;
 if(e.key==='ArrowRight')keys.p=1;
 if(e.key==='ArrowUp')begin(p);
 if(e.key.toLowerCase()==='a')keys.c=1;
 if(e.key.toLowerCase()==='d')keys.c=-1;
 if(e.key.toLowerCase()==='w')begin(c);
},{passive:false});
addEventListener('keyup',e=>{
 if(e.key==='ArrowLeft'||e.key==='ArrowRight')keys.p=0;
 if(e.key==='ArrowUp')release(p);
 if('ad'.includes(e.key.toLowerCase()))keys.c=0;
 if(e.key.toLowerCase()==='w')release(c);
});

function scorePoint(who){
 if(!run)return;
 if(who==='p'){sp++;scoreColor='#168cff';}
 else{sc++;scoreColor='#ff264c';}
 $('ps').textContent=sp;$('cs').textContent=sc;
 scoreFlash=.8;
 // Light up individual penlights only; never flash the whole screen.
 for(let i=0;i<lights.length;i++){
  if(i%2===0){lights[i].flash=.8;}
 }
 p.x=W*.36;c.x=W*.64;
 for(const f of [p,c]){
  f.attack=0;f.charging=false;f.charge=0;f.cool=.25;f.hit=false;f.vx=0;
 }
 if(sp>=15||sc>=15)finish();
}
function finish(){
 run=false;phase='result';boutLive=false;
 $('winner').textContent=sp===sc?'DRAW':sp>sc?'BLUE WINS':'RED WINS';
 $('final').textContent=sp+' — '+sc;
 $('result').classList.remove('hidden');
}

function update(dt){
 if(!run||!boutLive)return;
 time+=dt;if(time>=180){finish();return}
 for(const f of [p,c]){
  f.cool=Math.max(0,f.cool-dt);
  if(f.charging)f.charge=Math.min(.35,f.charge+dt);
  if(f.attack>0)f.attack=Math.max(0,f.attack-dt);
  f.stamina=Math.min(100,f.stamina+dt*20);
 }
 const gap=c.x-p.x;
 if(!two)thinkCPU(dt,gap);
 moveFencer(p,keys.p*430,dt);
 moveFencer(c,two?keys.c*430:c.aiMove*350,dt);
 p.x=clamp(p.x,W*.12,W*.48);c.x=clamp(c.x,W*.52,W*.88);
 if(c.x-p.x<50){
  const m=(p.x+c.x)/2;p.x=m-25;c.x=m+25;
  if(p.vx>0)p.vx=0;if(c.vx<0)c.vx=0;
 }
 for(const [a,b,who] of [[p,c,'p'],[c,p,'c']]){
  if(a.attack>0&&!a.hit){
   const progress=1-a.attack/a.attackTime;
   const gapAhead=(b.x-a.x)*a.dir;
   const range=105+a.reach*170;
   if(progress>.10&&progress<.91&&gapAhead>-8&&gapAhead<range){
    a.hit=true;scorePoint(who);
   }
  }
 }
 scoreFlash=Math.max(0,scoreFlash-dt);
 for(const l of lights)l.flash=Math.max(0,l.flash-dt*1.5);
 $('timer').textContent=Math.floor((180-time)/60)+':'+String(Math.floor((180-time)%60)).padStart(2,'0');
 $('ch1').style.width=(p.charge/.35*100)+'%';
 $('ch2').style.width=(c.charge/.35*100)+'%';
}

function thinkCPU(dt,gap){
 aiTimer-=dt;
 if(aiTimer<=0){
  aiTimer=.11+Math.random()*.1;
  const distance=gap;
  const playerThreat=p.charging||p.attack>0;
  const canAttack=c.cool<=0&&c.attack<=0&&!c.charging;
  if(playerThreat&&distance<190){
   c.aiMove=distance<95?-1:(Math.random()<.4?1:0);
  }else if(distance>250){
   c.aiMove=1;
  }else if(distance>175){
   c.aiMove=Math.random()<.72?1:0;
  }else if(distance<85){
   c.aiMove=Math.random()<.65?-1:0;
  }else{
   c.aiMove=Math.random()<.55?1:Math.random()<.7?0:-1;
  }
  if(canAttack&&distance<275&&distance>48){
   let chance=distance<140?.72:distance<205?.48:.25;
   if(playerThreat)chance*=.6;
   if(Math.random()<chance){
    begin(c);c.charge=.08+Math.random()*.12;
   }
  }
 }
 if(c.charging){
  if(gap<100)c.aiMove=-1;
  else c.aiMove=0;
  if(c.charge>.13)release(c);
 }
 if(c.attack>0)c.aiMove=gap>100?1:0;
}

function moveFencer(f,target,dt){
 if(target!==0){
  f.vx+=(target-f.vx)*Math.min(1,dt*24);
  f.step+=dt*Math.abs(f.vx)/19;
 }else{
  f.vx*=Math.max(0,1-dt*22);
  if(Math.abs(f.vx)<5)f.vx=0;
 }
 f.x+=f.vx*dt;
 const stride=Math.max(0,Math.sin(f.step*3.2));
 const lift=target!==0?stride*Math.min(4,Math.abs(f.vx)/90):0;
 f.lift+=(lift-f.lift)*Math.min(1,dt*15);
}

function background(){
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#071326');g.addColorStop(.55,'#101f33');g.addColorStop(1,'#050c18');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#20344d';ctx.lineWidth=1;
 for(let i=0;i<11;i++){
  const x=i*W/10;ctx.beginPath();ctx.moveTo(x,0);
  ctx.lineTo(W/2+(x-W/2)*.76,H*.18);ctx.stroke();
 }
 ctx.fillStyle='#e5f2ff';
 for(let i=0;i<15;i++){
  ctx.beginPath();ctx.arc(i*W/14,H*.145,1.3,0,Math.PI*2);ctx.fill();
 }
 const stands=ctx.createLinearGradient(0,H*.17,0,H*.55);
 stands.addColorStop(0,'#101d30');stands.addColorStop(1,'#192a3d');
 ctx.fillStyle=stands;ctx.fillRect(0,H*.17,W,H*.39);

 // Cheap penlight rendering: no shadow blur or full-screen flash.
 const now=performance.now()*.001;
 for(const l of lights){
  const pulse=.5+.5*Math.sin(now*2+l.phase);
  const power=l.flash;
  const hue=power>0?(scoreColor==='#168cff'?205:350):l.hue;
  ctx.globalAlpha=.28+pulse*.32+power*.4;
  ctx.fillStyle=`hsl(${hue},90%,${42+power*28}%)`;
  const size=l.size+power*1.1;
  ctx.fillRect(l.x,l.y,size,size*2.4);
 }
 ctx.globalAlpha=1;

 ctx.fillStyle='#08172a';ctx.fillRect(W*.405,H*.19,W*.19,H*.09);
 ctx.strokeStyle='#395b7c';ctx.strokeRect(W*.405,H*.19,W*.19,H*.09);
 ctx.textAlign='center';ctx.font=`bold ${Math.max(10,W*.013)}px Arial`;
 ctx.fillStyle='#d8e8f8';ctx.fillText('FENCING • WORLD ARENA',W*.5,H*.225);
 ctx.fillStyle='#6ccaff';ctx.fillText('BLUE',W*.455,H*.26);
 ctx.fillStyle='#ff6c80';ctx.fillText('RED',W*.545,H*.26);

 const y=H*.62,L=-W*.05,R=W*1.05,TL=W*.22,TR=W*.78;
 const leftAt=t=>L+(TL-L)*t,rightAt=t=>R+(TR-R)*t,yAt=t=>H+(y-H)*t;
 ctx.beginPath();ctx.moveTo(TL,y);ctx.lineTo(TR,y);ctx.lineTo(R,H);ctx.lineTo(L,H);ctx.closePath();
 const piste=ctx.createLinearGradient(0,y,0,H);
 piste.addColorStop(0,'#8b9dad');piste.addColorStop(.08,'#526a80');
 piste.addColorStop(.4,'#263d54');piste.addColorStop(1,'#142438');
 ctx.fillStyle=piste;ctx.fill();
 ctx.save();ctx.beginPath();ctx.moveTo(TL,y);ctx.lineTo(TR,y);ctx.lineTo(R,H);ctx.lineTo(L,H);ctx.closePath();ctx.clip();
 for(let i=1;i<17;i++){
  const t=i/17;ctx.strokeStyle=i%3===0?'#d6e3ee30':'#d6e3ee0b';
  ctx.beginPath();ctx.moveTo(leftAt(t),yAt(t));ctx.lineTo(rightAt(t),yAt(t));ctx.stroke();
 }
 ctx.restore();
 ctx.strokeStyle='#d5e1ed';ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(TL,y);ctx.lineTo(L,H);ctx.moveTo(TR,y);ctx.lineTo(R,H);
 ctx.moveTo(TL,y);ctx.lineTo(TR,y);ctx.lineTo(R,H);ctx.lineTo(L,H);ctx.closePath();ctx.stroke();
 function line(t,color,width){
  ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();
  ctx.moveTo(leftAt(t),yAt(t));ctx.lineTo(rightAt(t),yAt(t));ctx.stroke();
 }
 line(.78,'#e0e9f488',1.5);line(.44,'#f0f5facc',2);
 line(.27,'#ffcf6a',2.5);line(.13,'#e0e9f488',1.5);
 ctx.strokeStyle='#e0e9f488';ctx.lineWidth=1.5;
 ctx.beginPath();ctx.moveTo(W*.5,y);ctx.lineTo(W*.5,H);ctx.stroke();
}

function limb(x1,y1,x2,y2,width,color){
 ctx.lineCap='round';ctx.strokeStyle='#101a28';ctx.lineWidth=width+2;
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
 ctx.strokeStyle=color;ctx.lineWidth=width;
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}
function drawFencer(f){
 const floor=H*.62,active=f.attack>0;
 const progress=active?1-f.attack/f.attackTime:0;
 const lunge=active?Math.sin(progress*Math.PI)*Math.min(W*.065,58):0;
 const charge=f.charging?f.charge/.35:f.reach;
 ctx.save();ctx.translate(f.x+f.dir*lunge,floor-f.lift);ctx.scale(f.dir,1);
 const bob=Math.sin(performance.now()*.006+f.phase)*1.2;
 const stride=Math.sin(f.step*3.2)*Math.min(7,Math.abs(f.vx)/50);
 const front=active?59+progress*23:27+stride,back=-23-stride*.3;
 limb(-3,-51,back,-25,11,'#eef3f8');
 limb(back,-25,back-10,-3,8,'#eef3f8');
 limb(-1,-50,front,-27,12,'#eef3f8');
 limb(front,-27,front+12,-3,8,'#eef3f8');
 ctx.fillStyle='#0c1726';
 ctx.beginPath();ctx.ellipse(back-7,0,13,4,0,0,Math.PI*2);ctx.fill();
 ctx.beginPath();ctx.ellipse(front+14,0,13,4,0,0,Math.PI*2);ctx.fill();

 ctx.fillStyle='#eef3f8';
 ctx.beginPath();ctx.moveTo(-15,-108+bob);ctx.lineTo(13,-109+bob);
 ctx.lineTo(20,-75);ctx.lineTo(8,-49);ctx.lineTo(-13,-51);ctx.lineTo(-22,-77);
 ctx.closePath();ctx.fill();ctx.strokeStyle='#9eafc1';ctx.lineWidth=1;ctx.stroke();
 ctx.fillStyle=f.color;ctx.fillRect(-8,-102,15,5);

 ctx.fillStyle='#19283a';ctx.beginPath();ctx.ellipse(2,-126+bob,15,17,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#9db0c3';ctx.beginPath();ctx.ellipse(5,-126+bob,10,12,0,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#2c425a';ctx.lineWidth=1;
 for(let i=-3;i<=11;i+=3){ctx.beginPath();ctx.moveTo(i,-136+bob);ctx.lineTo(i+3,-116+bob);ctx.stroke()}

 const armX=active?82:f.charging?39+charge*35:43,armY=active?-89:-82;
 limb(8,-100,23,-92,8,'#eef3f8');limb(23,-92,armX,armY,7,'#eef3f8');
 ctx.fillStyle='#15243a';ctx.beginPath();ctx.arc(armX,armY,5,0,Math.PI*2);ctx.fill();
 const blade=118+charge*80;
 ctx.strokeStyle='#9db9d4';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(armX,armY);ctx.lineTo(armX+blade,armY-3);ctx.stroke();
 ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(armX,armY-1);ctx.lineTo(armX+blade,armY-4);ctx.stroke();
 if(f.charging){ctx.strokeStyle='#ffe28b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-126,20+charge*7,Math.PI,Math.PI*2);ctx.stroke()}
 ctx.restore();
 ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(f.x,floor+5,34,6,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#15243a';ctx.fillRect(f.x-34,floor+11,68,4);
 ctx.fillStyle=f.color;ctx.fillRect(f.x-34,floor+11,68*f.stamina/100,4);
}
function draw(){
 if(!W||!H)return;background();
 if(phase!=='home'){drawFencer(p);drawFencer(c)}
 if(phase==='fight'&&boutLive){
  ctx.fillStyle='#d6e6f6';ctx.textAlign='center';ctx.font='bold 11px Arial';
  ctx.fillText(two?'P1: ← → / ↑　P2: A D / W':'← → MOVE • HOLD ATTACK TO SET REACH',W/2,H*.38);
 }
}
function loop(now){
 if(!run)return;
 const dt=Math.min(.025,Math.max(0,(now-last)/1000));last=now;
 update(dt);draw();if(run)raf=requestAnimationFrame(loop);
}
resize();
</script>
</body>
</html>
