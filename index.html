
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FENCING ELITE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07101e;color:#fff;font-family:Arial,sans-serif;overflow:hidden;touch-action:manipulation}canvas{display:block;width:100vw;height:100dvh}button{border:1px solid #5d7698;background:#142641;color:#fff;border-radius:12px;padding:13px 20px;font-weight:bold;font-size:16px;touch-action:none}button:active{background:#2878b8}.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1b3655,#050914 80%);z-index:5;padding:20px}.panel{width:min(540px,100%);text-align:center;background:#0b1729ee;border:1px solid #365579;border-radius:22px;padding:24px;box-shadow:0 0 45px #0008}.logo{font-size:clamp(34px,8vw,58px);font-weight:1000;font-style:italic;letter-spacing:2px;color:#f2ca69;text-shadow:0 0 25px #c8912a55}.sub{color:#9eb7d3;letter-spacing:5px;margin-bottom:25px}.buttons{display:grid;gap:12px;margin-top:20px}.hidden{display:none!important}.hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2;gap:8px}.scorebox{background:#081426dd;border:1px solid #3c5878;border-radius:12px;padding:8px 14px;text-align:center;min-width:95px}.score{font-size:32px;font-weight:900}.name{font-size:12px;color:#aac2df}.timer{font-size:26px;font-weight:bold}.hud button{pointer-events:auto;padding:9px 12px;font-size:13px}.controls{position:fixed;bottom:15px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 16px;z-index:3;gap:12px}.group{display:flex;gap:8px;align-items:end}.ctrl{min-width:64px;min-height:62px;font-size:14px;background:#10213beF}.attack{min-width:100px;min-height:76px;background:#812c36;border-color:#f17b82;font-size:18px}.small{font-size:11px;color:#b4c5da}.chargebar{height:5px;background:#24354c;border-radius:9px;margin-top:5px;overflow:hidden}.chargefill{height:100%;width:0;background:#ffce64}.settings{display:grid;gap:12px;text-align:left;margin-top:18px}.settings label{display:flex;justify-content:space-between;gap:10px}.settings input{width:60%}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="home" class="screen"><div class="panel"><div class="logo">FENCING ELITE</div><div class="sub">DUEL • HONOR • VICTORY</div><p>反射神経と戦術で勝利をつかめ。</p><div class="buttons"><button onclick="start(false)">1 PLAYER　—　CPU対戦</button><button onclick="start(true)">2 PLAYERS　—　対人戦</button><button onclick="showSettings()">選手設定</button></div><p class="small">移動：左右キー / 画面ボタン　攻撃：長押しで間合いを伸ばす</p></div></div>
<div id="settings" class="screen hidden"><div class="panel"><div class="logo" style="font-size:32px">PLAYER SETTINGS</div><div class="settings"><label>移動スピード <input id="speed" type="range" min="0.7" max="1.8" step=".1" value="1.3"></label><label>攻撃スピード <input id="attackSpeed" type="range" min="0.7" max="1.8" step=".1" value="1.4"></label></div><div class="buttons"><button onclick="hideSettings()">戻る</button></div></div></div>
<div id="hud" class="hud hidden"><div class="scorebox"><div class="name">BLUE</div><div id="ps" class="score">0</div></div><div class="scorebox"><div id="timer" class="timer">3:00</div><div class="name" id="status">READY</div></div><div class="scorebox"><div class="name">RED</div><div id="cs" class="score">0</div></div><button onclick="backHome()">☰ MENU</button></div>
<div id="controls" class="controls hidden"><div class="group"><button class="ctrl" id="left">◀<br><span class="small">後退</span></button><button class="ctrl" id="right">▶<br><span class="small">前進</span></button><button class="attack" id="attack">ATTACK<div class="chargebar"><div id="chargefill" class="chargefill"></div></div></button></div><div class="group" id="p2controls"><button class="ctrl" id="left2">◀<br><span class="small">P2後退</span></button><button class="ctrl" id="right2">▶<br><span class="small">P2前進</span></button><button class="attack" id="attack2">P2 ATTACK<div class="chargebar"><div id="chargefill2" class="chargefill"></div></div></button></div></div>
<div id="result" class="screen hidden"><div class="panel"><div class="logo" style="font-size:38px">BOUT OVER</div><h2 id="winner">WINNER</h2><p id="finalscore"></p><div class="buttons"><button onclick="start(twoPlayer)">もう一度対戦</button><button onclick="backHome()">ホームに戻る</button></div></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
let W=0,H=0,dpr=1,raf=0,last=0,twoPlayer=false,running=false,elapsed=0,scoreP=0,scoreC=0,phase='home',flash=0;
let speedSetting=1.3,attackSetting=1.4;
const $=id=>document.getElementById(id);
function resize(){dpr=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function fighter(x,dir,color){return{x,dir,color,move:0,attackT:0,attackDur:.22,charging:false,charge:0,reach:0,cool:0,stamina:100,hit:false,lean:0}}
let p=fighter(0,1,'#51c9ff'),c=fighter(0,-1,'#ff5e68');
function resetPositions(){p.x=W*.31;c.x=W*.69;p.dir=1;c.dir=-1;for(let f of [p,c]){f.attackT=0;f.charging=false;f.charge=0;f.reach=0;f.cool=0;f.hit=false;f.stamina=100}}
function showSettings(){$('home').classList.add('hidden');$('settings').classList.remove('hidden')}
function hideSettings(){speedSetting=+$('speed').value;attackSetting=+$('attackSpeed').value;$('settings').classList.add('hidden');$('home').classList.remove('hidden')}
function backHome(){running=false;phase='home';$('hud').classList.add('hidden');$('controls').classList.add('hidden');$('result').classList.add('hidden');$('settings').classList.add('hidden');$('home').classList.remove('hidden')}
function start(two){twoPlayer=two;scoreP=scoreC=0;elapsed=0;running=true;phase='fight';flash=0;resetPositions();$('home').classList.add('hidden');$('settings').classList.add('hidden');$('result').classList.add('hidden');$('hud').classList.remove('hidden');$('controls').classList.remove('hidden');$('p2controls').style.visibility=two?'visible':'hidden';$('ps').textContent=0;$('cs').textContent=0;$('status').textContent='FIGHT';last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function beginAttack(f){if(!running||phase!=='fight'||f.cool>0||f.attackT>0||f.stamina<8)return;f.charging=true;f.charge=0}
function releaseAttack(f){if(!f.charging)return;f.charging=false;f.reach=Math.min(1,f.charge/.8);f.attackDur=(.23-.035*f.reach)/attackSetting;f.attackT=f.attackDur;f.hit=false;f.stamina=Math.max(0,f.stamina-8-f.reach*10);f.cool=.16}
function bindHold(id,f){let el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);beginAttack(f)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,e=>{e.preventDefault();releaseAttack(f)})}
bindHold('attack',p);bindHold('attack2',c);
function bindMove(id,field,value){let el=$(id),on=()=>{keys[field]=value},off=()=>{if(keys[field]===value)keys[field]=0};el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);on()});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,off))}
let keys={p:0,c:0};
bindMove('left','p',-1);bindMove('right','p',1);bindMove('left2','c',1);bindMove('right2','c',-1);
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','a','d','w','A','D','W'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')keys.p=-1;if(e.key==='ArrowRight')keys.p=1;if(e.key==='ArrowUp')beginAttack(p);if(e.key.toLowerCase()==='a')keys.c=1;if(e.key.toLowerCase()==='d')keys.c=-1;if(e.key.toLowerCase()==='w')beginAttack(c)});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')keys.p=0;if(e.key==='ArrowUp')releaseAttack(p);if(e.key.toLowerCase()==='a'||e.key.toLowerCase()==='d')keys.c=0;if(e.key.toLowerCase()==='w')releaseAttack(c)});
function score(who){if(phase!=='fight')return;if(who==='p')scoreP++;else scoreC++;$('ps').textContent=scoreP;$('cs').textContent=scoreC;flash=.28;resetPositions();if(scoreP>=15||scoreC>=15)finish();else{$('status').textContent='TOUCHE!';setTimeout(()=>{if(running&&phase==='fight')$('status').textContent='FIGHT'},500)}}
function finish(){phase='result';running=false;$('winner').textContent=scoreP===scoreC?'DRAW':scoreP>scoreC?'BLUE WINS':'RED WINS';$('finalscore').textContent=`${scoreP} — ${scoreC}`;$('result').classList.remove('hidden');$('status').textContent='END'}
function update(dt){if(!running)return;elapsed+=dt;if(elapsed>=180){finish();return}for(let f of [p,c]){f.cool=Math.max(0,f.cool-dt);if(f.charging)f.charge=Math.min(.8,f.charge+dt);if(f.attackT>0)f.attackT=Math.max(0,f.attackT-dt);f.stamina=Math.min(100,f.stamina+dt*13)}
if(twoPlayer){p.move=keys.p;c.move=keys.c}else{let gap=c.x-p.x;let target=gap>125?1:gap<95?-1:0;c.move=target;if(Math.random()<dt*.65&&gap<220&&gap>75&&c.cool<=0&&!c.charging&&c.attackT<=0)beginAttack(c);if(c.charging&&c.charge>.2+Math.random()*.28)releaseAttack(c)}
let sp=260*speedSetting; p.x+=p.move*sp*dt;c.x+=c.move*sp*dt;
p.x=Math.max(35,Math.min(W-35,p.x));c.x=Math.max(35,Math.min(W-35,c.x));let minGap=56;if(c.x-p.x<minGap){let mid=(p.x+c.x)/2;p.x=mid-minGap/2;c.x=mid+minGap/2}
if(flash>0)flash-=dt;
for(let [a,b,who] of [[p,c,'p'],[c,p,'c']]){if(a.attackT>0&&!a.hit){let progress=1-a.attackT/a.attackDur;if(progress>.38&&progress<.9){let reach=105+a.reach*70;let dist=Math.abs(b.x-a.x);if(dist<reach){a.hit=true;score(who)}}}}
$('timer').textContent=`${Math.floor((180-elapsed)/60)}:${String(Math.floor((180-elapsed)%60)).padStart(2,'0')}`;$('chargefill').style.width=(p.charge/.8*100)+'%';$('chargefill2').style.width=(c.charge/.8*100)+'%';$('status').textContent=flash>0?'TOUCHE!':'FIGHT'}
function drawBackground(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a172a');g.addColorStop(.55,'#172a40');g.addColorStop(1,'#030710');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#101d30';ctx.fillRect(0,H*.2,W,H*.35);
for(let i=0;i<W/9;i++){let x=i*9;ctx.fillStyle=`hsl(${(i*31+performance.now()*.035)%360},75%,${30+(i%3)*8}%)`;ctx.fillRect(x,H*.25+(i%5)*4,4,9)}
let y=H*.68;ctx.fillStyle='#c1c8d0';ctx.fillRect(0,y,W,5);ctx.fillStyle='#dfe6ec';ctx.fillRect(0,y+5,W,H-y-5);ctx.fillStyle='#8d9aa8';ctx.fillRect(0,y+5,W,2);
ctx.strokeStyle='#8e9eae';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2,y);ctx.lineTo(W/2,H);ctx.stroke();ctx.fillStyle='#a7b5c3';ctx.fillRect(W*.18,y,W*.64,3)}
function drawFencer(f){let x=f.x,y=H*.68,dir=f.dir,charge=f.charging?f.charge/.8:f.reach,attacking=f.attackT>0;ctx.save();ctx.translate(x,y);ctx.scale(dir,1);let lunge=attacking?Math.sin(Math.PI*Math.min(1,(1-f.attackT/f.attackDur)))*22*(1+charge*.8):0;ctx.translate(lunge,0);ctx.lineCap='round';ctx.lineJoin='round';
ctx.strokeStyle='#121a26';ctx.lineWidth=17;ctx.beginPath();ctx.moveTo(-4,-63);ctx.lineTo(-11,-30);ctx.lineTo(-18,-7);ctx.moveTo(-8,-33);ctx.lineTo(10,-12);ctx.stroke();
ctx.strokeStyle=f.color;ctx.lineWidth=19;ctx.beginPath();ctx.moveTo(-3,-67);ctx.lineTo(7,-37);ctx.lineTo(16,-13);ctx.stroke();
ctx.fillStyle='#d9e3eb';ctx.beginPath();ctx.ellipse(2,-84,13,16,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111b2b';ctx.fillRect(-11,-91,26,8);ctx.fillStyle=f.color;ctx.fillRect(-9,-89,21,3);
ctx.strokeStyle='#e8edf3';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(5,-62);ctx.lineTo(23,-45);ctx.stroke();
ctx.strokeStyle='#e6e9ed';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(23,-45);let armX=attacking?70+charge*40:charging?35+charge*25:42;let armY=attacking?-48:-39;ctx.lineTo(armX,armY);ctx.stroke();
ctx.strokeStyle='#d9e3ed';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(armX,armY);ctx.lineTo(armX+105+charge*70,armY-3);ctx.stroke();ctx.strokeStyle='#f7fbff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(armX,armY-1);ctx.lineTo(armX+105+charge*70,armY-4);ctx.stroke();
ctx.fillStyle=f.color;ctx.fillRect(-22,-7,12,7);ctx.fillRect(11,-7,12,7);
if(f.charging){ctx.strokeStyle='#ffdf83';ctx.lineWidth=2;ctx.beginPath();ctx.arc(5,-83,22+charge*12,Math.PI,Math.PI*2);ctx.stroke()}
ctx.restore();
ctx.fillStyle='#14243b';ctx.fillRect(f.x-32,y+18,64,5);ctx.fillStyle=f.color;ctx.fillRect(f.x-32,y+18,64*f.stamina/100,5)}
function draw(){drawBackground();drawFencer(p);drawFencer(c);if(phase==='fight'){ctx.fillStyle='#fff';ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.fillText(twoPlayer?'P1: ← → / ↑':'← → MOVE / ↑ ATTACK',W*.25,H*.16);ctx.fillText(twoPlayer?'P2: A D / W':'HOLD ATTACK TO EXTEND REACH',W*.75,H*.16)}}
function loop(now){if(!running)return;let dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();raf=requestAnimationFrame(loop)}
draw();
</script>
</body>
</html>
