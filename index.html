<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>FENCING ELITE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b16;color:#f4f8ff;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation}button,input,select{font:inherit}button{color:inherit;cursor:pointer;touch-action:manipulation}#app{height:100dvh;position:relative;overflow:hidden;background:#061020}
.screen{position:absolute;inset:0}#title{z-index:10;background:#061020 url("title-screen.jpg") center center/cover no-repeat}
#startHotspot{position:absolute;left:34%;top:78%;width:32%;height:10%;border:0;border-radius:16px;background:transparent;z-index:2}#startHotspot:focus-visible{outline:3px solid white;background:#ffffff20}
#fallback{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(ellipse,#174c85,#050b16 70%);padding:20px}#fallback h1{font-size:clamp(42px,10vw,90px);font-style:italic;line-height:.9;margin:0}#fallback span{display:block;color:#42aaff}#fallback button{margin-top:22px;padding:14px 44px;border:1px solid white;background:#ffffff15;letter-spacing:.25em}
#menu,#result{display:none;z-index:8;align-items:center;justify-content:center;padding:14px;background:#030914ed;backdrop-filter:blur(8px)}.panel{width:min(700px,100%);max-height:96%;overflow:auto;border:1px solid #31557d;background:linear-gradient(145deg,#132744f5,#07101df5);border-radius:16px;padding:clamp(16px,4vw,28px);box-shadow:0 20px 80px #0009}.brand{text-align:center;font-size:clamp(28px,6vw,45px);font-weight:1000;font-style:italic;margin:0}.brand span{color:#4aaaff}.sub{text-align:center;color:#9cb5d5;letter-spacing:.2em;font-size:11px;margin:7px 0 18px}.label{color:#82bfff;font-size:12px;font-weight:800;letter-spacing:.14em;margin:16px 0 8px}.row{display:flex;gap:8px}.choice{flex:1;border:1px solid #365574;background:#0b1728;padding:12px 7px;border-radius:9px;font-weight:800}.choice.active{border-color:#4daaff;background:#12345a}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:flex;flex-direction:column;gap:5px;color:#b8c9df;font-size:12px}.field input,.field select{width:100%;min-width:0;border:1px solid #304966;background:#071321;color:white;border-radius:8px;padding:10px;font-size:14px}.primary,.secondary{width:100%;border-radius:9px;padding:14px;font-weight:1000;margin-top:18px}.primary{border:0;background:linear-gradient(90deg,#1476df,#2ea7ff);letter-spacing:.12em}.secondary{margin-top:8px;border:1px solid #365574;background:#0b1728}
#game{display:none;background:#061020;overflow:hidden}#stadium{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 25%,#1a3553,#0a1526 48%,#040812)}#crowd{position:absolute;inset:0;opacity:.6;background-image:radial-gradient(circle,#5e94c9 1px,transparent 2px),radial-gradient(circle,#d7ecff 1px,transparent 2px);background-size:19px 22px,31px 29px;background-position:0 0,8px 11px;mask-image:linear-gradient(#000,transparent 55%)}
#top{position:absolute;z-index:4;top:env(safe-area-inset-top,0);left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:#030914b8;font-size:11px;letter-spacing:.15em;color:#aac3e2}#menuBtn{background:#172b45;border:1px solid #456281;border-radius:8px;padding:8px 12px;color:white}
#scoreboard{position:absolute;z-index:4;top:52px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:clamp(12px,4vw,40px);padding:8px 16px;background:#06101ddd;border:1px solid #34506e;border-radius:11px;white-space:nowrap}.side{text-align:center;min-width:56px}.name{font-size:11px;max-width:115px;overflow:hidden;text-overflow:ellipsis}.num{font-size:clamp(32px,7vw,52px);font-weight:1000;line-height:1.05}.sep{color:#8195b2;font-size:24px}
#piste{position:absolute;left:3%;right:3%;top:52%;height:20%;transform:perspective(500px) rotateX(16deg);background:linear-gradient(#a7b5c5,#e1e7ef 25%,#73849a 50%,#c9d4e0 75%,#566b83);border-block:4px solid #30445d;box-shadow:0 20px 55px #000b}
#lineL,#lineR{position:absolute;top:0;bottom:0;width:3px;background:#ff4e73;box-shadow:0 0 12px #ff4e73}#lineL{left:12%}#lineR{right:12%}.center{position:absolute;top:0;bottom:0;left:50%;width:3px;background:white}.start{position:absolute;top:0;bottom:0;left:35%;width:2px;background:white}.start.r{left:65%}
#fencers{position:absolute;left:2%;right:2%;top:38%;height:43%;z-index:2}.fencer{position:absolute;bottom:0;width:30%;height:100%;--suit:#d9e5f2}.body{position:absolute;left:28%;top:31%;width:38%;height:49%;background:linear-gradient(100deg,#273a51,var(--suit) 45%,#8093aa 72%,#293d55);border:2px solid #d9e5f2;border-radius:35% 25% 20% 18%;transform:skew(-13deg) rotate(-9deg)}.mask{position:absolute;left:35%;top:13%;width:32%;height:25%;border-radius:48%;background:repeating-linear-gradient(0deg,#8999ab 0 2px,#28384c 2px 4px);border:4px solid #d7e2f1;transform:rotate(-12deg)}.leg{position:absolute;top:65%;width:16%;height:35%;border-radius:10px;background:linear-gradient(90deg,#17273d,#d5e0ee 55%,#72869e);transform-origin:50% 5%}.leg.one{left:35%;transform:rotate(18deg)}.leg.two{left:54%;transform:rotate(-30deg)}.arm{position:absolute;left:50%;top:38%;width:48%;height:11%;border-radius:15px;background:linear-gradient(#eef5ff,#8093a8);transform-origin:8% 50%;transform:rotate(-7deg);border:1px solid #e8f2ff}.glove{position:absolute;left:88%;top:34%;width:15%;height:16%;border-radius:40%;background:#18283b;border:2px solid #a9c1dc}.blade{position:absolute;left:96%;top:40%;width:70%;height:2px;background:linear-gradient(90deg,#e9f5ff,#a8d5ff);transform-origin:left center;box-shadow:0 0 7px #86c8ff}.fencer.attacking .arm{transform:rotate(-2deg) translateX(14%)}.fencer.attacking .blade{transform:rotate(0) scaleX(1.25)}.fencer.retreating .body{transform:skew(-13deg) rotate(-17deg) translateX(-7%)}
#fencerP{left:8%;color:#168cff}#fencerC{right:8%;transform:scaleX(-1);color:#ff4168}
#status{position:absolute;z-index:4;top:29%;left:0;right:0;text-align:center;font-size:clamp(22px,4vw,36px);font-weight:1000;letter-spacing:.15em;text-shadow:0 3px 18px #000}#message{position:absolute;z-index:4;bottom:23%;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.12em;color:#c2d8f1;text-shadow:0 2px 8px black}
#controls{position:absolute;z-index:5;left:0;right:0;bottom:calc(9px + env(safe-area-inset-bottom,0));display:flex;justify-content:space-between;gap:8px;padding:0 9px}.group{display:flex;gap:5px;align-items:end}.ctrl{min-width:49px;min-height:52px;padding:6px;border:1px solid #6785a8;background:#0b1c30ed;border-radius:10px;font-weight:900;color:white}.ctrl small{display:block;font-size:9px;color:#a7c3e4}.ctrl.attack{min-width:64px;background:linear-gradient(#1764ad,#0b2d52);border-color:#64b9ff}.ctrl.pressed{background:#256db0;transform:scale(.97)}#flash{display:none;position:absolute;z-index:7;inset:0;align-items:center;justify-content:center;background:#07101b88;font-size:clamp(28px,7vw,58px);font-weight:1000;font-style:italic;text-shadow:0 0 25px currentColor;pointer-events:none}
@media(max-width:600px){#scoreboard{gap:12px;padding:7px 11px}.num{font-size:34px}#fencers{left:0;right:0;top:40%;height:39%}.fencer{width:32%}#fencerP{left:5%}#fencerC{right:5%}.ctrl{min-width:43px;font-size:11px}.ctrl.attack{min-width:57px}#controls{padding:0 5px}.group{gap:4px}}
</style></head><body><div id="app">
<section id="title" class="screen" aria-label="タイトル画面"><div id="fallback"><h1>FENCING <span>ELITE</span></h1><p>TACTICS · SPEED · PRECISION</p><button id="fallbackStart">▶ START ◀</button></div><button id="startHotspot" aria-label="START ゲーム開始"></button></section>
<section id="menu" class="screen"><div class="panel"><h1 class="brand">FENCING <span>ELITE</span></h1><div class="sub">TACTICS · SPEED · PRECISION</div><div class="label">GAME MODE</div><div class="row"><button class="choice active" data-mode="cpu">1 PLAYER vs CPU</button><button class="choice" data-mode="2p">2 PLAYER LOCAL</button></div><div class="label">FENCERS</div><div class="fields"><label class="field">LEFT PLAYER NAME<input id="nameP" maxlength="18" value="BLUE"></label><label class="field">RIGHT PLAYER NAME<input id="nameC" maxlength="18" value="RED"></label><label class="field">LEFT UNIFORM COLOR<input id="colorP" type="color" value="#168cff"></label><label class="field">RIGHT UNIFORM COLOR<input id="colorC" type="color" value="#ff4168"></label><label class="field">LEFT SPEED<select id="speedP"><option value=".24">Standard</option><option value=".30">Fast</option><option value=".19">Heavy</option></select></label><label class="field">CPU LEVEL<select id="levelC"><option value=".65">Easy</option><option value=".85" selected>Normal</option><option value="1.05">Hard</option></select></label></div><button id="begin" class="primary">▶ START MATCH</button><button id="backTitle" class="secondary">TITLE SCREEN</button></div></section>
<section id="game" class="screen"><div id="stadium"><div id="crowd"></div></div><div id="top"><span>FENCING ELITE · MATCH</span><button id="menuBtn">☰ MENU</button></div><div id="scoreboard"><div class="side"><div id="scoreNameP" class="name">BLUE</div><div id="scoreP" class="num">0</div></div><div class="sep">:</div><div class="side"><div id="scoreNameC" class="name">RED</div><div id="scoreC" class="num">0</div></div></div><div id="piste"><div id="lineL"></div><div id="lineR"></div><div class="center"></div><div class="start"></div><div class="start r"></div></div><div id="fencers"><div id="fencerP" class="fencer"><div class="leg one"></div><div class="leg two"></div><div class="body"></div><div class="mask"></div><div class="arm"></div><div class="glove"></div><div class="blade"></div></div><div id="fencerC" class="fencer"><div class="leg one"></div><div class="leg two"></div><div class="body"></div><div class="mask"></div><div class="arm"></div><div class="glove"></div><div class="blade"></div></div></div><div id="status">EN GARDE</div><div id="message">MOVE · ATTACK · KEEP YOUR DISTANCE</div><div id="controls"><div class="group"><button class="ctrl" data-side="p" data-act="back">◀<small>BACK (A)</small></button><button class="ctrl" data-side="p" data-act="forward">▶<small>ADVANCE (D)</small></button><button class="ctrl attack" data-side="p" data-act="attack">THRUST<small>F / SPACE</small></button></div><div class="group" id="rightControls"><button class="ctrl attack" data-side="c" data-act="attack">THRUST<small>ENTER</small></button><button class="ctrl" data-side="c" data-act="forward">◀<small>ADVANCE (←)</small></button><button class="ctrl" data-side="c" data-act="back">▶<small>BACK (→)</small></button></div></div><div id="flash"></div></section>
<section id="result" class="screen"><div class="panel" style="text-align:center"><h1 id="resultTitle" class="brand">VICTORY</h1><p id="resultText"></p><button id="again" class="primary">REMATCH</button><button id="resultMenu" class="secondary">MENU</button></div></section></div>
<script>
(()=>{const $=id=>document.getElementById(id);const title=$('title'),menu=$('menu'),game=$('game'),result=$('result');let mode='cpu',running=false,phase='menu',last=0,raf=0,timer=0;const S={p:{x:.34,score:0,cd:0,energy:0},c:{x:.66,score:0,cd:0,energy:0}},I={p:{forward:false,back:false,attack:false},c:{forward:false,back:false,attack:false}};let speedP=.24,levelC=.85;
function clearInputs(){for(const s of ['p','c'])for(const a of ['forward','back','attack'])I[s][a]=false}
function showMenu(){running=false;cancelAnimationFrame(raf);clearTimeout(timer);game.style.display='none';result.style.display='none';title.style.display='none';menu.style.display='flex';phase='menu'}
function showTitle(){running=false;cancelAnimationFrame(raf);menu.style.display='none';game.style.display='none';result.style.display='none';title.style.display='block';phase='menu'}
function start(){clearTimeout(timer);S.p.x=.34;S.c.x=.66;S.p.score=S.c.score=0;S.p.cd=S.c.cd=S.p.energy=S.c.energy=0;clearInputs();speedP=+$('speedP').value;levelC=+$('levelC').value;$('scoreNameP').textContent=$('nameP').value.trim()||'BLUE';$('scoreNameC').textContent=$('nameC').value.trim()||'RED';for(const [s,id] of [['p','P'],['c','C']]){const col=$('color'+id).value;$('fencer'+id).style.setProperty('--suit',col);$('fencer'+id).style.color=col;$('scoreName'+id).style.color=col;$('score'+id).style.color=col}$('rightControls').style.display=mode==='2p'?'flex':'none';menu.style.display='none';title.style.display='none';result.style.display='none';game.style.display='block';phase='intro';running=true;$('status').textContent='EN GARDE';$('message').textContent='READY';render();timer=setTimeout(()=>{if(running){phase='fight';$('status').textContent='ALLEZ!';$('message').textContent='FIGHT!'}},1600);last=performance.now();raf=requestAnimationFrame(loop)}
function render(){for(const s of ['p','c']){$(s==='p'?'fencerP':'fencerC').style.left=(s==='p'?(S.p.x-.1)*100:(1-S.c.x-.15)*100)+'%';$('score'+(s==='p'?'P':'C')).textContent=S[s].score}}
function award(who,why){if(!running||phase!=='fight')return;phase='point';S[who].score++;render();const id=who==='p'?'P':'C',name=$('name'+id).value.trim()||(who==='p'?'BLUE':'RED');$('status').textContent='TOUCHÉ!';$('message').textContent=name+' · '+why;const flash=$('flash');flash.style.display='flex';flash.style.color=$('color'+id).value;flash.textContent='TOUCHÉ! '+name;setTimeout(()=>flash.style.display='none',550);if(S[who].score>=15){timer=setTimeout(()=>finish(who),950);return}timer=setTimeout(()=>{if(!running)return;S.p.x=.34;S.c.x=.66;S.p.cd=S.c.cd=0;phase='fight';$('status').textContent='ALLEZ!';$('message').textContent='FIGHT!';render()},950)}
function finish(who){running=false;phase='result';game.style.display='none';result.style.display='flex';$('resultTitle').textContent='VICTORY';$('resultTitle').style.color=$('color'+(who==='p'?'P':'C')).value;$('resultText').textContent=($('name'+(who==='p'?'P':'C')).value||who.toUpperCase())+' wins · '+S.p.score+' : '+S.c.score}
function move(s,dt){const f=S[s],o=S[s==='p'?'c':'p'];let fw=I[s].forward,bk=I[s].back;if(s==='c'&&mode==='cpu'){const d=f.x-o.x;fw=d>.25;bk=d<.15;if(d<.38&&Math.random()<.012)I.c.attack=true;else if(Math.random()<.03)I.c.attack=false}const dir=(fw?1:0)-(bk?1:0),dx=(s==='p'?dir:-dir)*(s==='p'?speedP:.24*(mode==='cpu'?levelC:1))*dt;f.x+=dx;
 // Retreating beyond your own end line gives the opponent a point.
 if(s==='p'&&f.x<.12){award('c','END-LINE');return}if(s==='c'&&f.x>.88){award('p','END-LINE');return}
 // Collision boundary: no passing through the opponent.
 const gap=.16;if(s==='p'&&f.x>o.x-gap)f.x=o.x-gap;if(s==='c'&&f.x<o.x+gap)f.x=o.x+gap;f.x=Math.max(.015,Math.min(.985,f.x));
 if(I[s].attack&&f.cd<=0&&phase==='fight'){f.cd=.65;const el=$(s==='p'?'fencerP':'fencerC');el.classList.add('attacking');setTimeout(()=>el.classList.remove('attacking'),260);const d=Math.abs(S.p.x-S.c.x),reach=.31+f.energy*.12;if(d<reach&&Math.random()<(s==='p'?.78:(mode==='cpu'?.58:.78))){award(s,'TOUCHÉ');return}}
 f.cd=Math.max(0,f.cd-dt);if(!I[s].attack)f.energy=Math.max(0,f.energy-dt);else f.energy=Math.min(1,f.energy+dt*.55)}
function loop(t){if(!running)return;const dt=Math.min((t-last)/1000,.04);last=t;if(phase==='fight'){move('p',dt);if(running&&phase==='fight')move('c',dt);if(running&&phase==='fight'&&mode==='cpu'&&I.c.attack&&Math.abs(S.p.x-S.c.x)<.24&&Math.random()<.025)award('c','TOUCHÉ')}render();raf=requestAnimationFrame(loop)}
function setI(s,a,v){if(s==='c'&&mode==='cpu'&&a!=='attack')return;I[s][a]=v}
$('startHotspot').onclick=showMenu;$('fallbackStart').onclick=showMenu;$('begin').onclick=start;$('backTitle').onclick=showTitle;$('menuBtn').onclick=showMenu;$('again').onclick=start;$('resultMenu').onclick=showMenu;
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));$('rightControls').style.display=mode==='2p'?'flex':'none'});
document.querySelectorAll('.ctrl').forEach(b=>{const s=b.dataset.side,a=b.dataset.act;const down=e=>{e.preventDefault();b.classList.add('pressed');setI(s,a,true)};const up=e=>{e.preventDefault();b.classList.remove('pressed');setI(s,a,false)};b.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,up))});
const key=e=>e.key===' '?'space':e.key.toLowerCase();addEventListener('keydown',e=>{const k=key(e);if(['arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();if(k==='a')setI('p','back',true);if(k==='d')setI('p','forward',true);if(k==='f'||k==='space')setI('p','attack',true);if(mode==='2p'){if(k==='arrowleft')setI('c','forward',true);if(k==='arrowright')setI('c','back',true);if(k==='enter')setI('c','attack',true)}else{if(k==='arrowleft')setI('p','forward',true);if(k==='arrowright')setI('p','back',true)}});
addEventListener('keyup',e=>{const k=key(e);if(k==='a')setI('p','back',false);if(k==='d')setI('p','forward',false);if(k==='f'||k==='space')setI('p','attack',false);if(k==='arrowleft'){if(mode==='2p')setI('c','forward',false);else setI('p','forward',false)}if(k==='arrowright'){if(mode==='2p')setI('c','back',false);else setI('p','back',false)}if(k==='enter')setI('c','attack',false)});
const im=new Image();im.onload=()=>{$('fallback').style.display='none'};im.onerror=()=>{$('fallback').style.display='flex';$('startHotspot').style.display='none'};im.src='title-screen.jpg';
})();
</script></body></html>
