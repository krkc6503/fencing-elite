
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FENCING ELITE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080e19;color:#fff;font-family:Arial,sans-serif;touch-action:manipulation}
button,input{font:inherit}
button{border:1px solid #394a62;background:#18263b;color:#fff;border-radius:12px;padding:12px;font-weight:bold}
button:active{transform:scale(.97)}
.screen{display:none;position:absolute;inset:0;overflow:auto;padding:22px 16px}
.screen.active{display:block}
.wrap{max-width:780px;margin:auto}
.logo{font-size:clamp(34px,8vw,58px);font-weight:1000;letter-spacing:2px;margin-top:7vh}
.logo span{color:#f4ca72}
.sub{font-size:11px;letter-spacing:3px;color:#8ea5c5;margin:12px 0 28px}
.panel{background:#111b2c;border:1px solid #2c3c54;border-radius:17px;padding:17px;margin:12px 0}
h2{font-size:18px;margin:0 0 14px}
.menuBtn{width:100%;text-align:left;margin:4px 0;min-height:58px}
.menuBtn strong{display:block}
.menuBtn small{display:block;color:#a1b4ce;margin-top:5px}
.primary{background:linear-gradient(120deg,#168ddf,#20c8ed);color:#03111c;border:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.field{margin:12px 0}
.field label{display:block;font-size:12px;color:#a5b9d4;margin-bottom:6px}
input[type=text]{width:100%;background:#09111f;color:#fff;border:1px solid #34445c;border-radius:8px;padding:10px}
input[type=color]{width:100%;height:38px;background:#101a2b;border:1px solid #34445c;border-radius:8px}
input[type=range]{width:100%;accent-color:#25b9ef}
.stat{display:grid;grid-template-columns:75px 1fr 20px;align-items:center;gap:8px;font-size:12px;margin:12px 0}
#match{padding:0;overflow:hidden;background:#090f19}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;transform:scale(1);transition:transform .65s cubic-bezier(.2,.7,.2,1);will-change:transform}
#gameCanvas.zoom-blue{transform:scale(1.8);transform-origin:36% 69%}
#gameCanvas.zoom-red{transform:scale(1.8);transform-origin:64% 69%}
.hud{position:absolute;z-index:2;top:env(safe-area-inset-top);left:0;right:0;padding:10px;pointer-events:none;transition:opacity .25s}
.scoreboard{max-width:680px;margin:auto;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.scorebox{background:#101a2bef;border:1px solid #34445d;border-radius:10px;padding:7px 10px;min-width:0}
.scorebox.blue{border-left:4px solid #20baff}
.scorebox.red{border-right:4px solid #ff4c65;text-align:right}
.playername{font-size:clamp(10px,2.5vw,14px);font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-size:clamp(27px,7vw,40px);font-weight:1000;line-height:1.1}
.clock{text-align:center;font-size:22px;font-weight:bold;font-variant-numeric:tabular-nums}
.clock small{display:block;font-size:9px;color:#9db0cb}
.topMenu{position:absolute;z-index:5;right:10px;top:calc(78px + env(safe-area-inset-top))}
.topMenu button{background:#111b2de8;padding:8px 12px}
.controls{position:absolute;z-index:4;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;gap:8px;pointer-events:none;transition:opacity .25s}
.controlSide{display:flex;gap:7px;align-items:end;pointer-events:auto}
.ctrl{width:clamp(48px,12vw,72px);height:clamp(54px,13vw,72px);padding:4px;border-radius:15px;background:#15243cef;font-size:21px;touch-action:none;user-select:none}
.ctrl small{display:block;font-size:8px;margin-top:3px}
.ctrl.blue{border-bottom:4px solid #20baff}
.ctrl.red{border-bottom:4px solid #ff4c65}
.ctrl.attack{width:clamp(68px,18vw,98px);background:#e9b957;color:#211500;border:0;font-size:12px}
.overlay{display:none;position:absolute;z-index:10;inset:0;align-items:center;justify-content:center;padding:18px;background:#030711d9;backdrop-filter:blur(6px)}
.overlay.show{display:flex}
.modal{width:min(100%,440px);max-height:90%;overflow:auto;background:#111c2e;border:1px solid #364760;border-radius:20px;padding:22px;text-align:center}
.modal h2{font-size:24px}
.modal p{color:#9fb2ce;font-size:13px;line-height:1.7}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}
#status{position:absolute;z-index:3;top:43%;left:50%;transform:translate(-50%,-50%);text-align:center;width:90%;pointer-events:none;text-shadow:0 3px 16px #000}
#statusBig{font-size:clamp(30px,8vw,55px);font-weight:1000;letter-spacing:2px}
#statusSmall{font-size:12px;color:#d4e0ef;margin-top:7px}
#introCard{position:absolute;z-index:8;left:50%;top:48%;transform:translate(-50%,-50%);width:min(88%,390px);text-align:center;pointer-events:none;opacity:0;transition:opacity .35s}
#introCard.visible{opacity:1}
.introTag{font-size:11px;letter-spacing:5px;font-weight:bold;margin-bottom:9px}
.introName{font-size:clamp(30px,9vw,52px);font-weight:1000;overflow-wrap:anywhere;text-shadow:0 4px 20px #000}
.introRole{font-size:12px;letter-spacing:3px;margin-top:8px;text-shadow:0 2px 10px #000}
.introLine{height:3px;width:75px;margin:15px auto;background:#20baff}
#introCard.red .introLine{background:#ff4c65}
#introCard .introTag{color:#20baff}
#introCard.red .introTag{color:#ff4c65}
.hidden{display:none!important}
@media(max-width:430px){.controls{left:6px;right:6px;gap:3px}.controlSide{gap:4px}.ctrl{width:44px;height:54px}.ctrl.attack{width:62px}.scorebox{padding:6px}.topMenu{top:calc(76px + env(safe-area-inset-top))}}
</style>
</head>
<body>

<section id="home" class="screen active">
<div class="wrap">
<div class="logo">FENCING <span>ELITE</span></div>
<div class="sub">THE ART OF THE BOUT</div>
<div class="panel">
<h2>GAME MODE</h2>
<button class="menuBtn primary" onclick="startMatch('cpu')"><strong>⚔ 1 PLAYER — VS CPU</strong><small>コンピューターと対戦</small></button>
<button class="menuBtn" onclick="startMatch('2p')"><strong>♟ 2 PLAYERS — LOCAL</strong><small>1台の画面で2人対戦</small></button>
</div>
<div class="panel">
<h2>FENCER CUSTOMIZATION</h2>
<div class="grid2">
<button onclick="openCustomize('blue')"><strong style="color:#20baff">BLUE FENCER</strong><small id="homeBlue">BLUE</small></button>
<button onclick="openCustomize('red')"><strong style="color:#ff4c65">RED FENCER</strong><small id="homeRed">RED / CPU</small></button>
</div>
</div>
<div class="panel">
<h2>RULES</h2>
<div style="font-size:12px;color:#a8bad2;line-height:2">
・15点先取、または3分間<br>
・相手に突きが届くと得点<br>
・ピストの端を越えると相手に1点<br>
・得点後は自動で再開<br>
・攻撃ボタン長押しでランジを強化
</div>
</div>
</div>
</section>

<section id="customize" class="screen">
<div class="wrap">
<button onclick="goHome()">← HOME</button>
<h2 style="margin-top:20px">FENCER CUSTOMIZATION</h2>
<div class="panel">
<div class="grid2">
<button onclick="openCustomize('blue')">BLUE FENCER</button>
<button onclick="openCustomize('red')">RED FENCER</button>
</div>
<div class="field"><label>選手名</label><input id="fName" type="text" maxlength="18"></div>
<div class="grid2">
<div class="field"><label>マスクの色</label><input id="maskColor" type="color"></div>
<div class="field"><label>ユニフォーム</label><input id="suitColor" type="color"></div>
</div>
<div class="field"><label>剣の色</label><input id="bladeColor" type="color"></div>
<h3>能力値（合計15）</h3>
<div id="stats"></div>
<button class="primary" style="width:100%;margin-top:14px" onclick="saveCustomize()">SAVE</button>
</div>
</div>
</section>

<section id="match" class="screen">
<canvas id="gameCanvas"></canvas>
<div class="hud" id="hud">
<div class="scoreboard">
<div class="scorebox blue">
<div id="blueName" class="playername">BLUE</div>
<div id="blueScore" class="score">0</div>
</div>
<div class="clock"><span id="clock">03:00</span><small>FENCING BOUT</small></div>
<div class="scorebox red">
<div id="redName" class="playername">RED</div>
<div id="redScore" class="score">0</div>
</div>
</div>
</div>

<div id="status"><div id="statusBig"></div><div id="statusSmall"></div></div>
<div id="introCard">
<div class="introTag" id="introTag">BLUE FENCER</div>
<div class="introName" id="introName">BLUE</div>
<div class="introLine"></div>
<div class="introRole" id="introRole">FENCER INTRODUCTION</div>
</div>

<div class="topMenu" id="topMenu"><button onclick="openPause()">☰ MENU</button></div>
<div class="controls" id="controls">
<div class="controlSide">
<button class="ctrl blue" id="back">◀<small>BACK</small></button>
<button class="ctrl blue" id="forward">▶<small>FORWARD</small></button>
<button class="ctrl attack" id="attack">ATTACK<small>HOLD / LUNGE</small></button>
</div>
<div class="controlSide" id="redControls">
<button class="ctrl red" id="back2">◀<small>BACK</small></button>
<button class="ctrl red" id="forward2">▶<small>FORWARD</small></button>
<button class="ctrl attack" id="attack2">ATTACK<small>HOLD / LUNGE</small></button>
</div>
</div>

<div class="overlay" id="pause">
<div class="modal">
<h2>PAUSED</h2>
<div class="actions">
<button class="primary" onclick="resumeGame()">RESUME</button>
<button onclick="openCustomizeMatch('blue')">CUSTOMIZE BLUE</button>
<button onclick="openCustomizeMatch('red')">CUSTOMIZE RED</button>
<button onclick="goHome()">HOME</button>
</div>
</div>
</div>

<div class="overlay" id="result">
<div class="modal">
<h2 id="resultTitle">BOUT COMPLETE</h2>
<div id="resultScore" style="font-size:42px;font-weight:1000;margin:20px">0 — 0</div>
<p id="resultText">試合終了</p>
<div class="actions">
<button class="primary" onclick="startMatch(mode)">REMATCH</button>
<button onclick="goHome()">HOME</button>
</div>
</div>
</div>
</section>

<script>
"use strict";
const $=id=>document.getElementById(id);
const canvas=$("gameCanvas"),ctx=canvas.getContext("2d");
const original={
 blue:{name:"BLUE",mask:"#c8d1dc",suit:"#edf1f7",blade:"#d8e8ff",stats:{speed:3,power:3,reach:3,stamina:3,defense:3}},
 red:{name:"RED",mask:"#c8d1dc",suit:"#edf1f7",blade:"#d8e8ff",stats:{speed:3,power:3,reach:3,stamina:3,defense:3}}
};
let settings=JSON.parse(JSON.stringify(original));
let mode="cpu",editing="blue",returnMatch=false;
let blue=null,red=null,running=false,live=false,paused=false;
let W=0,H=0,dpr=1,last=0,remaining=180,raf=0,roundTimer=null;
let keys={back:false,forward:false,attack:false,back2:false,forward2:false,attack2:false};
let crowdFlash=0,crowdColor="#20baff",lights=[];
let sequenceToken=0;

function showScreen(id){["home","customize","match"].forEach(s=>$(s).classList.toggle("active",s===id))}
function hideOverlays(){["pause","result"].forEach(id=>$(id).classList.remove("show"))}
function clearTimers(){clearTimeout(roundTimer);roundTimer=null;sequenceToken++}
function clearKeys(){Object.keys(keys).forEach(k=>keys[k]=false);if(blue)blue.charging=false;if(red)red.charging=false}
function goHome(){
 running=false;live=false;paused=false;clearTimers();cancelAnimationFrame(raf);clearKeys();
 hideOverlays();$("introCard").classList.remove("visible");canvas.classList.remove("zoom-blue","zoom-red");
 showScreen("home");$("homeBlue").textContent=settings.blue.name;$("homeRed").textContent=settings.red.name+(mode==="cpu"?" / CPU":"");
}
function openCustomize(side){editing=side;returnMatch=false;loadCustomize();showScreen("customize")}
function openCustomizeMatch(side){
 editing=side;returnMatch=true;paused=true;live=false;clearTimers();clearKeys();$("pause").classList.remove("show");loadCustomize();showScreen("customize");
}
function loadCustomize(){
 let s=settings[editing];$("fName").value=s.name;$("maskColor").value=s.mask;$("suitColor").value=s.suit;$("bladeColor").value=s.blade;
 let box=$("stats");box.innerHTML="";
 for(let [key,label] of [["speed","SPEED"],["power","POWER"],["reach","REACH"],["stamina","STAMINA"],["defense","DEFENSE"]]){
  let row=document.createElement("div");row.className="stat";
  let lab=document.createElement("span");lab.textContent=label;
  let inp=document.createElement("input");inp.type="range";inp.min=1;inp.max=5;inp.value=s.stats[key];inp.dataset.key=key;
  let out=document.createElement("output");out.textContent=inp.value;
  inp.oninput=()=>{
   let sliders=[...box.querySelectorAll("input")],excess=sliders.reduce((a,b)=>a+ +b.value,0)-15;
   if(excess>0)for(let other of sliders){if(other===inp)continue;let take=Math.min(+other.value-1,excess);other.value-=take;other.parentElement.querySelector("output").textContent=other.value;excess-=take;if(excess<=0)break}
   out.textContent=inp.value;
  };
  row.append(lab,inp,out);box.append(row);
 }
}
function saveCustomize(){
 let s=settings[editing];s.name=$("fName").value.trim()||editing.toUpperCase();s.mask=$("maskColor").value;s.suit=$("suitColor").value;s.blade=$("bladeColor").value;s.stats={};
 $("stats").querySelectorAll("input").forEach(x=>s.stats[x.dataset.key]=+x.value);
 if(Object.values(s.stats).reduce((a,b)=>a+b,0)!==15){alert("能力値の合計を15にしてください");return}
 $("homeBlue").textContent=settings.blue.name;$("homeRed").textContent=settings.red.name+(mode==="cpu"?" / CPU":"");
 if(returnMatch){
  returnMatch=false;showScreen("match");paused=false;
  applySettings(blue,"blue");applySettings(red,"red");
  $("blueName").textContent=blue.name;$("redName").textContent=red.name;
  resetPositions();startIntroductions();
 }else goHome();
}

function resize(){
 let r=canvas.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);dpr=Math.min(devicePixelRatio||1,1.6);
 canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);createLights();
}
window.addEventListener("resize",resize);
function createLights(){
 lights=[];let count=Math.max(120,Math.floor(W/2.5));
 for(let i=0;i<count;i++)lights.push({x:Math.random()*W,y:H*.13+Math.random()*H*.27,size:1+Math.random()*2,base:Math.random()});
}
function fencer(side,x){
 return {side,x,dir:side==="blue"?1:-1,name:"",mask:"#c8d1dc",suit:"#edf1f7",blade:"#d8e8ff",
 stats:{speed:3,power:3,reach:3,stamina:3,defense:3},stamina:85,maxStamina:85,attack:0,cooldown:0,
 charging:false,charge:0,chargeStart:0,step:0,aiMove:0,flash:0,attackDuration:.3};
}
function applySettings(f,side){
 let s=settings[side];f.name=s.name;f.mask=s.mask;f.suit=s.suit;f.blade=s.blade;f.stats=JSON.parse(JSON.stringify(s.stats));
 f.maxStamina=60+s.stats.stamina*8;f.stamina=f.maxStamina;
}
function startMatch(m){
 mode=m;clearTimers();showScreen("match");hideOverlays();resize();clearKeys();
 blue=fencer("blue",W*.36);red=fencer("red",W*.64);applySettings(blue,"blue");applySettings(red,"red");
 $("redControls").classList.toggle("hidden",mode==="cpu");
 $("blueName").textContent=blue.name;$("redName").textContent=red.name;
 $("blueScore").textContent=0;$("redScore").textContent=0;remaining=180;updateClock();
 running=true;live=false;paused=false;last=performance.now();cancelAnimationFrame(raf);
 $("status").style.display="none";$("introCard").classList.remove("visible");
 raf=requestAnimationFrame(loop);startIntroductions();
}
function startIntroductions(){
 clearTimers();live=false;paused=false;clearKeys();
 $("status").style.display="none";$("introCard").classList.remove("visible");
 $("hud").style.opacity="0";$("controls").style.opacity="0";$("topMenu").style.opacity="0";
 canvas.classList.remove("zoom-blue","zoom-red");
 const token=++sequenceToken;
 // まずBLUE選手をアップで3秒紹介
 showIntro(blue,"blue");
 canvas.classList.add("zoom-blue");
 roundTimer=setTimeout(()=>{
  if(!running||paused||token!==sequenceToken)return;
  // 続いてRED選手をアップで3秒紹介
  showIntro(red,"red");
  canvas.classList.remove("zoom-blue");canvas.classList.add("zoom-red");
  roundTimer=setTimeout(()=>{
   if(!running||paused||token!==sequenceToken)return;
   $("introCard").classList.remove("visible");
   canvas.classList.remove("zoom-red");
   $("hud").style.opacity="1";$("controls").style.opacity="1";$("topMenu").style.opacity="1";
   readySequence(token);
  },3000);
 },3000);
}
function showIntro(f,side){
 let card=$("introCard");
 card.classList.toggle("red",side==="red");
 $("introTag").textContent=side==="blue"?"BLUE FENCER":(mode==="cpu"?"CPU FENCER":"RED FENCER");
 $("introName").textContent=f.name;
 $("introRole").textContent="FENCING ELITE · ATHLETE INTRODUCTION";
 card.classList.add("visible");
}
function readySequence(token=sequenceToken){
 live=false;$("status").style.display="block";$("statusBig").style.color="white";$("statusBig").textContent="EN GARDE";$("statusSmall").textContent="構えてください";
 roundTimer=setTimeout(()=>{
  if(!running||paused||token!==sequenceToken)return;
  $("statusBig").textContent="PRÊTS?";$("statusSmall").textContent="";
  roundTimer=setTimeout(()=>{
   if(!running||paused||token!==sequenceToken)return;
   $("statusBig").textContent="ALLEZ!";
   roundTimer=setTimeout(()=>{
    if(!running||paused||token!==sequenceToken)return;
    live=true;$("status").style.display="none";
   },400);
  },600);
 },600);
}
function resumeGame(){
 $("pause").classList.remove("show");$("customize").classList.remove("active");$("match").classList.add("active");
 clearTimers();paused=false;clearKeys();$("hud").style.opacity="1";$("controls").style.opacity="1";$("topMenu").style.opacity="1";readySequence();
}
function openPause(){
 if(!running)return;paused=true;live=false;clearTimers();clearKeys();$("pause").classList.add("show");
}
function updateClock(){
 let m=Math.floor(remaining/60),s=Math.floor(remaining%60);
 $("clock").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function loop(now){
 if(!running)return;let dt=Math.min(.025,Math.max(0,(now-last)/1000||0));last=now;
 if(live&&!paused)update(dt);draw();raf=requestAnimationFrame(loop);
}
function piste(){return {left:W*.07,right:W*.93,center:W*.5,y:H*.69}}
function update(dt){
 remaining=Math.max(0,remaining-dt);updateClock();if(remaining<=0){finishBout("time");return}
 for(let f of [blue,red]){f.attack=Math.max(0,f.attack-dt);f.cooldown=Math.max(0,f.cooldown-dt);f.flash=Math.max(0,f.flash-dt);f.stamina=Math.min(f.maxStamina,f.stamina+dt*5)}
 if(mode==="cpu")thinkCPU(dt);
 move(blue,keys.forward?1:keys.back?-1:0,dt);
 if(mode==="2p")move(red,keys.forward2?1:keys.back2?-1:0,dt);else move(red,red.aiMove,dt);
 if(keys.attack)charge(blue);if(mode==="2p"&&keys.attack2)charge(red);
 // 衝突判定。攻撃中も相手を通り抜けない
 const minGap=62;
 if(red.x-blue.x<minGap){
  const mid=(blue.x+red.x)/2;blue.x=mid-minGap/2;red.x=mid+minGap/2;
  const p=piste();blue.x=Math.max(p.left+2,blue.x);red.x=Math.min(p.right-2,red.x);
  if(red.x-blue.x<minGap){
   if(blue.x<=p.left+2)red.x=Math.min(p.right-2,blue.x+minGap);
   else if(red.x>=p.right-2)blue.x=Math.max(p.left+2,red.x-minGap);
  }
 }
 let p=piste();
 if(blue.x<p.left+7){scorePoint("red","END OF PISTE");return}
 if(red.x>p.right-7){scorePoint("blue","END OF PISTE");return}
 hitCheck();if(crowdFlash>0)crowdFlash=Math.max(0,crowdFlash-dt);
}
function move(f,d,dt){
 let speed=82+f.stats.speed*22;f.x+=d*speed*dt;f.step+=Math.abs(d)*dt*9;
 if(f.attack>0){
  let progress=1-f.attack/f.attackDuration;
  let lunge=Math.sin(Math.min(1,progress)*Math.PI)*(28+f.charge*46);
  f.x+=f.dir*lunge*dt*5;
 }
 let p=piste();f.x=Math.max(p.left+2,Math.min(p.right-2,f.x));
}
function thinkCPU(dt){
 let gap=red.x-blue.x;red.aiMove=0;
 if(gap>185)red.aiMove=-1;else if(gap<90&&Math.random()<.025)red.aiMove=1;
 if(red.cooldown<=0&&gap<205&&Math.random()<dt*(gap<145?1.8:.7)){
  red.charge=.35+Math.random()*.5;attackNow(red,red.charge);
 }
}
function charge(f){if(!f.charging){f.charging=true;f.chargeStart=performance.now()}f.charge=Math.min(1,(performance.now()-f.chargeStart)/700)}
function release(f){if(!f.charging)return;let q=Math.max(.18,f.charge);f.charging=false;f.charge=0;attackNow(f,q)}
function attackNow(f,q){
 if(!live||f.cooldown>0||f.stamina<8)return;
 f.charge=q;f.attackDuration=.24+q*.12;f.attack=f.attackDuration;f.cooldown=.42;f.stamina-=10+q*13;f.flash=.08;
}
function hitCheck(){
 let gap=red.x-blue.x,candidates=[];
 for(let f of [blue,red]){
  if(f.attack<=0)continue;
  let other=f===blue?red:blue,forward=(other.x-f.x)*f.dir;
  let reach=92+f.stats.reach*14+(f.charge||0)*36;
  if(forward>0&&forward<reach&&gap<reach)candidates.push({f,forward});
 }
 if(candidates.length){candidates.sort((a,b)=>a.forward-b.forward);scorePoint(candidates[0].f.side,"TOUCHÉ")}
}
function scorePoint(side,reason){
 if(!live)return;live=false;clearKeys();clearTimeout(roundTimer);
 let id=side==="blue"?"blueScore":"redScore";$(id).textContent=+$(id).textContent+1;
 crowdFlash=1;crowdColor=side==="blue"?"#20baff":"#ff4c65";
 $("status").style.display="block";$("statusBig").textContent=reason;$("statusBig").style.color=crowdColor;
 $("statusSmall").textContent=(side==="blue"?blue.name:red.name)+" +1";
 if(+$("blueScore").textContent>=15||+$("redScore").textContent>=15){roundTimer=setTimeout(()=>finishBout("score"),1200);return}
 // 得点後はボタンを押さず自動再開
 roundTimer=setTimeout(()=>{
  if(!running||paused)return;resetPositions();
  $("statusBig").style.color="white";$("statusBig").textContent="EN GARDE";$("statusSmall").textContent="";
  roundTimer=setTimeout(()=>{
   if(!running||paused)return;$("statusBig").textContent="PRÊTS?";
   roundTimer=setTimeout(()=>{
    if(!running||paused)return;$("statusBig").textContent="ALLEZ!";
    roundTimer=setTimeout(()=>{if(!running||paused)return;live=true;$("status").style.display="none"},400);
   },600);
  },600);
 },950);
}
function resetPositions(){
 let p=piste();blue.x=p.left+(p.right-p.left)*.31;red.x=p.left+(p.right-p.left)*.69;
 for(let f of [blue,red]){f.attack=0;f.cooldown=.25;f.charge=0;f.charging=false;f.stamina=Math.min(f.maxStamina,f.stamina+18)}
}
function finishBout(reason){
 live=false;paused=true;clearTimers();
 let b=+$("blueScore").textContent,r=+$("redScore").textContent;
 $("resultTitle").textContent=b===r?"MATCH DRAW":(b>r?blue.name:red.name)+" WINS";
 $("resultScore").textContent=b+" — "+r;$("resultText").textContent=reason==="time"?"時間切れです。":"試合終了です。";
 $("result").classList.add("show");
}
function bind(id,down,up){
 let el=$(id);
 el.addEventListener("pointerdown",e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}down()});
 for(let ev of ["pointerup","pointercancel","lostpointercapture"])el.addEventListener(ev,e=>{e.preventDefault();up()});
}
bind("back",()=>keys.back=true,()=>keys.back=false);
bind("forward",()=>keys.forward=true,()=>keys.forward=false);
bind("attack",()=>keys.attack=true,()=>{keys.attack=false;if(blue)release(blue)});
bind("back2",()=>keys.back2=true,()=>keys.back2=false);
bind("forward2",()=>keys.forward2=true,()=>keys.forward2=false);
bind("attack2",()=>keys.attack2=true,()=>{keys.attack2=false;if(red)release(red)});
window.addEventListener("keydown",e=>{
 if(e.repeat)return;if(e.code==="Escape"){openPause();return}
 if(e.code==="ArrowLeft"||e.code==="KeyA")keys.back=true;
 if(e.code==="ArrowRight"||e.code==="KeyD")keys.forward=true;
 if(e.code==="Space"||e.code==="KeyF")keys.attack=true;
 if(mode==="2p"){if(e.code==="KeyJ")keys.back2=true;if(e.code==="KeyL")keys.forward2=true;if(e.code==="KeyK")keys.attack2=true}
});
window.addEventListener("keyup",e=>{
 if(e.code==="ArrowLeft"||e.code==="KeyA")keys.back=false;
 if(e.code==="ArrowRight"||e.code==="KeyD")keys.forward=false;
 if(e.code==="Space"||e.code==="KeyF"){keys.attack=false;if(blue)release(blue)}
 if(e.code==="KeyJ")keys.back2=false;if(e.code==="KeyL")keys.forward2=false;
 if(e.code==="KeyK"){keys.attack2=false;if(red)release(red)}
});
window.addEventListener("blur",clearKeys);

function draw(){
 if(!W||!H)return;ctx.setTransform(dpr,0,0,dpr,0,0);
 let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#0b1321");bg.addColorStop(.6,"#172236");bg.addColorStop(1,"#080e18");
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);drawStadium();drawPiste();if(blue&&red){drawFencer(blue);drawFencer(red)}
}
function drawStadium(){
 for(let row=0;row<5;row++){let y=H*.13+row*H*.052;ctx.fillStyle=row%2?"#172338":"#101b2d";ctx.fillRect(0,y,W,H*.048)}
 for(let i=0;i<lights.length;i++){
  let l=lights[i],col=crowdFlash>0?crowdColor:l.base<.3?"#20baff":l.base<.6?"#ff4c65":["#d7e7ff","#f3ce83","#8eabd0"][i%3];
  ctx.globalAlpha=crowdFlash>0?.95:.34+Math.sin(performance.now()*.002+i)*.18;
  ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=crowdFlash>0?12:4;ctx.fillRect(l.x,l.y,l.size,l.size*1.8);
 }
 ctx.globalAlpha=1;ctx.shadowBlur=0;
 for(let x of [W*.12,W*.36,W*.64,W*.88]){
  let g=ctx.createRadialGradient(x,H*.08,0,x,H*.08,W*.15);g.addColorStop(0,"#a8d9ff20");g.addColorStop(1,"#a8d9ff00");ctx.fillStyle=g;ctx.fillRect(x-W*.15,0,W*.3,H*.35);
 }
}
function drawPiste(){
 let p=piste(),x=p.left,w=p.right-p.left,h=Math.min(H*.24,155),top=p.y-h*.42;
 ctx.fillStyle="#030812";ctx.fillRect(x+4,top+7,w,h);
 let metal=ctx.createLinearGradient(0,top,0,top+h);metal.addColorStop(0,"#e4e9ef");metal.addColorStop(.25,"#b7c3d0");metal.addColorStop(.65,"#d1d9e2");metal.addColorStop(1,"#8999aa");
 ctx.fillStyle=metal;ctx.fillRect(x,top,w,h);
 ctx.strokeStyle="#8998a8";ctx.lineWidth=1;
 for(let i=1;i<6;i++){let yy=top+h*i/6;ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+w,yy);ctx.stroke()}
 ctx.strokeStyle="#f7fbff";ctx.lineWidth=2;ctx.strokeRect(x,top,w,h);
 ctx.strokeStyle="#283a50";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,top+h);ctx.moveTo(x+w,top);ctx.lineTo(x+w,top+h);ctx.stroke();
 ctx.strokeStyle="#f9fbff";ctx.lineWidth=2;
 for(let xx of [x+w*.32,x+w*.68,p.center]){ctx.beginPath();ctx.moveTo(xx,top);ctx.lineTo(xx,top+h);ctx.stroke()}
 ctx.fillStyle="#f8fbff";ctx.font="bold 10px Arial";ctx.textAlign="center";
 ctx.fillText("END",x,top-7);ctx.fillText("START",x+w*.32,top-7);ctx.fillText("CENTER",p.center,top-7);ctx.fillText("START",x+w*.68,top-7);ctx.fillText("END",x+w,top-7);
 ctx.fillStyle="#080f1a";ctx.fillRect(0,top+h,W,H-top-h);
}
function drawFencer(f){
 const p=piste(),ground=p.y+p.y*.02,sc=Math.max(.72,Math.min(1.12,H/700)),dir=f.dir,attacking=f.attack>0;
 const progress=attacking?1-f.attack/f.attackDuration:0;
 const extension=attacking?Math.sin(Math.min(1,progress)*Math.PI)*(25+f.charge*25):0;
 const x=f.x,y=ground;ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
 ctx.fillStyle="#03070c66";ctx.beginPath();ctx.ellipse(0,3,28,6,0,0,Math.PI*2);ctx.fill();
 let step=Math.sin(f.step)*2,front=dir*(attacking?39:10),back=-dir*(attacking?37:10);
 ctx.lineCap="round";ctx.lineWidth=9;ctx.strokeStyle="#17202d";
 if(attacking){
  ctx.beginPath();ctx.moveTo(-dir*2,-31);ctx.lineTo(back,-8);ctx.lineTo(back-dir*12,0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(dir*2,-31);ctx.lineTo(dir*25,-17);ctx.lineTo(front+dir*7,0);ctx.stroke();
 }else{
  ctx.beginPath();ctx.moveTo(-dir*2,-31);ctx.lineTo(back+step,-4);ctx.lineTo(back-dir*8,0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(dir*2,-31);ctx.lineTo(front-step,-4);ctx.lineTo(front+dir*8,0);ctx.stroke();
 }
 ctx.strokeStyle="#dfe6ef";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(back-dir*12,0);ctx.lineTo(back-dir*19,0);ctx.moveTo(front+dir*7,0);ctx.lineTo(front+dir*16,0);ctx.stroke();
 ctx.save();ctx.translate(0,-45);ctx.rotate(-dir*(attacking?.13:0));ctx.translate(0,45);
 ctx.fillStyle=f.flash>0?"white":f.suit;ctx.beginPath();ctx.moveTo(-9,-64);ctx.lineTo(9,-64);ctx.lineTo(12,-34);ctx.lineTo(8,-28);ctx.lineTo(-8,-28);ctx.lineTo(-12,-34);ctx.closePath();ctx.fill();
 ctx.strokeStyle="#8593a5";ctx.lineWidth=1;ctx.stroke();ctx.strokeStyle="#8998a9";ctx.beginPath();ctx.moveTo(0,-62);ctx.lineTo(0,-31);ctx.stroke();
 // 腕・肘・手首を伸ばしてランジ。剣そのものは伸びない
 const shoulderX=dir*7,shoulderY=-57,elbowX=dir*(attacking?20+extension*.42:16),elbowY=attacking?-55:-47,handX=dir*(attacking?28+extension:27),handY=attacking?-54:-49;
 ctx.strokeStyle=f.flash>0?"#fff":f.suit;ctx.lineWidth=8;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(shoulderX,shoulderY);ctx.lineTo(elbowX,elbowY);ctx.lineTo(handX,handY);ctx.stroke();
 ctx.fillStyle="#f2f5fa";ctx.beginPath();ctx.arc(handX,handY,5,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=f.mask;ctx.beginPath();ctx.ellipse(0,-76,12,13,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#647489";ctx.lineWidth=1.2;ctx.stroke();
 ctx.strokeStyle="#7b8b9e";ctx.lineWidth=.65;
 for(let a=-8;a<=8;a+=4){ctx.beginPath();ctx.moveTo(a,-86);ctx.lineTo(a,-67);ctx.stroke()}
 for(let b=-82;b<=-70;b+=4){ctx.beginPath();ctx.moveTo(-10,b);ctx.lineTo(10,b);ctx.stroke()}
 ctx.fillStyle="#39485a";ctx.fillRect(-dir*11,-81,4,11);
 const bladeLength=78;
 ctx.strokeStyle="#1a2638";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(handX,handY);ctx.lineTo(handX+dir*7,handY-1);ctx.stroke();
 ctx.strokeStyle=f.blade;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(handX+dir*7,handY-1);ctx.lineTo(handX+dir*(7+bladeLength),handY-1);ctx.stroke();
 ctx.strokeStyle="#fff";ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(handX+dir*8,handY-2);ctx.lineTo(handX+dir*(7+bladeLength),handY-2);ctx.stroke();
 ctx.fillStyle=f.blade;ctx.beginPath();ctx.arc(handX+dir*(7+bladeLength),handY-1,1.7,0,Math.PI*2);ctx.fill();
 ctx.restore();
 ctx.fillStyle=f.side==="blue"?"#20baff":"#ff4c65";ctx.font="bold 11px Arial";ctx.textAlign="center";ctx.fillText(f.name,0,-H*.13);
 ctx.fillStyle="#101722";ctx.fillRect(-24,-H*.13+5,48,4);ctx.fillStyle=f.side==="blue"?"#20baff":"#ff4c65";ctx.fillRect(-24,-H*.13+5,48*Math.max(0,f.stamina/f.maxStamina),4);
 ctx.restore();
}
</script>
