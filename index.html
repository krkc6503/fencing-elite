<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071426">
<title>FENCING ELITE</title>
<style>
:root{--bg:#071426;--panel:#10233d;--line:#294564;--white:#f4f8ff;--muted:#9cb0c9;--blue:#43a5ff;--red:#ff5268;--gold:#ffd36a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--white);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:manipulation}
button,input,select{font:inherit}
button{border:1px solid #355578;background:#193554;color:white;border-radius:12px;padding:12px 15px;font-weight:800;cursor:pointer}
button:active{transform:scale(.97);filter:brightness(1.2)}
button.primary{background:linear-gradient(135deg,#1687ff,#0759c5);border-color:#4aafff}
button.danger{background:#52263a;border-color:#a74a63}
button.small{padding:8px 10px;font-size:12px}
input,select{width:100%;background:#07172b;border:1px solid #355578;border-radius:9px;padding:10px;color:white;min-width:0}
input[type=color]{height:42px;padding:3px}
input[type=range]{padding:0}
label{display:block;font-size:12px;color:#b9cce3;margin-bottom:5px}
.hidden{display:none!important}
#app{height:100dvh;display:flex;flex-direction:column}
header{height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #203c5c;background:#091a30;z-index:5}
.logo{font-size:17px;font-weight:1000;letter-spacing:1.5px}
.logo span{color:#53b4ff}
#hud{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:#0a1c32;flex-shrink:0}
.scorebox{display:flex;align-items:center;gap:8px;min-width:0}
.score{font-size:31px;line-height:1;font-weight:1000;font-variant-numeric:tabular-nums}
.score.red{color:var(--red)}.score.blue{color:var(--blue)}
.playerlabel{font-size:11px;font-weight:800;max-width:95px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.midscore{text-align:center;font-size:10px;color:var(--muted);font-weight:800}
#timer{font-size:21px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
#arena{position:relative;flex:1;min-height:0;background:#071426;overflow:hidden}
canvas{width:100%;height:100%;display:block}
#status{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:1px;font-weight:1000;text-align:center;white-space:nowrap;background:#071426c9;border:1px solid #426184;border-radius:30px;padding:7px 14px;z-index:2}
#touchcontrols{display:flex;justify-content:space-between;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#091a30;border-top:1px solid #203c5c;flex-shrink:0}
.controlside{display:flex;gap:7px;flex:1;align-items:stretch}
.controlside.right{justify-content:flex-end}
.ctrl{min-width:0;flex:1;max-width:90px;padding:10px 5px;font-size:12px;touch-action:none;user-select:none}
.ctrl.attack{flex:1.25;max-width:112px;background:linear-gradient(145deg,#8b263d,#4c1829);border-color:#e65c77}
.ctrl.attack.blueattack{background:linear-gradient(145deg,#176bb9,#103456);border-color:#58b6ff}
.ctrl span{display:block;font-size:19px;margin-bottom:2px}
#overlay{position:fixed;inset:0;background:#030b16d9;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
.panel{width:min(560px,100%);max-height:94dvh;overflow:auto;background:linear-gradient(160deg,#122b49,#08182b);border:1px solid #3b5b7d;border-radius:20px;padding:20px;box-shadow:0 20px 70px #0009}
.panel h1{font-size:27px;margin:0 0 5px;letter-spacing:1px}
.panel h1 span{color:#56b8ff}
.subtitle{color:#9eb6d0;font-size:12px;margin-bottom:17px}
.menuButtons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.menuButtons button:first-child{grid-column:1/-1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.section{border:1px solid #294766;border-radius:13px;padding:12px;margin-top:12px;background:#0a1a2d}
.section h3{margin:0 0 10px;font-size:14px}
.field{margin-bottom:10px;min-width:0}
.field:last-child{margin-bottom:0}
.colorrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.statsrow{display:grid;grid-template-columns:1fr 35px;align-items:center;gap:8px;margin:7px 0}
.statsrow label{margin:0}
.statsrow output{text-align:right;color:#65bbff;font-weight:900;font-size:12px}
.actions{display:flex;gap:8px;margin-top:14px}
.actions button{flex:1}
.help{color:#8da8c5;font-size:11px;line-height:1.7;margin-top:13px}
#countdown{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#071426d9;pointer-events:none}
#countdownName{font-size:15px;color:#b8d6f4;font-weight:900;letter-spacing:2px}
#countdownWord{font-size:clamp(42px,12vw,82px);font-weight:1000;letter-spacing:3px;text-shadow:0 0 35px #4ba8ff88}
#result{font-size:18px;font-weight:1000;margin:12px 0}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);z-index:40;background:#172f4c;border:1px solid #4a6c90;padding:10px 15px;border-radius:12px;font-size:12px;display:none}
@media(min-width:760px){
 #app{max-width:1200px;margin:auto;height:100dvh;border-left:1px solid #203c5c;border-right:1px solid #203c5c}
 #touchcontrols{justify-content:center}
 .controlside{max-width:390px}
}
@media(max-height:620px){
 header{height:43px}#hud{padding:5px 10px}.score{font-size:25px}
 #touchcontrols{padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
 .ctrl{padding:5px}.ctrl span{font-size:15px}
 .panel{padding:14px}
}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="logo">FENCING <span>ELITE</span></div>
 <div style="display:flex;gap:7px">
  <button class="small" id="pauseBtn">Ⅱ PAUSE</button>
  <button class="small" id="homeBtn">⌂ HOME</button>
 </div>
</header>
<section id="hud">
 <div class="scorebox">
  <div>
   <div class="playerlabel" id="pNameHud">PLAYER 1</div>
   <div class="score red" id="pScore">0</div>
  </div>
 </div>
 <div class="midscore">
  <div id="timer">03:00</div>
  <div id="roundLabel">FENCING</div>
 </div>
 <div class="scorebox" style="justify-content:flex-end;text-align:right">
  <div>
   <div class="playerlabel" id="cNameHud">CPU</div>
   <div class="score blue" id="cScore">0</div>
  </div>
 </div>
</section>
<main id="arena">
 <canvas id="game"></canvas>
 <div id="status">READY</div>
 <div id="countdown" class="hidden">
  <div id="countdownName"></div>
  <div id="countdownWord">EN GARDE</div>
 </div>
</main>
<section id="touchcontrols">
 <div class="controlside">
  <button class="ctrl" data-action="back" data-side="p"><span>◀</span>後退</button>
  <button class="ctrl" data-action="forward" data-side="p"><span>▶</span>前進</button>
  <button class="ctrl attack" data-action="attack" data-side="p"><span>⚔</span>アタック</button>
 </div>
 <div class="controlside right">
  <button class="ctrl attack blueattack" data-action="attack" data-side="c"><span>⚔</span>攻撃</button>
  <button class="ctrl" data-action="forward" data-side="c"><span>◀</span>前進</button>
  <button class="ctrl" data-action="back" data-side="c"><span>▶</span>後退</button>
 </div>
</section>
</div>

<div id="overlay">
 <div class="panel" id="menu">
  <h1>FENCING <span>ELITE</span></h1>
  <div class="subtitle">TACTICAL FENCING SIMULATOR</div>
  <div class="grid2">
   <div class="field">
    <label for="mode">ゲームモード</label>
    <select id="mode">
     <option value="cpu">1 PLAYER vs CPU</option>
     <option value="2p">2 PLAYERS</option>
    </select>
   </div>
   <div class="field">
    <label for="weapon">種目</label>
    <select id="weapon">
     <option value="epee">ÉPÉE（エペ）</option>
     <option value="foil">FOIL（フルーレ）</option>
     <option value="sabre">SABRE（サーブル）</option>
    </select>
   </div>
  </div>
  <div class="section">
   <h3>選手カスタマイズ</h3>
   <div class="grid2">
    <div class="field"><label for="pName">左選手の名前</label><input id="pName" value="PLAYER 1" maxlength="18" autocomplete="off" placeholder="名前を入力"></div>
    <div class="field"><label for="cName">右選手の名前</label><input id="cName" value="CPU" maxlength="18" autocomplete="off" placeholder="名前を入力"></div>
   </div>
   <div class="colorrow">
    <div class="field"><label for="pColor">左選手の色</label><input type="color" id="pColor" value="#ff4058"></div>
    <div class="field"><label for="cColor">右選手の色</label><input type="color" id="cColor" value="#39a7ff"></div>
    <div class="field"><label for="pMask">左マスクの色</label><input type="color" id="pMask" value="#dce6f0"></div>
    <div class="field"><label for="cMask">右マスクの色</label><input type="color" id="cMask" value="#dce6f0"></div>
    <div class="field"><label for="pBlade">左の剣</label><input type="color" id="pBlade" value="#d8f2ff"></div>
    <div class="field"><label for="cBlade">右の剣</label><input type="color" id="cBlade" value="#d8f2ff"></div>
   </div>
  </div>
  <div class="section">
   <h3>能力値</h3>
   <div class="grid2">
    <div>
     <div class="statsrow"><label for="pSpeed">左・スピード</label><output id="pSpeedOut">75</output><input id="pSpeed" type="range" min="30" max="100" value="75"></div>
     <div class="statsrow"><label for="pPower">左・攻撃力</label><output id="pPowerOut">75</output><input id="pPower" type="range" min="30" max="100" value="75"></div>
     <div class="statsrow"><label for="pDefense">左・防御力</label><output id="pDefenseOut">75</output><input id="pDefense" type="range" min="30" max="100" value="75"></div>
    </div>
    <div>
     <div class="statsrow"><label for="cSpeed">右・スピード</label><output id="cSpeedOut">70</output><input id="cSpeed" type="range" min="30" max="100" value="70"></div>
     <div class="statsrow"><label for="cPower">右・攻撃力</label><output id="cPowerOut">70</output><input id="cPower" type="range" min="30" max="100" value="70"></div>
     <div class="statsrow"><label for="cDefense">右・防御力</label><output id="cDefenseOut">70</output><input id="cDefense" type="range" min="30" max="100" value="70"></div>
    </div>
   </div>
  </div>
  <div class="menuButtons">
   <button class="primary" id="startBtn">▶ 試合開始</button>
   <button id="customBtn">選手設定を反映</button>
   <button id="resetBtn">設定をリセット</button>
  </div>
  <div class="help">操作：左選手は画面左のボタン、右選手は画面右のボタン。キーボードは A/D で移動、F で攻撃、←/→ で移動、Enter で攻撃。アタックボタン長押しで踏み込みが強くなります。</div>
 </div>
</div>
<div id="toast"></div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('game'),ctx=canvas.getContext('2d');
const state={
 running:false,paused:false,phase:'menu',mode:'cpu',weapon:'epee',
 time:180,scoreP:0,scoreC:0,lastTime:0,acc:0,
 touch:{p:{forward:false,back:false,attack:false},c:{forward:false,back:false,attack:false}},
 keys:{},intro:0,introSide:0,flash:0,flashColor:'#fff',message:'READY',
 crowd:[],particles:[],lastPoint:0,
 p:{x:.34,v:0,dir:1,attacking:0,charge:0,cooldown:0,lunging:0,guard:0,stats:{speed:75,power:75,defense:75},color:'#ff4058',mask:'#dce6f0',blade:'#d8f2ff',name:'PLAYER 1'},
 c:{x:.66,v:0,dir:-1,attacking:0,charge:0,cooldown:0,lunging:0,guard:0,stats:{speed:70,power:70,defense:70},color:'#39a7ff',mask:'#dce6f0',blade:'#d8f2ff',name:'CPU'}
};
let W=0,H=0,DPR=1,toastTimer=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
function resize(){
 const r=canvas.getBoundingClientRect();DPR=Math.min(window.devicePixelRatio||1,2);
 W=Math.max(1,r.width);H=Math.max(1,r.height);
 canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
 ctx.setTransform(DPR,0,0,DPR,0,0);
 makeCrowd();draw();
}
function makeCrowd(){
 state.crowd=[];
 for(let row=0;row<5;row++){
  for(let i=0;i<Math.ceil(W/7);i++){
   state.crowd.push({x:i*7+rand(-2,2),y:Math.max(12,H*.08)+row*9+rand(-2,2),r:rand(1,2.5),c:['#263c56','#314b69','#405a77','#172b43'][Math.floor(rand(0,4))],light:Math.random()});
  }
 }
}
function toast(msg){
 const t=$('toast');t.textContent=msg;t.style.display='block';
 clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',1700);
}
function readSettings(){
 state.mode=$('mode').value;state.weapon=$('weapon').value;
 const pairs=[
  ['p','pName','pColor','pMask','pBlade'],
  ['c','cName','cColor','cMask','cBlade']
 ];
 for(const [side,name,color,mask,blade] of pairs){
  const f=state[side];
  f.name=$(name).value.trim().slice(0,18)||(side==='p'?'PLAYER 1':(state.mode==='cpu'?'CPU':'PLAYER 2'));
  f.color=$(color).value;f.mask=$(mask).value;f.blade=$(blade).value;
  f.stats.speed=+$(`${side}Speed`).value;
  f.stats.power=+$(`${side}Power`).value;
  f.stats.defense=+$(`${side}Defense`).value;
 }
 if(state.mode==='cpu'&&!$('cName').value.trim())state.c.name='CPU';
 updateHUD();
}
function updateHUD(){
 $('pNameHud').textContent=state.p.name;
 $('cNameHud').textContent=state.c.name;
 $('pScore').textContent=state.scoreP;
 $('cScore').textContent=state.scoreC;
 $('pScore').style.color=state.p.color;
 $('cScore').style.color=state.c.color;
 $('pNameHud').style.color=state.p.color;
 $('cNameHud').style.color=state.c.color;
 $('roundLabel').textContent=state.weapon.toUpperCase();
}
function resetMatch(){
 state.scoreP=0;state.scoreC=0;state.time=180;state.phase='ready';
 state.p.x=.34;state.c.x=.66;
 for(const f of [state.p,state.c]){
  f.v=0;f.attacking=0;f.charge=0;f.cooldown=0;f.lunging=0;f.guard=0;
 }
 state.p.dir=1;state.c.dir=-1;state.particles=[];
 updateHUD();updateTimer();$('status').textContent='EN GARDE';
}
function updateTimer(){
 const t=Math.ceil(state.time);
 $('timer').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
}
function setOverlay(show){
 $('overlay').classList.toggle('hidden',!show);
}
function readySequence(){
 state.phase='intro';state.running=true;state.paused=false;
 $('pauseBtn').textContent='Ⅱ PAUSE';
 $('countdown').classList.remove('hidden');
 sequenceStep(0);
}
function sequenceStep(i){
 const words=[
  ['左選手紹介',state.p.name],
  ['右選手紹介',state.c.name],
  ['両選手、オンガード','EN GARDE'],
  ['準備','PRÊTS?'],
  ['試合開始','ALLEZ!']
 ];
 if(i>=words.length){
  $('countdown').classList.add('hidden');
  state.phase='fight';$('status').textContent='ALLEZ!';
  return;
 }
 $('countdownName').textContent=words[i][0];
 $('countdownWord').textContent=words[i][1];
 state.intro=i;
 setTimeout(()=>{if(state.running&&!state.paused&&state.phase==='intro')sequenceStep(i+1)},i<2?3000:1000);
}
function startMatch(){
 readSettings();resetMatch();setOverlay(false);
 $('startBtn').textContent='▶ 試合開始';
 readySequence();
}
function goHome(){
 state.running=false;state.paused=false;state.phase='menu';
 $('countdown').classList.add('hidden');setOverlay(true);
 $('pauseBtn').textContent='Ⅱ PAUSE';
}
function togglePause(){
 if(!state.running)return;
 if(state.paused){
  state.paused=false;$('pauseBtn').textContent='Ⅱ PAUSE';
  if(state.phase==='pause')state.phase='fight';
 }else{
  state.paused=true;$('pauseBtn').textContent='▶ RESUME';
 }
}
function showResult(msg){
 state.running=false;state.paused=false;state.phase='result';
 $('countdown').classList.remove('hidden');
 $('countdownName').textContent='試合終了';
 $('countdownWord').textContent=msg;
 $('status').textContent='FINISHED';
 setTimeout(()=>{if(state.phase==='result')goHome()},2400);
}
function scorePoint(side){
 if(state.phase!=='fight')return;
 if(performance.now()-state.lastPoint<550)return;
 state.lastPoint=performance.now();
 if(side==='p')state.scoreP++;else state.scoreC++;
 const f=state[side];state.flash=1;state.flashColor=f.color;
 for(let i=0;i<34;i++){
  state.particles.push({x:W/2+rand(-60,60),y:H*.55+rand(-30,30),vx:rand(-3,3),vy:rand(-4,2),life:rand(.4,1),color:f.color,size:rand(2,5)});
 }
 state.message=(side==='p'?state.p.name:state.c.name)+' TOUCHÉ';
 $('status').textContent=state.message;
 updateHUD();
 state.phase='point';state.p.v=state.c.v=0;
 state.p.attacking=state.c.attacking=0;
 setTimeout(()=>{
  if(!state.running)return;
  state.p.x=.34;state.c.x=.66;state.p.v=state.c.v=0;
  state.phase='fight';$('status').textContent='ALLEZ!';
 },1050);
 if(state.scoreP>=15||state.scoreC>=15){
  setTimeout(()=>showResult(state.scoreP===state.scoreC?'DRAW':state.scoreP>state.scoreC?state.p.name+' WINS':state.c.name+' WINS'),1100);
 }
}
function attack(side){
 if(!state.running||state.paused||state.phase!=='fight')return;
 const f=state[side];
 if(f.cooldown>0)return;
 const charge=clamp(f.charge,0,1);
 f.attacking=.24+charge*.2;
 f.lunging=.24+charge*.22;
 f.cooldown=.55;
 f.charge=0;
 f.guard=0;
}
function moveFencer(side,dt){
 const f=state[side],other=state[side==='p'?'c':'p'];
 const input=state.touch[side];
 let back=input.back||state.keys[side==='p'?'a':'ArrowRight'];
 let forward=input.forward||state.keys[side==='p'?'d':'ArrowLeft'];
 if(side==='c'){
  forward=input.forward||state.keys.ArrowLeft;
  back=input.back||state.keys.ArrowRight;
 }
 if(side==='p'){
  forward=input.forward||state.keys.d||state.keys.ArrowRight;
  back=input.back||state.keys.a||state.keys.ArrowLeft;
 }
 let dir=(forward?1:0)-(back?1:0);
 if(side==='c')dir=-dir;
 if(state.mode==='cpu'&&side==='c'&&state.phase==='fight'){
  const dist=Math.abs(f.x-other.x);
  const near=dist<.19,far=dist>.33;
  const r=Math.random();
  if(near)dir=-1;
  else if(f.cooldown<.15&&dist<.29&&r<.045)dir=1;
  else if(far)dir=1;
  else if(r<.012)dir=Math.random()<.5?1:-1;
  else dir=0;
  if(dist<.27&&f.cooldown<=0&&Math.random()<.028)attack('c');
 }
 const speed=(.20+f.stats.speed/100*.23);
 f.v=dir*speed;
 if(f.lunging>0){
  f.v+=((side==='p')?1:-1)*(.18+f.charge*.15);
  f.lunging=Math.max(0,f.lunging-dt);
 }
 f.x+=f.v*dt;
 f.x=clamp(f.x,.105,.895);
 const minGap=.075;
 if(Math.abs(f.x-other.x)<minGap){
  if(side==='p')f.x=Math.min(f.x,other.x-minGap);
  else f.x=Math.max(f.x,other.x+minGap);
 }
 f.attacking=Math.max(0,f.attacking-dt);
 f.cooldown=Math.max(0,f.cooldown-dt);
 if(input.attack)f.charge=clamp(f.charge+dt*1.5,0,1);
}
function resolveHits(){
 if(state.phase!=='fight')return;
 const p=state.p,c=state.c;
 const dist=Math.abs(c.x-p.x);
 if(p.attacking>0&&dist<.22&&p.x<c.x&&Math.random()<.28){
  if(c.guard<=0)scorePoint('p');else p.attacking=0;
 }
 if(c.attacking>0&&dist<.22&&c.x>p.x&&Math.random()<.28){
  if(p.guard<=0)scorePoint('c');else c.attacking=0;
 }
}
function tick(dt){
 if(!state.running||state.paused)return;
 if(state.phase==='intro')return;
 if(state.phase==='fight'){
  state.time=Math.max(0,state.time-dt);updateTimer();
  if(state.time<=0){
   showResult(state.scoreP===state.scoreC?'DRAW':state.scoreP>state.scoreC?state.p.name+' WINS':state.c.name+' WINS');return;
  }
  moveFencer('p',dt);moveFencer('c',dt);resolveHits();
 }
 state.flash=Math.max(0,state.flash-dt*2.8);
 for(const q of state.particles){q.x+=q.vx;q.y+=q.vy;q.vy+=.06;q.life-=dt;}
 state.particles=state.particles.filter(q=>q.life>0);
}
function roundedRect(x,y,w,h,r,color){
 ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
}
function drawCrowd(){
 for(const s of state.crowd){
  let color=s.c;
  if(state.flash>0&&Math.random()<.65)color=state.flashColor;
  else if(s.light>.94)color=state.flash>0?state.flashColor:'#d6e7ff';
  ctx.globalAlpha=s.light>.94?.95:.7;
  ctx.fillStyle=color;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
}
function drawArena(){
 ctx.clearRect(0,0,W,H);
 const bg=ctx.createLinearGradient(0,0,0,H);
 bg.addColorStop(0,'#09182b');bg.addColorStop(.5,'#0c2036');bg.addColorStop(1,'#050e1a');
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 drawCrowd();
 const cy=H*.70,pisteH=Math.min(H*.23,110),left=W*.09,right=W*.91;
 const grad=ctx.createLinearGradient(0,cy-pisteH/2,0,cy+pisteH/2);
 grad.addColorStop(0,'#8d9baa');grad.addColorStop(.45,'#d2d9e0');grad.addColorStop(1,'#738396');
 ctx.fillStyle=grad;ctx.fillRect(left,cy-pisteH/2,right-left,pisteH);
 ctx.fillStyle='#e7edf3';ctx.fillRect(left,cy-pisteH/2, right-left,2);
 ctx.fillStyle='#536578';ctx.fillRect(left,cy+pisteH/2-2,right-left,2);
 ctx.strokeStyle='#25384d';ctx.lineWidth=2;
 for(let i=0;i<9;i++){
  const x=left+(right-left)*i/8;
  ctx.beginPath();ctx.moveTo(x,cy-pisteH/2);ctx.lineTo(x,cy+pisteH/2);ctx.stroke();
 }
 ctx.strokeStyle='#f6f9ff';ctx.lineWidth=2;
 const center=W*.5,startL=W*.29,startR=W*.71;
 for(const x of [left+3,startL,center,startR,right-3]){
  ctx.beginPath();ctx.moveTo(x,cy-pisteH*.49);ctx.lineTo(x,cy+pisteH*.49);ctx.stroke();
 }
 ctx.fillStyle='#111e2b';ctx.font='bold 10px system-ui';ctx.textAlign='center';
 ctx.fillText('FENCING ELITE',W*.5,cy-pisteH*.5-8);
 ctx.fillStyle='#192d43';
 ctx.fillRect(0,cy+pisteH/2+4,W,H-(cy+pisteH/2+4));
 const glowY=cy-pisteH/2-3;
 for(let i=0;i<Math.ceil(W/9);i++){
  const x=i*9+3;
  const side=x<W*.5?'p':'c';
  const f=state[side];
  ctx.globalAlpha=.45+Math.random()*.35;
  ctx.fillStyle=(state.flash>0&&Math.random()<.45)?state.flashColor:f.color;
  ctx.fillRect(x,glowY,3,rand(4,10));
 }
 ctx.globalAlpha=1;
}
function drawFencer(f,side){
 const x=f.x*W,base=H*.70,scale=clamp(H/440,.65,1.1);
 const dir=side==='p'?1:-1;
 const y=base-5;
 ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
 ctx.strokeStyle='#08111d';ctx.lineWidth=13;ctx.lineCap='round';ctx.lineJoin='round';
 // Legs, feet, torso, arms
 const lunge=f.attacking>0?20:0;
 ctx.beginPath();
 ctx.moveTo(0,-48);ctx.lineTo(-dir*(13+lunge*.35),-22);ctx.lineTo(-dir*(28+lunge),-4);
 ctx.moveTo(0,-48);ctx.lineTo(dir*(10+lunge*.25),-23);ctx.lineTo(dir*(27+lunge*.3),-4);
 ctx.stroke();
 ctx.strokeStyle='#f0f4f8';ctx.lineWidth=8;
 ctx.beginPath();
 ctx.moveTo(-dir*(28+lunge),-4);ctx.lineTo(-dir*(35+lunge),-3);
 ctx.moveTo(dir*(27+lunge*.3),-4);ctx.lineTo(dir*(35+lunge*.3),-3);
 ctx.stroke();
 ctx.fillStyle=f.color;
 ctx.beginPath();ctx.moveTo(-dir*10,-86);ctx.lineTo(dir*10,-86);ctx.lineTo(dir*12,-51);ctx.lineTo(-dir*11,-47);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#f5f7fa';ctx.lineWidth=4;
 ctx.beginPath();ctx.moveTo(-dir*8,-80);ctx.lineTo(-dir*14,-59);ctx.lineTo(-dir*6,-49);ctx.stroke();
 // Fencing arm and foil
 const armX=dir*(8+(f.attacking>0?8:0)),armY=-79;
 ctx.strokeStyle='#f3f5f7';ctx.lineWidth=6;
 ctx.beginPath();ctx.moveTo(armX-dir*3,armY+3);ctx.lineTo(dir*18,-72);ctx.lineTo(dir*29,-76);ctx.stroke();
 ctx.strokeStyle='#101722';ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(dir*18,-72);ctx.lineTo(dir*29,-76);ctx.stroke();
 ctx.strokeStyle=f.blade;ctx.lineWidth=2;
 const bladeStartX=dir*29,bladeStartY=-76;
 const reach=f.attacking>0?108+f.charge*55:76;
 ctx.beginPath();ctx.moveTo(bladeStartX,bladeStartY);ctx.lineTo(dir*(29+reach),bladeStartY-3);ctx.stroke();
 ctx.strokeStyle='#e8eef5';ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(dir*26,-70);ctx.lineTo(dir*31,-80);ctx.stroke();
 // Non-weapon arm
 ctx.strokeStyle='#f0f3f6';ctx.lineWidth=5;
 ctx.beginPath();ctx.moveTo(-dir*7,-79);ctx.lineTo(-dir*19,-67);ctx.lineTo(-dir*16,-57);ctx.stroke();
 // Neck and mask
 ctx.fillStyle='#d8dfe7';ctx.fillRect(-4,-91,8,8);
 ctx.fillStyle=f.mask;
 ctx.beginPath();ctx.ellipse(dir*1,-101,13,12,0,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#5a6b7d';ctx.lineWidth=2;
 ctx.beginPath();ctx.ellipse(dir*1,-101,13,12,0,0,Math.PI*2);ctx.stroke();
 ctx.strokeStyle='#8192a4';ctx.lineWidth=1;
 for(let k=-8;k<=8;k+=4){ctx.beginPath();ctx.moveTo(k,-109);ctx.lineTo(k,-93);ctx.stroke();}
 // Lamé and body highlights
 ctx.strokeStyle='#ffffff80';ctx.lineWidth=1.5;
 ctx.beginPath();ctx.moveTo(-dir*5,-82);ctx.lineTo(-dir*3,-54);ctx.stroke();
 if(f.attacking>0){
  ctx.globalAlpha=.55;
  ctx.strokeStyle=f.color;ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(dir*29,-76);ctx.lineTo(dir*(29+reach),-76);ctx.stroke();
  ctx.globalAlpha=1;
 }
 ctx.restore();
 // name tag
 ctx.font='bold 12px system-ui';ctx.textAlign='center';
 ctx.fillStyle='#ffffff';ctx.shadowColor='#000';ctx.shadowBlur=5;
 ctx.fillText(f.name,x,base-130*scale);
 ctx.shadowBlur=0;
}
function draw(){
 if(!W||!H)return;
 drawArena();
 drawFencer(state.p,'p');drawFencer(state.c,'c');
 for(const q of state.particles){
  ctx.globalAlpha=clamp(q.life,0,1);ctx.fillStyle=q.color;
  ctx.beginPath();ctx.arc(q.x,q.y,q.size,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
 if(state.paused){
  ctx.fillStyle='#030b16a8';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='white';ctx.font='bold 36px system-ui';ctx.textAlign='center';
  ctx.fillText('PAUSED',W/2,H/2);
 }
}
function frame(now){
 const dt=Math.min(.04,(now-state.lastTime)/1000||0);state.lastTime=now;
 tick(dt);draw();requestAnimationFrame(frame);
}
function bindControls(){
 document.querySelectorAll('[data-action]').forEach(btn=>{
  const side=btn.dataset.side,action=btn.dataset.action;
  const down=e=>{
   e.preventDefault();
   if(!state.running||state.paused)return;
   const f=state[side];
   if(action==='attack'){
    state.touch[side].attack=true;
    f.charge=0;
   }else state.touch[side][action]=true;
   try{btn.setPointerCapture(e.pointerId)}catch(_){}
  };
  const up=e=>{
   e.preventDefault();
   if(action==='attack'){
    state.touch[side].attack=false;
    attack(side);
   }else state.touch[side][action]=false;
  };
  btn.addEventListener('pointerdown',down);
  btn.addEventListener('pointerup',up);
  btn.addEventListener('pointercancel',up);
  btn.addEventListener('lostpointercapture',()=>{
   state.touch[side][action]=false;
  });
 });
}
function bindKeyboard(){
 document.addEventListener('keydown',e=>{
  if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  state.keys[k]=true;
  if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  if(k==='f'&&!e.repeat)attack('p');
  if(e.key==='Enter'&&!e.repeat)attack('c');
  if(k===' '&&!e.repeat)attack('p');
 });
 document.addEventListener('keyup',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  state.keys[k]=false;
 });
}
function bindSettings(){
 for(const id of ['pSpeed','pPower','pDefense','cSpeed','cPower','cDefense']){
  $(id).addEventListener('input',()=>{$(id+'Out').textContent=$(id).value});
 }
 $('startBtn').addEventListener('click',startMatch);
 $('customBtn').addEventListener('click',()=>{readSettings();toast('選手設定を反映しました')});
 $('resetBtn').addEventListener('click',()=>{
  $('mode').value='cpu';$('weapon').value='epee';
  $('pName').value='PLAYER 1';$('cName').value='CPU';
  $('pColor').value='#ff4058';$('cColor').value='#39a7ff';
  $('pMask').value=$('cMask').value='#dce6f0';
  $('pBlade').value=$('cBlade').value='#d8f2ff';
  $('pSpeed').value=$('pPower').value=$('pDefense').value=75;
  $('cSpeed').value=$('cPower').value=$('cDefense').value=70;
  for(const id of ['pSpeed','pPower','pDefense','cSpeed','cPower','cDefense'])$(id+'Out').textContent=$(id).value;
  readSettings();toast('設定をリセットしました');
 });
 $('homeBtn').addEventListener('click',goHome);
 $('pauseBtn').addEventListener('click',togglePause);
}
window.addEventListener('resize',resize);
bindControls();bindKeyboard();bindSettings();
readSettings();resize();resetMatch();
requestAnimationFrame(frame);
})();
</script>
