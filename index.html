<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FENCING ELITE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08101f;color:#fff;font-family:Arial,sans-serif;text-align:center}
button,select{font-size:16px;padding:12px 16px;margin:5px;border-radius:9px;border:1px solid #659bdf;background:#162c4b;color:#fff}
button:active{background:#3376c7}
h1{font-size:clamp(30px,7vw,55px);letter-spacing:3px;text-shadow:0 0 18px #168bff}
h2{color:#9fcaff}
.panel{max-width:1000px;margin:auto;padding:15px}
.hidden{display:none!important}
#arena{width:100%;height:min(55vh,480px);min-height:300px;background:linear-gradient(#132744,#263d59);border:2px solid #46668d;border-radius:12px;overflow:hidden;position:relative}
#three{position:absolute;inset:0;width:100%;height:100%}
#hud{display:flex;justify-content:space-around;align-items:center}
.score{font-size:42px;font-weight:bold}
#clock{font-size:25px;color:#b6d9ff}
#status{min-height:26px;color:#b6d9ff}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:3px}
small{color:#b1c2dc}
</style>
</head>
<body>
<section id="home" class="panel">
<h1>FENCING ELITE</h1>
<p>ÉPÉE · THE ULTIMATE DUEL</p>
<h2>3D FENCING SIMULATOR</h2>
<p>3分間・15点先取</p>
<label>CPU難易度
<select id="difficulty">
<option value="1">BEGINNER</option>
<option value="2">INTERMEDIATE</option>
<option value="3">ADVANCED</option>
<option value="4">EXPERT</option>
</select>
</label><br>
<button onclick="startGame()">START</button>
<button onclick="showRecords()">RECORDS</button>
<div id="records" class="hidden"></div>
</section>
<section id="game" class="panel hidden">
<div id="hud">
<div><small>PLAYER</small><div id="s1" class="score">0</div></div>
<div><div id="clock">03:00</div><div id="status">EN GARDE!</div></div>
<div><small>CPU</small><div id="s2" class="score">0</div></div>
</div>
<div id="arena"><div id="three"></div></div>
<div class="controls">
<button onclick="move(-1)">◀ 後退</button>
<button onclick="move(1)">前進 ▶</button>
<button onclick="attack()">⚔ 攻撃</button>
<button onclick="toggleGuard()">🛡 防御</button>
<button onclick="backHome()">メニュー</button>
</div>
<p><small>PC：← → 移動、↑ 攻撃、↓ 防御</small></p>
</section>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
let scene,camera,renderer,p1,p2,sword1,sword2;
let game=null,timer=null,cpuTimer=null,guarding=false,attackLock=false;
function makeFencer(x,color){
 const root=new THREE.Group();
 root.position.set(x,0,0);
 scene.add(root);
 const uniform=new THREE.MeshStandardMaterial({color:0xf2f5f8,roughness:.8});
 const dark=new THREE.MeshStandardMaterial({color:color,metalness:.3,roughness:.4});
 const skin=new THREE.MeshStandardMaterial({color:0xd6ad8d});
 const metal=new THREE.MeshStandardMaterial({color:0xcbd8e6,metalness:.8,roughness:.25});
 function part(parent,geo,mat,pos){
  const m=new THREE.Mesh(geo,mat);m.position.set(...pos);parent.add(m);return m;
 }
 part(root,new THREE.CylinderGeometry(.24,.32,.85,12),uniform,[0,1.25,0]);
 part(root,new THREE.SphereGeometry(.22,16,12),dark,[0,1.95,0]);
 part(root,new THREE.BoxGeometry(.4,.22,.32),dark,[0,1.95,.04]);
 const legs=[];
 for(let i of [-1,1]){
  const leg=part(root,new THREE.CylinderGeometry(.09,.11,.65,10),uniform,[i*.13,.42,0]);
  leg.rotation.z=i*.12;legs.push(leg);
  part(root,new THREE.BoxGeometry(.22,.12,.35),dark,[i*.13,.08,.08]);
 }
 const arm=part(root,new THREE.CylinderGeometry(.07,.09,.65,10),uniform,[.38,1.45,0]);
 arm.rotation.z=-1.1;
 sword1=null;
 const sword=part(root,new THREE.CylinderGeometry(.012,.025,1.35,6),metal,[.75,1.62,0]);
 sword.rotation.z=-Math.PI/2;
 part(root,new THREE.SphereGeometry(.09,10,8),dark,[.53,1.62,0]);
 root.userData.arm=arm;root.userData.sword=sword;root.userData.legs=legs;
 return root;
}
function init3D(){
 const host=document.getElementById('three');
 host.innerHTML='';
 scene=new THREE.Scene();scene.background=new THREE.Color(0x172b46);
 scene.fog=new THREE.Fog(0x172b46,12,25);
 camera=new THREE.PerspectiveCamera(36,host.clientWidth/host.clientHeight,.1,100);
 camera.position.set(0,3.3,12);camera.lookAt(0,1,0);
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.setSize(host.clientWidth,host.clientHeight);
 host.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xffffff,0x42536b,2));
 const light=new THREE.DirectionalLight(0xffffff,2.5);
 light.position.set(-3,8,5);scene.add(light);
 const floor=new THREE.Mesh(new THREE.BoxGeometry(12,.12,3),new THREE.MeshStandardMaterial({color:0xcbd4df,metalness:.25,roughness:.5}));
 floor.position.set(0,-.12,0);scene.add(floor);
 for(let x=-5;x<=5;x+=1){
  const line=new THREE.Mesh(new THREE.BoxGeometry(.012,.008,3),new THREE.MeshBasicMaterial({color:0x6e8299}));
  line.position.set(x,-.05,0);scene.add(line);
 }
 p1=makeFencer(-2.4,0x286fe0);
 p2=makeFencer(2.4,0xd93c50);
 p2.rotation.y=Math.PI;
 p1.rotation.y=0;
 window.addEventListener('resize',resize3D);
 animate();
}
function resize3D(){
 if(!renderer||!camera)return;
 const host=document.getElementById('three');
 camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();
 renderer.setSize(host.clientWidth,host.clientHeight);
}
function animate(){
 requestAnimationFrame(animate);
 if(renderer&&scene&&camera)renderer.render(scene,camera);
}
function render(){
 if(!game)return;
 document.getElementById('s1').textContent=game.a;
 document.getElementById('s2').textContent=game.b;
 document.getElementById('clock').textContent=
  String(Math.floor(game.remaining/60)).padStart(2,'0')+':'+String(game.remaining%60).padStart(2,'0');
 if(p1)p1.position.x=-2.4+(game.x-24)*.12;
 if(p2)p2.position.x=2.4;
 if(p1)p1.userData.arm.rotation.z=guarding?-.2:(attackLock?-1.5:-1.1);
}
window.startGame=function(){
 clearInterval(timer);clearInterval(cpuTimer);
 document.getElementById('home').classList.add('hidden');
 document.getElementById('game').classList.remove('hidden');
 game={a:0,b:0,x:24,remaining:180,difficulty:+document.getElementById('difficulty').value,over:false};
 guarding=false;attackLock=false;
 try{init3D();}catch(e){document.getElementById('status').textContent='3D読み込みエラー。通信を確認してね。';console.error(e);}
 document.getElementById('status').textContent='EN GARDE!';
 render();
 timer=setInterval(()=>{
  if(!game||game.over)return;
  game.remaining--;render();
  if(game.a>=15||game.b>=15||game.remaining<=0)finish();
 },1000);
 cpuTimer=setInterval(cpuMove,900);
};
window.move=function(d){
 if(!game||game.over)return;
 game.x=Math.max(8,Math.min(45,game.x+d*2));render();
};
window.attack=function(){
 if(!game||game.over||attackLock)return;
 attackLock=true;render();
 setTimeout(()=>{
  if(!game||game.over)return;
  const distance=Math.abs(game.x-76);
  const chance=distance<34?.78:distance<43?.48:.12;
  if(Math.random()<chance&&!guarding){
   game.a++;document.getElementById('status').textContent='TOUCHÉ! YOU SCORE!';
  }else document.getElementById('status').textContent=guarding?'PARRIED!':'ATTACK MISSED';
  attackLock=false;render();
  if(game.a>=15)finish();
 },350);
};
window.toggleGuard=function(){
 guarding=!guarding;
 document.getElementById('status').textContent=guarding?'GUARD':'EN GARDE!';
 render();
};
function cpuMove(){
 if(!game||game.over)return;
 if(Math.random()<.55)game.x=Math.max(8,Math.min(45,game.x+(Math.random()<.5?-1:1)));
 if(Math.random()<.15+game.difficulty*.07){
  if(!guarding){game.b++;document.getElementById('status').textContent='CPU TOUCHÉ!';}
  else document.getElementById('status').textContent='CPU ATTACK BLOCKED';
 }
 render();if(game.b>=15)finish();
}
function finish(){
 if(!game||game.over)return;
 game.over=true;clearInterval(timer);clearInterval(cpuTimer);
 const result=game.a>game.b?'WIN':game.a<game.b?'LOSS':'DRAW';
 document.getElementById('status').textContent='BOUT FINISHED — '+result;
 const list=JSON.parse(localStorage.getItem('fencingRecords')||'[]');
 list.unshift({date:new Date().toLocaleString(),result,score:game.a+' - '+game.b});
 localStorage.setItem('fencingRecords',JSON.stringify(list.slice(0,10)));
 alert('試合終了！ '+result+' '+game.a+' - '+game.b);
}
window.showRecords=function(){
 const box=document.getElementById('records');box.classList.toggle('hidden');
 const list=JSON.parse(localStorage.getItem('fencingRecords')||'[]');
 box.innerHTML='<h2>戦績</h2>'+(list.length?list.map(x=>'<p>'+x.date+'｜'+x.result+'｜'+x.score+'</p>').join(''):'<p>まだ記録がありません</p>');
};
window.backHome=function(){
 clearInterval(timer);clearInterval(cpuTimer);game=null;
 document.getElementById('game').classList.add('hidden');
 document.getElementById('home').classList.remove('hidden');
};
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft')move(-1);
 if(e.key==='ArrowRight')move(1);
 if(e.key==='ArrowUp')attack();
 if(e.key==='ArrowDown'&&!guarding)toggleGuard();
});
document.addEventListener('keyup',e=>{
 if(e.key==='ArrowDown'&&guarding)toggleGuard();
});
</script>
</body>
</html>
