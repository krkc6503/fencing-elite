<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FENCING ELITE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08101f;color:#fff;font-family:Arial,sans-serif;text-align:center}
button,select{font-size:16px;padding:11px 14px;margin:4px;border-radius:9px;border:1px solid #659bdf;background:#162c4b;color:#fff;touch-action:manipulation}
button:active,button.active{background:#3376c7}
button:disabled{opacity:.45}
h1{font-size:clamp(30px,7vw,55px);letter-spacing:3px;text-shadow:0 0 18px #168bff}
h2{color:#9fcaff}
.panel{max-width:1000px;margin:auto;padding:15px}
.hidden{display:none!important}
#arena{width:100%;height:min(55vh,480px);min-height:300px;background:#132744;border:2px solid #46668d;border-radius:12px;overflow:hidden;position:relative}
#three{position:absolute;inset:0;width:100%;height:100%}
#hud{display:flex;justify-content:space-around;align-items:center;gap:8px}
.score{font-size:42px;font-weight:bold}
#clock{font-size:25px;color:#b6d9ff}
#status{min-height:26px;color:#b6d9ff}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:3px}
.meter{width:min(38vw,250px);height:10px;background:#293b52;border-radius:8px;overflow:hidden;margin:4px auto}
.fill{height:100%;width:100%;background:#58d68d;transition:width .1s}
small{color:#b1c2dc}
.hint{font-size:13px;color:#a8bad3}
</style>
</head>
<body>

<section id="home" class="panel">
<h1>FENCING ELITE</h1>
<p>ÉPÉE · THE ULTIMATE DUEL</p>
<h2>3D FENCING SIMULATOR</h2>
<p>3分間・15点先取</p>

<label>CPU難易度
<select id="difficulty">
<option value="1">BEGINNER</option>
<option value="2">INTERMEDIATE</option>
<option value="3">ADVANCED</option>
<option value="4">EXPERT</option>
</select>
</label>
<br>

<button onclick="startGame()">START</button>
<button onclick="showRecords()">RECORDS</button>

<div id="records" class="hidden"></div>
<p class="hint">攻撃は距離・タイミング・スタミナで判定。防御中は移動が遅くなります。</p>
</section>

<section id="game" class="panel hidden">
<div id="hud">
<div>
<small>PLAYER</small>
<div id="s1" class="score">0</div>
<small>STAMINA</small>
<div class="meter"><div id="st1" class="fill"></div></div>
</div>

<div>
<div id="clock">03:00</div>
<div id="status">EN GARDE!</div>
</div>

<div>
<small>CPU</small>
<div id="s2" class="score">0</div>
<small>STAMINA</small>
<div class="meter"><div id="st2" class="fill"></div></div>
</div>
</div>

<div id="arena"><div id="three"></div></div>

<div class="controls">
<button id="retreat">◀ 後退</button>
<button id="advance">前進 ▶</button>
<button id="attackBtn">⚔ 攻撃（長押し→離す）</button>
<button id="guardBtn">🛡 防御</button>
<button onclick="backHome()">メニュー</button>
</div>

<p class="hint">
PC：← → 移動、↑ 攻撃、↓ 防御。<br>
スマホ・iPad：ボタンを長押しできます。
</p>
</section>

<script type="module">
let THREE=null,scene,camera,renderer,p1,p2;
let game=null,timer=null,lastTick=0,raf=0;
let keys={left:false,right:false,guard:false};
let attackCharge=0,chargeTimer=null;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function makeFencer(x,color){
 const root=new THREE.Group();
 root.position.set(x,0,0);
 scene.add(root);

 const uniform=new THREE.MeshStandardMaterial({
  color:0xf2f5f8,roughness:.8
 });
 const dark=new THREE.MeshStandardMaterial({
  color,metalness:.3,roughness:.4
 });
 const metal=new THREE.MeshStandardMaterial({
  color:0xcbd8e6,metalness:.8,roughness:.25
 });

 function part(geo,mat,pos){
  const m=new THREE.Mesh(geo,mat);
  m.position.set(...pos);
  root.add(m);
  return m;
 }

 part(new THREE.CylinderGeometry(.24,.32,.85,12),uniform,[0,1.25,0]);
 part(new THREE.SphereGeometry(.23,16,12),dark,[0,1.95,0]);
 part(new THREE.BoxGeometry(.42,.2,.34),dark,[0,1.95,.04]);

 const legs=[];
 for(const i of [-1,1]){
  const leg=part(
   new THREE.CylinderGeometry(.09,.11,.65,10),
   uniform,[i*.13,.42,0]
  );
  leg.rotation.z=i*.12;
  legs.push(leg);
  part(new THREE.BoxGeometry(.22,.12,.35),dark,[i*.13,.08,.08]);
 }

 const arm=part(
  new THREE.CylinderGeometry(.07,.09,.65,10),
  uniform,[.38,1.45,0]
 );
 arm.rotation.z=-1.1;

 const sword=part(
  new THREE.CylinderGeometry(.012,.025,1.35,6),
  metal,[.75,1.62,0]
 );
 sword.rotation.z=-Math.PI/2;

 part(new THREE.SphereGeometry(.09,10,8),dark,[.53,1.62,0]);

 root.userData={arm,sword,legs,baseX:x,walk:0};
 return root;
}

async function init3D(){
 if(!THREE){
  const mod=await import(
   'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js'
  );
  THREE=mod;
 }

 const host=document.getElementById('three');
 host.innerHTML='';

 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x172b46);
 scene.fog=new THREE.Fog(0x172b46,12,25);

 camera=new THREE.PerspectiveCamera(
  36,host.clientWidth/host.clientHeight,.1,100
 );
 camera.position.set(0,3.3,12);
 camera.lookAt(0,1,0);

 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.setSize(host.clientWidth,host.clientHeight);
 host.appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0xffffff,0x42536b,2));

 const light=new THREE.DirectionalLight(0xffffff,2.5);
 light.position.set(-3,8,5);
 scene.add(light);

 const floor=new THREE.Mesh(
  new THREE.BoxGeometry(12,.12,3),
  new THREE.MeshStandardMaterial({
   color:0xcbd4df,metalness:.25,roughness:.5
  })
 );
 floor.position.set(0,-.12,0);
 scene.add(floor);

 for(let x=-5;x<=5;x+=1){
  const line=new THREE.Mesh(
   new THREE.BoxGeometry(.012,.008,3),
   new THREE.MeshBasicMaterial({color:0x6e8299})
  );
  line.position.set(x,-.05,0);
  scene.add(line);
 }

 p1=makeFencer(-2.3,0x286fe0);
 p2=makeFencer(2.3,0xd93c50);
 p2.rotation.y=Math.PI;

 window.addEventListener('resize',resize3D);
 cancelAnimationFrame(raf);
 animate();
}

function resize3D(){
 if(!renderer||!camera)return;
 const host=document.getElementById('three');
 camera.aspect=host.clientWidth/host.clientHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(host.clientWidth,host.clientHeight);
}

function animate(){
 raf=requestAnimationFrame(animate);
 if(game&&!game.over)updateFrame();
 if(renderer&&scene&&camera)renderer.render(scene,camera);
}

function updateFrame(){
 const now=performance.now();
 const dt=Math.min(.05,(now-(game.lastFrame||now))/1000);
 game.lastFrame=now;
 if(!dt)return;

 const moveSpeed=(keys.guard||game.player.guard)?.65:1.25;
 let moving=false;

 if(keys.left){
  game.player.x-=moveSpeed*dt;
  moving=true;
 }
 if(keys.right){
  game.player.x+=moveSpeed*dt;
  moving=true;
 }

 game.player.x=clamp(game.player.x,-4.7,-.7);

 if(moving){
  game.player.stamina=Math.max(0,game.player.stamina-9*dt);
 }else if(!game.player.attacking){
  game.player.stamina=Math.min(100,game.player.stamina+12*dt);
 }

 if(game.player.guard||keys.guard){
  game.player.stamina=Math.max(0,game.player.stamina-5*dt);
 }

 const gap=game.cpu.x-game.player.x;

 game.cpu.cooldown=Math.max(0,game.cpu.cooldown-dt);
 game.cpu.recover=Math.max(0,game.cpu.recover-dt);

 if(game.cpu.stamina<100&&!game.cpu.attacking){
  game.cpu.stamina=Math.min(100,game.cpu.stamina+8*dt);
 }

 const difficulty=game.difficulty;

 if(game.cpu.cooldown<=0&&game.cpu.recover<=0){
  if(gap>2.35&&Math.random()<(.35+difficulty*.12)){
   game.cpu.x-=(.75+difficulty*.12)*dt*10;
   game.cpu.stamina=Math.max(0,game.cpu.stamina-4*dt);
  }else if(gap<1.25&&Math.random()<.45){
   game.cpu.x=Math.min(4.7,game.cpu.x+.8*dt*10);
  }else if(gap<=2.55&&Math.random()<(.08+difficulty*.035)){
   cpuAttack();
  }

  game.cpu.cooldown=.18+Math.random()*(.55-difficulty*.07);
 }

 game.cpu.x=clamp(game.cpu.x,.7,4.7);

 if(p1){
  p1.position.x=game.player.x;
  p1.userData.arm.rotation.z=game.player.attacking?-.45:
   (game.player.guard||keys.guard?-.25:-1.1);
  p1.userData.sword.rotation.z=game.player.attacking?-.2:-Math.PI/2;
  p1.userData.legs.forEach((l,i)=>{
   l.rotation.z=(moving?Math.sin(now/85+i*Math.PI)*.3:0)
    +(i===0?-.12:.12);
  });
 }

 if(p2){
  p2.position.x=game.cpu.x;
  p2.userData.arm.rotation.z=game.cpu.attacking?-.45:
   (game.cpu.guard?-.25:-1.1);
  p2.userData.sword.rotation.z=game.cpu.attacking?-.2:-Math.PI/2;
 }

 game.player.guard=!!keys.guard;
 render();
}

function render(){
 if(!game)return;

 document.getElementById('s1').textContent=game.a;
 document.getElementById('s2').textContent=game.b;

 document.getElementById('clock').textContent=
  String(Math.floor(game.remaining/60)).padStart(2,'0')+':'+
  String(game.remaining%60).padStart(2,'0');

 document.getElementById('st1').style.width=game.player.stamina+'%';
 document.getElementById('st2').style.width=game.cpu.stamina+'%';

 document.getElementById('st1').style.background=
  game.player.stamina<25?'#ff6b6b':'#58d68d';

 document.getElementById('st2').style.background=
  game.cpu.stamina<25?'#ff6b6b':'#58d68d';
}

window.startGame=function(){
 clearInterval(timer);
 cancelAnimationFrame(raf);

 document.getElementById('home').classList.add('hidden');
 document.getElementById('game').classList.remove('hidden');

 game={
  a:0,b:0,remaining:180,
  difficulty:+document.getElementById('difficulty').value,
  over:false,lastFrame:performance.now(),
  player:{
   x:-2.3,stamina:100,guard:false,
   attacking:false,cooldown:0
  },
  cpu:{
   x:2.3,stamina:100,guard:false,
   attacking:false,cooldown:0,recover:0
  }
 };

 keys={left:false,right:false,guard:false};
 attackCharge=0;

 document.getElementById('status').textContent='EN GARDE!';

 init3D().catch(e=>{
  document.getElementById('status').textContent=
   '3D読み込みに失敗。通信を確認して再読み込みしてね。';
  console.error(e);
 });

 render();

 timer=setInterval(()=>{
  if(!game||game.over)return;
  game.remaining--;
  render();

  if(game.a>=15||game.b>=15||game.remaining<=0){
   finish();
  }
 },1000);
};

function playerAttack(strong){
 if(!game||game.over||game.player.cooldown>0||game.player.stamina<8)return;

 const p=game.player;
 const c=game.cpu;
 const gap=c.x-p.x;
 const cost=strong?24:12;

 p.stamina=Math.max(0,p.stamina-cost);
 p.cooldown=strong?1.05:.55;
 p.attacking=true;

 const attackDuration=strong?520:280;

 document.getElementById('status').textContent=
  strong?'STRONG ATTACK!':'ATTACK!';

 setTimeout(()=>{
  if(!game||game.over)return;
  p.attacking=false;

  const range=strong?2.8:2.0;
  const inRange=gap<=range&&gap>=.45;

  const cpuParry=c.guard&&
   Math.random()<(.25+game.difficulty*.12);

  const accuracy=(p.stamina<20?.65:1)*(strong?.82:1);

  if(inRange&&Math.random()<accuracy&&!cpuParry){
   game.a++;
   document.getElementById('status').textContent='TOUCHÉ! YOU SCORE!';
   c.recover=strong?1.0:.55;
   c.x=clamp(c.x+.15,.7,4.7);
  }else{
   document.getElementById('status').textContent=
    cpuParry?'PARRIED!':
    (inRange?'ATTACK MISSED':'OUT OF DISTANCE');
  }

  render();
  if(game.a>=15)finish();
 },attackDuration);
}

function cpuAttack(){
 if(!game||game.over)return;

 const c=game.cpu;
 const p=game.player;
 const gap=c.x-p.x;

 if(c.stamina<10)return;

 c.attacking=true;
 c.stamina=Math.max(0,c.stamina-(game.difficulty>=3?16:12));
 c.cooldown=game.difficulty===4?.65:1.0;

 const delay=
  game.difficulty===1?700:
  game.difficulty===2?520:
  game.difficulty===3?390:300;

 setTimeout(()=>{
  if(!game||game.over)return;

  c.attacking=false;

  const range=game.difficulty>=3?2.35:2.05;
  const blocked=keys.guard&&p.stamina>3;

  if(gap<=range&&gap>=.45&&!blocked&&
     Math.random()<(.35+game.difficulty*.14)){
   game.b++;
   document.getElementById('status').textContent='CPU TOUCHÉ!';
   p.recover=.5;
  }else{
   document.getElementById('status').textContent=
    blocked?'ATTACK BLOCKED':'CPU MISSED';
  }

  render();
  if(game.b>=15)finish();
 },delay);
}

window.move=function(d){
 if(!game||game.over)return;
 game.player.x=clamp(game.player.x+d*.25,-4.7,-.7);
 render();
};

window.attack=function(){
 playerAttack(false);
};

window.toggleGuard=function(){
 keys.guard=!keys.guard;
 document.getElementById('guardBtn').classList.toggle('active',keys.guard);
 document.getElementById('status').textContent=
  keys.guard?'GUARD':'EN GARDE!';
};

function finish(){
 if(!game||game.over)return;

 game.over=true;
 clearInterval(timer);

 const result=game.a>game.b?'WIN':
  game.a<game.b?'LOSS':'DRAW';

 document.getElementById('status').textContent=
  'BOUT FINISHED — '+result;

 const list=JSON.parse(
  localStorage.getItem('fencingRecords')||'[]'
 );

 list.unshift({
  date:new Date().toLocaleString(),
  result,
  score:game.a+' - '+game.b
 });

 localStorage.setItem(
  'fencingRecords',JSON.stringify(list.slice(0,10))
 );

 alert('試合終了！ '+result+' '+game.a+' - '+game.b);
}

window.showRecords=function(){
 const box=document.getElementById('records');
 box.classList.toggle('hidden');

 const list=JSON.parse(
  localStorage.getItem('fencingRecords')||'[]'
 );

 box.innerHTML='<h2>戦績</h2>'+
  (list.length?
   list.map(x=>'<p>'+x.date+'｜'+x.result+'｜'+x.score+'</p>').join(''):
   '<p>まだ記録がありません</p>');
};

window.backHome=function(){
 clearInterval(timer);
 cancelAnimationFrame(raf);
 game=null;
 document.getElementById('game').classList.add('hidden');
 document.getElementById('home').classList.remove('hidden');
};

function bindHold(id,down,up){
 const el=document.getElementById(id);

 el.addEventListener('pointerdown',e=>{
  e.preventDefault();
  el.classList.add('active');
  down();
 });

 for(const ev of ['pointerup','pointercancel','pointerleave']){
  el.addEventListener(ev,()=>{
   el.classList.remove('active');
   up();
  });
 }
}

bindHold('retreat',()=>keys.left=true,()=>keys.left=false);
bindHold('advance',()=>keys.right=true,()=>keys.right=false);

const atk=document.getElementById('attackBtn');

atk.addEventListener('pointerdown',e=>{
 e.preventDefault();
 attackCharge=performance.now();
 atk.classList.add('active');
 chargeTimer=setTimeout(()=>{},450);
});

function releaseAttack(){
 if(!attackCharge)return;

 const held=performance.now()-attackCharge;
 attackCharge=0;
 clearTimeout(chargeTimer);
 atk.classList.remove('active');

 playerAttack(held>=450);
}

for(const ev of ['pointerup','pointercancel','pointerleave']){
 atk.addEventListener(ev,releaseAttack);
}

bindHold(
 'guardBtn',
 ()=>{
  keys.guard=true;
  document.getElementById('guardBtn').classList.add('active');
 },
 ()=>{
  keys.guard=false;
  document.getElementById('guardBtn').classList.remove('active');
 }
);

document.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft')keys.left=true;
 if(e.key==='ArrowRight')keys.right=true;
 if(e.key==='ArrowDown')keys.guard=true;
 if(e.key==='ArrowUp'&&!e.repeat)playerAttack(false);
});

document.addEventListener('keyup',e=>{
 if(e.key==='ArrowLeft')keys.left=false;
 if(e.key==='ArrowRight')keys.right=false;
 if(e.key==='ArrowDown')keys.guard=false;
});
</script>
</body>
</html>
