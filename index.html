<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FENCING ELITE</title>
<style>
:root{--bg:#07111f;--panel:#122844;--line:#4b86c4;--text:#eef6ff;--muted:#a9c1dd}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 25%,#183454,#07111f 72%);color:var(--text);font-family:system-ui,-apple-system,sans-serif;text-align:center}
header{display:flex;justify-content:space-around;align-items:center;padding:12px 8px 6px}
small{color:var(--muted)}
.score{font-size:clamp(28px,5vw,44px);font-weight:800;line-height:1.05}
.clock{font-size:clamp(24px,4vw,34px);color:#b9ddff}
#arena{width:min(96vw,1280px);height:min(60vh,610px);min-height:330px;display:block;margin:0 auto;border:2px solid #416991;border-radius:14px;background:#10243b;touch-action:none;box-shadow:0 12px 45px #0005}
#hud{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px}
button{border:1px solid #5598df;background:#183454;color:white;border-radius:11px;padding:12px 17px;font-size:17px;cursor:pointer;touch-action:manipulation}
button:active,button.active{background:#2864a0}
.hint{color:#91aac5;font-size:13px;padding:5px 10px 18px}
#gauges{display:flex;justify-content:space-around;gap:16px;margin:0 auto;max-width:700px;color:#bdd3eb;font-size:13px}
.bar{height:8px;background:#263c54;border-radius:9px;overflow:hidden;width:min(36vw,260px);margin-top:5px}
.fill{height:100%;width:100%;background:#55d69e;transition:width .1s}
.overlay{position:fixed;inset:0;background:#06101fee;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
.card{width:min(500px,100%);background:#122844;border:1px solid #4b86c4;border-radius:18px;padding:25px;box-shadow:0 20px 70px #0008}
.card h1{letter-spacing:2px}
.card p{color:#b8cce1}
.hidden{display:none!important}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px}
</style>
</head>
<body>
<header>
<div><small id="pname">PLAYER</small><div class="score" id="ps">0</div></div>
<div><div class="clock" id="time">03:00</div><b id="call">EN GARDE!</b></div>
<div><small id="cname">CPU</small><div class="score" id="cs">0</div></div>
</header>

<canvas id="arena" aria-label="フェンシング試合画面"></canvas>

<div id="gauges">
<div>PLAYER スタミナ<div class="bar"><div class="fill" id="pg"></div></div></div>
<div>CPU スタミナ<div class="bar"><div class="fill" id="cg"></div></div></div>
</div>

<div id="hud">
<button id="back">◀ 後退</button>
<button id="forward">前進 ▶</button>
<button id="attack">⚔ 攻撃</button>
<button id="guard">🛡 防御</button>
<button id="menu">メニュー</button>
</div>

<div class="hint">PC：← → 移動、↑ 攻撃、↓ 防御 ／ スマホ・タブレット：ボタンを長押し</div>

<div class="overlay" id="start">
<div class="card">
<h1>FENCING ELITE</h1>
<p>エペ・フェンシング シミュレーター</p>
<div class="row">
<button id="startcpu">CPU対戦</button>
<button id="start2p">2人対戦（準備中）</button>
</div>
<p>前進・後退・攻撃・防御を使って勝利を目指そう。</p>
</div>
</div>

<div class="overlay hidden" id="result">
<div class="card">
<h1 id="rtitle">試合終了</h1>
<p id="rtext"></p>
<div class="row">
<button id="again">もう一度</button>
<button id="toMenu">メニュー</button>
</div>
</div>
</div>

<script>
(()=>{
const c=document.querySelector('#arena'),ctx=c.getContext('2d');
let W=1000,H=500,started=false,ended=false,mode='cpu',last=0,remaining=180,ps=0,cs=0,player,cpu,keys={};
const $=id=>document.getElementById(id);

function resize(){
const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
c.width=Math.round(r.width*d);
c.height=Math.round(r.height*d);
W=c.width;H=c.height;
draw();
}
window.addEventListener('resize',resize);

function line(x1,y1,x2,y2,color,width){
ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';
ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}

function fencer(p,color,dir){
let x=p.x*W/1000,y=H*.67,s=Math.min(W/1000,H/500);
ctx.save();ctx.translate(x,y);ctx.scale(s,s);
ctx.strokeStyle='#f4f7fa';ctx.lineWidth=18;ctx.lineCap='round';
ctx.beginPath();ctx.moveTo(0,-78);ctx.lineTo(-10,-26);ctx.lineTo(-19,0);
ctx.moveTo(-7,-28);ctx.lineTo(17,-3);ctx.stroke();
ctx.fillStyle='#f7f9fc';ctx.beginPath();
ctx.moveTo(-18,-118);ctx.lineTo(18,-118);ctx.lineTo(25,-77);ctx.lineTo(-22,-77);
ctx.closePath();ctx.fill();ctx.strokeStyle='#dce5ed';ctx.lineWidth=2;ctx.stroke();
ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(0,-135,18,14,0,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#162a42';ctx.lineWidth=3;ctx.stroke();
ctx.fillStyle='#fff';ctx.fillRect(-14,-141,28,4);
line(-7,-78,-9,-30,'#eef3f8',12);
line(-9,-30,-24,-4,'#eef3f8',10);
line(7,-78,8,-34,'#eef3f8',12);
line(8,-34,24,-4,'#eef3f8',10);
ctx.fillStyle=color;ctx.fillRect(-32,-2,18,7);ctx.fillRect(17,-2,18,7);
let shoulderX=dir===1?9:-9,armX=dir===1?45:-45;
line(shoulderX,-108,armX,-101,'#f3f6f9',12);
ctx.fillStyle=color;ctx.beginPath();ctx.arc(armX,-101,7,0,7);ctx.fill();
let tip=armX+dir*(p.attack>0?155:110);
line(armX,-101,tip,-101,'#d6e4ef',2);
line(tip,-101,tip+dir*12,-101,'#f7fbff',1);
if(p.attack>0){
ctx.strokeStyle='#ffd66b';ctx.lineWidth=3;ctx.beginPath();
ctx.arc(armX,-101,22,0,Math.PI*2);ctx.stroke();
}
if(p.guard){
ctx.strokeStyle='#69c6ff';ctx.lineWidth=4;ctx.beginPath();
ctx.arc(armX,-100,26,-1.5,1.5);ctx.stroke();
}
ctx.restore();
}

function draw(){
if(!ctx||!W)return;
ctx.clearRect(0,0,W,H);
let g=ctx.createLinearGradient(0,0,0,H);
g.addColorStop(0,'#122942');g.addColorStop(1,'#1b3552');
ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#233e5b';ctx.fillRect(0,H*.12,W,H*.20);
for(let i=0;i<90;i++){
let x=i*W/90;
ctx.fillStyle=i%3===0?'#b4c5d5':i%3===1?'#6c8ba9':'#d7e1e9';
ctx.beginPath();ctx.arc(x+4,H*.18+(i%4)*5,2.5,0,7);ctx.fill();
}
ctx.fillStyle='#d5e0ea';ctx.beginPath();
ctx.moveTo(W*.15,H*.68);ctx.lineTo(W*.85,H*.68);
ctx.lineTo(W*.94,H*.82);ctx.lineTo(W*.06,H*.82);
ctx.closePath();ctx.fill();
ctx.fillStyle='#a6b9cc';ctx.fillRect(W*.06,H*.82,W*.88,5);
for(let i=1;i<10;i++)
line(W*(.15+i*.07),H*.68,W*(.06+i*.088),H*.82,'#839ab0',1);
line(W*.5,H*.69,W*.5,H*.81,'#627f9a',2);
if(player)fencer(player,'#287ee8',1);
if(cpu)fencer(cpu,'#ef4656',-1);
if((player&&player.hit>0)||(cpu&&cpu.hit>0)){
ctx.fillStyle='#ffe06b';
ctx.font='bold '+Math.round(H*.07)+'px sans-serif';
ctx.textAlign='center';ctx.fillText('TOUCH!',W/2,H*.42);
}
}

function ui(){
$('ps').textContent=ps;
$('cs').textContent=cs;
$('time').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(Math.floor(remaining%60)).padStart(2,'0');
$('pg').style.width=player.st+'%';
$('cg').style.width=cpu.st+'%';
$('pg').style.background=player.st<25?'#ff6b6b':'#55d69e';
$('cg').style.background=cpu.st<25?'#ff6b6b':'#55d69e';
}

function reset(){
ps=cs=0;remaining=180;
player={x:290,st:100,guard:false,attack:0,hit:0};
cpu={x:710,st:100,guard:false,attack:0,hit:0};
ended=false;started=true;
$('start').classList.add('hidden');
$('result').classList.add('hidden');
$('call').textContent='EN GARDE!';
ui();draw();
}

function finish(){
ended=true;started=false;
$('rtitle').textContent=ps>cs?'VICTOIRE !':cs>ps?'DÉFAITE':'MATCH NUL';
$('rtext').textContent='PLAYER '+ps+' — '+cs+' CPU';
$('result').classList.remove('hidden');
}

function touch(a,d,isPlayer){
if(a.attack<=0||a.st<3)return;
let dist=Math.abs(a.x-d.x);
if(dist<210){
if(d.guard&&Math.random()<.65){
a.st=Math.max(0,a.st-13);
}else{
if(isPlayer)ps++;else cs++;
a.hit=.65;d.hit=.65;
$('call').textContent=isPlayer?'PLAYER TOUCHÉ!':'CPU TOUCHÉ!';
if(ps>=15||cs>=15)finish();
else setTimeout(()=>{if(!ended)$('call').textContent='EN GARDE!'},800);
}
}
}

function update(dt){
if(!started||ended)return;
remaining=Math.max(0,remaining-dt);
if(remaining===0){finish();return}
for(const p of [player,cpu]){
p.attack=Math.max(0,p.attack-dt);
p.hit=Math.max(0,p.hit-dt);
p.st=Math.min(100,p.st+(p.guard?-.15:9)*dt);
}
if(keys.left){player.x-=105*dt;player.st=Math.max(0,player.st-7*dt)}
if(keys.right){player.x+=105*dt;player.st=Math.max(0,player.st-7*dt)}
player.guard=!!keys.guard;
if(keys.guard)player.st=Math.max(0,player.st-10*dt);
let d=player.x-cpu.x;
if(Math.abs(d)>245){
cpu.x+=Math.sign(d)*45*dt;
cpu.st=Math.max(0,cpu.st-3*dt);
}else if(Math.random()<dt*.8&&cpu.attack===0&&cpu.st>10){
cpu.attack=.4;cpu.st-=12;touch(cpu,player,false);
}
cpu.guard=Math.random()<.12&&Math.abs(d)<220;
player.x=Math.max(90,Math.min(460,player.x));
cpu.x=Math.max(540,Math.min(910,cpu.x));
ui();draw();
}

function loop(t){
let dt=Math.min((t-last)/1000||0,.04);
last=t;update(dt);requestAnimationFrame(loop);
}

function hold(id,key){
let b=$(id);
const down=e=>{e.preventDefault();keys[key]=true;b.classList.add('active')};
const up=e=>{e.preventDefault();keys[key]=false;b.classList.remove('active')};
b.addEventListener('pointerdown',down);
['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,up));
}

hold('back','left');
hold('forward','right');
hold('guard','guard');

function doAttack(){
if(started&&!ended&&player.attack<=0&&player.st>5){
player.attack=.5;
player.st=Math.max(0,player.st-12);
setTimeout(()=>{if(player.attack>0)touch(player,cpu,true)},180);
}
}

$('attack').addEventListener('pointerdown',e=>{e.preventDefault();doAttack()});

window.addEventListener('keydown',e=>{
if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();
if(e.key==='ArrowLeft')keys.left=true;
if(e.key==='ArrowRight')keys.right=true;
if(e.key==='ArrowDown')keys.guard=true;
if(e.key==='ArrowUp'&&!e.repeat)doAttack();
});

window.addEventListener('keyup',e=>{
if(e.key==='ArrowLeft')keys.left=false;
if(e.key==='ArrowRight')keys.right=false;
if(e.key==='ArrowDown')keys.guard=false;
});

$('startcpu').onclick=()=>{mode='cpu';$('cname').textContent='CPU';reset()};
$('start2p').onclick=()=>alert('2人対戦は今後の更新で追加します。');
$('menu').onclick=()=>{started=false;$('start').classList.remove('hidden')};
$('again').onclick=reset;
$('toMenu').onclick=()=>{
$('result').classList.add('hidden');
$('start').classList.remove('hidden');
};
resize();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
