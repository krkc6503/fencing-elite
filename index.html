<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FENCING ELITE - Épée Championship</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .game-container {
            position: relative;
            width: 800px;
            max-width: 100%;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            border: 1px solid #334155;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .score-board {
            display: flex;
            gap: 24px;
            font-size: 1.2rem;
            font-weight: 700;
        }
        .score-p1 { color: #35b96d; }
        .score-p2 { color: #e34e5a; }
        .timer {
            font-variant-numeric: tabular-nums;
            background: #334155;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 1rem;
        }
        canvas {
            display: block;
            background: linear-gradient(to bottom, #1e293b 0%, #0f172a 100%);
            width: 100%;
            height: auto;
        }
        .controls-info {
            padding: 12px 24px;
            background: #0f172a;
            border-top: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .touch-controls {
            display: none;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 12px;
            background: #0f172a;
            border-top: 1px solid #334155;
        }
        @media (pointer: coarse) {
            .touch-controls { display: grid; }
        }
        .btn {
            background: #334155;
            color: #fff;
            border: none;
            padding: 14px 0;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:active {
            background: #475569;
        }
        .modal {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 10;
            transition: opacity 0.3s;
        }
        .modal.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .modal h2 {
            font-size: 2rem;
            font-weight: 800;
        }
        .modal p {
            color: #94a3b8;
            max-width: 400px;
            text-align: center;
            line-height: 1.5;
        }
        .menu-btn {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.6);
        }
    </style>
</head>
<body>

<div class="game-container">
    <header>
        <h1>FENCING ELITE</h1>
        <div class="score-board">
            <span class="score-p1">P1: <span id="score1">0</span></span>
            <div class="timer" id="timer">03:00</div>
            <span class="score-p2">P2: <span id="score2">0</span></span>
        </div>
    </header>

    <div style="position: relative;">
        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <!-- モーダル -->
        <div id="modal" class="modal">
            <h2 id="modalTitle">FENCING ELITE</h2>
            <p id="modalDesc">格闘ゲームのような緊迫した間合いの駆け引きで、エペの頂点を目指せ！</p>
            <div style="display: flex; gap: 12px;">
                <button class="menu-btn" onclick="startGame('cpu')">1P vs CPU</button>
                <button class="menu-btn" onclick="startGame('2p')" style="background: linear-gradient(135deg, #10b981, #059669);">2P対戦</button>
            </div>
        </div>
    </div>

    <div class="controls-info">
        <span>P1: [A][D] 移動 / [W] ランジ / [S] パリー</span>
        <span>P2: [←][→] 移動 / [↑] ランジ / [↓] パリー</span>
    </div>

    <div class="touch-controls">
        <button class="btn" ontouchstart="handleTouch('p1', 'left')" ontouchend="handleTouch('p1', 'stop')">◀ P1</button>
        <button class="btn" ontouchstart="handleTouch('p1', 'right')" ontouchend="handleTouch('p1', 'stop')">P1 ▶</button>
        <button class="btn" style="background:#059669;" ontouchstart="handleTouch('p1', 'lunge')">P1 ランジ</button>
        <button class="btn" style="background:#b91c1c;" ontouchstart="handleTouch('p1', 'parry')">P1 パリー</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = 'menu';
let gameMode = 'cpu';
let timeLeft = 180;
let timerInterval = null;

const p1 = {
    id: 1,
    x: 260,
    dir: 1,
    score: 0,
    action: 'idle',
    actionTimer: 0,
    tagTimer: 0,
    cooldown: 0
};

const p2 = {
    id: 2,
    x: 540,
    dir: -1,
    score: 0,
    action: 'idle',
    actionTimer: 0,
    tagTimer: 0,
    cooldown: 0
};

const keys = {};

window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (gameState === 'playing') {
        if (e.key === 'w' || e.key === 'W') triggerAction(p1, 'lunge');
        if (e.key === 's' || e.key === 'S') triggerAction(p1, 'parry');
        if (gameMode === '2p') {
            if (e.key === 'ArrowUp') triggerAction(p2, 'lunge');
            if (e.key === 'ArrowDown') triggerAction(p2, 'parry');
        }
    }
});

window.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
});

function handleTouch(player, action) {
    if (gameState !== 'playing') return;
    const p = player === 'p1' ? p1 : p2;
    if (action === 'lunge' || action === 'parry') {
        triggerAction(p, action);
    } else {
        p.action = action;
    }
}

function triggerAction(p, act) {
    if (p.cooldown > 0) return;
    p.action = act;
    p.actionTimer = act === 'lunge' ? 25 : 15;
    p.cooldown = 35;
}

function startGame(mode) {
    gameMode = mode;
    p1.score = 0;
    p2.score = 0;
    p1.x = 260;
    p2.x = 540;
    document.getElementById('score1').textContent = '0';
    document.getElementById('score2').textContent = '0';
    document.getElementById('modal').classList.add('hidden');
    gameState = 'playing';
    timeLeft = 180;
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        if (gameState === 'playing') {
            timeLeft--;
            let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            let s = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer').textContent = `${m}:${s}`;
            if (timeLeft <= 0) endGame("タイムアップ！");
        }
    }, 1000);
}

function resetRound() {
    p1.x = 260;
    p2.x = 540;
    p1.action = 'idle';
    p2.action = 'idle';
    p1.cooldown = 0;
    p2.cooldown = 0;
    gameState = 'playing';
}

function update() {
    if (gameState !== 'playing') return;

    // 格闘ゲームのように常にお互いを向く
    if (p1.x < p2.x) {
        p1.dir = 1;
        p2.dir = -1;
    } else {
        p1.dir = -1;
        p2.dir = 1;
    }

    // P1 移動
    if (p1.actionTimer > 0) {
        p1.actionTimer--;
        if (p1.actionTimer === 0) p1.action = 'idle';
    } else {
        if (keys['a']) { p1.x -= 4.0; p1.action = 'retreat'; }
        else if (keys['d']) { p1.x += 4.0; p1.action = 'advance'; }
        else { p1.action = 'idle'; }
    }

    // P2 移動
    if (gameMode === '2p') {
        if (p2.actionTimer > 0) {
            p2.actionTimer--;
            if (p2.actionTimer === 0) p2.action = 'idle';
        } else {
            if (keys['arrowleft']) { p2.x -= 4.0; p2.action = 'retreat'; }
            else if (keys['arrowright']) { p2.x += 4.0; p2.action = 'advance'; }
            else { p2.action = 'idle'; }
        }
    } else {
        // CPUロジック
        if (p2.actionTimer > 0) {
            p2.actionTimer--;
            if (p2.actionTimer === 0) p2.action = 'idle';
        } else {
            const dist = p1.x - p2.x;
            if (Math.random() < 0.03) {
                if (Math.abs(dist) < 210 && Math.random() < 0.65) {
                    triggerAction(p2, 'lunge');
                } else if (Math.abs(dist) < 150) {
                    triggerAction(p2, 'parry');
                }
            }
            if (p2.actionTimer === 0) {
                if (dist > -170) { p2.x += 2.5; p2.action = 'retreat'; }
                else if (dist < -240) { p2.x -= 2.5; p2.action = 'advance'; }
                else { p2.action = 'idle'; }
            }
        }
    }

    if (p1.cooldown > 0) p1.cooldown--;
    if (p2.cooldown > 0) p2.cooldown--;

    // ── 格闘ゲーム仕様：キャラクター同士の重なり・すり抜け完全防止 ──
    const minDistance = 210;
    if (p2.x - p1.x < minDistance) {
        const mid = (p1.x + p2.x) / 2;
        p1.x = mid - minDistance / 2;
        p2.x = mid + minDistance / 2;
    }

    p1.x = Math.max(90, Math.min(canvas.width - 90, p1.x));
    p2.x = Math.max(90, Math.min(canvas.width - 90, p2.x));

    // 突き判定 (Épée Rules)
    const hitDistance = 160;
    const distanceBetween = Math.abs(p1.x - p2.x);
    
    if (distanceBetween <= hitDistance) {
        let p1Scored = p1.action === 'lunge';
        let p2Scored = p2.action === 'lunge';

        if (p2.action === 'parry') p1Scored = false;
        if (p1.action === 'parry') p2Scored = false;

        if (p1Scored || p2Scored) {
            if (p1Scored && p2Scored) {
                p1.score++;
                p2.score++;
            } else if (p1Scored) {
                p1.score++;
            } else if (p2Scored) {
                p2.score++;
            }
            document.getElementById('score1').textContent = p1.score;
            document.getElementById('score2').textContent = p2.score;

            gameState = 'round_over';
            if (p1.score >= 5 || p2.score >= 5) {
                endGame(p1.score >= 5 ? "Player 1 勝利！" : "Player 2 勝利！");
            } else {
                setTimeout(resetRound, 1500);
            }
        }
    }
}

function endGame(msg) {
    gameState = 'game_over';
    clearInterval(timerInterval);
    document.getElementById('modalTitle').textContent = msg;
    document.getElementById('modalDesc').textContent = `最終スコア - P1: ${p1.score} | P2: ${p2.score}`;
    document.getElementById('modal').classList.remove('hidden');
}

function drawFencer(p) {
    const x = p.x;
    const dir = p.dir;
    const red = p.id === 2;
    const base = 292;
    const lunging = p.action === "lunge";
    const parrying = p.action === "parry";

    const suit = "#f8f9fc";
    const shade = "#c6d7eb";
    const blue = "#416fae";

    ctx.save();
    ctx.translate(x, base);
    ctx.scale(dir, 1);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // 地面の影 (重厚な格闘ゲーム風シャドウ)
    ctx.fillStyle = "rgba(15,23,42,.6)";
    ctx.beginPath();
    ctx.ellipse(0, 48, 115, 9, 0, 0, Math.PI * 2);
    ctx.fill();

    // ── 【格闘ゲーム風 改良版選手デザイン】 ──
    // 1. 後ろ脚（タメを利かせた筋肉質なレッグライン）
    ctx.strokeStyle = blue;
    ctx.lineWidth = 30;
    ctx.beginPath();
    ctx.moveTo(-10, -45);
    ctx.quadraticCurveTo(-65, -35, -92, 16);
    ctx.stroke();

    ctx.strokeStyle = suit;
    ctx.lineWidth = 22;
    ctx.beginPath();
    ctx.moveTo(-10, -46);
    ctx.quadraticCurveTo(-65, -35, -92, 16);
    ctx.stroke();

    ctx.strokeStyle = shade;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(-16, -43);
    ctx.quadraticCurveTo(-66, -29, -90, 12);
    ctx.stroke();

    // 2. 前脚（ランジ時はより鋭くダイナミックに突進）
    const lungeOffset = lunging ? 45 : 0;
    ctx.strokeStyle = blue;
    ctx.lineWidth = 32;
    ctx.beginPath();
    ctx.moveTo(10, -43);
    ctx.quadraticCurveTo(50 + lungeOffset/2, -20, 70 + lungeOffset, 1);
    ctx.quadraticCurveTo(96 + lungeOffset, 22, 125 + lungeOffset, 23);
    ctx.stroke();

    ctx.strokeStyle = suit;
    ctx.lineWidth = 23;
    ctx.beginPath();
    ctx.moveTo(10, -44);
    ctx.quadraticCurveTo(50 + lungeOffset/2, -21, 70 + lungeOffset, 0);
    ctx.quadraticCurveTo(96 + lungeOffset, 21, 125 + lungeOffset, 22);
    ctx.stroke();

    ctx.strokeStyle = shade;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(16, -41);
    ctx.quadraticCurveTo(51 + lungeOffset/2, -18, 68 + lungeOffset, 1);
    ctx.stroke();

    // 3. 青色のフェンシングシューズ
    ctx.fillStyle = "#1d4ed8";
    ctx.beginPath();
    ctx.moveTo(-110, 23);
    ctx.quadraticCurveTo(-94, 12, -78, 15);
    ctx.lineTo(-68, 26);
    ctx.lineTo(-102, 34);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(112 + lungeOffset, 18);
    ctx.quadraticCurveTo(134 + lungeOffset, 13, 150 + lungeOffset, 25);
    ctx.lineTo(150 + lungeOffset, 32);
    ctx.lineTo(116 + lungeOffset, 32);
    ctx.closePath();
    ctx.fill();

    // 4. 胴体・立体的なフェンシングジャケット（格闘ゲームのようなエッジと光沢）
    ctx.fillStyle = blue;
    ctx.beginPath();
    ctx.moveTo(-24, -125);
    ctx.quadraticCurveTo(8, -142, 40, -110);
    ctx.lineTo(30, -52);
    ctx.quadraticCurveTo(8, -32, -20, -48);
    ctx.lineTo(-40, -84);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = suit;
    ctx.beginPath();
    ctx.moveTo(-25, -129);
    ctx.quadraticCurveTo(8, -145, 36, -112);
    ctx.lineTo(26, -55);
    ctx.quadraticCurveTo(7, -36, -17, -51);
    ctx.lineTo(-35, -86);
    ctx.closePath();
    ctx.fill();

    // ジャケットの立体グラデーション陰影
    ctx.strokeStyle = shade;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(-16, -118);
    ctx.quadraticCurveTo(2, -98, 18, -90);
    ctx.moveTo(20, -78);
    ctx.quadraticCurveTo(2, -64, -14, -60);
    ctx.stroke();

    // 重厚な腰ベルト
    ctx.strokeStyle = "#1e3a8a";
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(-22, -53);
    ctx.quadraticCurveTo(2, -45, 28, -54);
    ctx.stroke();

    // 5. 後方に伸ばす腕（バランスを取るポージング）
    ctx.strokeStyle = blue;
    ctx.lineWidth = 24;
    ctx.beginPath();
    ctx.moveTo(-16, -112);
    ctx.quadraticCurveTo(-48, -95, -62, -72);
    ctx.quadraticCurveTo(-82, -64, -94, -82);
    ctx.stroke();

    ctx.strokeStyle = suit;
    ctx.lineWidth = 17;
    ctx.beginPath();
    ctx.moveTo(-16, -112);
    ctx.quadraticCurveTo(-48, -95, -62, -72);
    ctx.quadraticCurveTo(-82, -64, -94, -82);
    ctx.stroke();

    ctx.fillStyle = "#f5d0b1";
    ctx.beginPath();
    ctx.ellipse(-96, -84, 9, 7, -0.5, 0, Math.PI * 2);
    ctx.fill();

    // 6. 剣を持つ腕（ランジ時は鋭く前方に突き出し、パリー時は少し引き締める）
    const parryOffset = parrying ? -15 : 0;
    const armExtension = lunging ? 50 : (parrying ? -10 : 0);
    ctx.strokeStyle = blue;
    ctx.lineWidth = 25;
    ctx.beginPath();
    ctx.moveTo(24, -112);
    ctx.quadraticCurveTo(54 + armExtension/2, -122 + parryOffset, 78 + armExtension + parryOffset, -136);
    ctx.stroke();

    ctx.strokeStyle = suit;
    ctx.lineWidth = 18;
    ctx.beginPath();
    ctx.moveTo(24, -112);
    ctx.quadraticCurveTo(54 + armExtension/2, -122 + parryOffset, 78 + armExtension + parryOffset, -136);
    ctx.stroke();

    ctx.fillStyle = "#f5d0b1";
    ctx.beginPath();
    ctx.ellipse(85 + armExtension + parryOffset, -138, 10, 7, -0.3, 0, Math.PI * 2);
    ctx.fill();

    // 7. マスク（緑と赤の色分け、金属的な明るいフロント光沢）
    ctx.fillStyle = "#f5d0b1";
    ctx.fillRect(-1, -142, 18, 18);

    ctx.fillStyle = red ? "#ef4444" : "#10b981";
    ctx.beginPath();
    ctx.ellipse(-1, -160, 22, 31, -0.08, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = red ? "#991b1b" : "#047857";
    ctx.beginPath();
    ctx.ellipse(4, -160, 15, 26, -0.08, 0, Math.PI * 2);
    ctx.fill();

    // メッシュの明るい金属光沢
    ctx.fillStyle = "#e0f2fe";
    ctx.beginPath();
    ctx.ellipse(8, -163, 11, 20, -0.08, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(8, -163, 11, 20, -0.08, 0, Math.PI * 2);
    ctx.stroke();

    // マスクの首元プロテクター
    ctx.fillStyle = suit;
    ctx.beginPath();
    ctx.moveTo(-11, -140);
    ctx.lineTo(13, -140);
    ctx.lineTo(21, -124);
    ctx.lineTo(-8, -124);
    ctx.closePath();
    ctx.fill();

    // 8. エペのガードと細く長い剣身
    const swordOffset = armExtension + parryOffset;
    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(85 + swordOffset, -137);
    ctx.lineTo(98 + swordOffset, -148);
    ctx.stroke();

    ctx.strokeStyle = "#f8fafc";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(94 + swordOffset, -145);
    ctx.lineTo(270 + swordOffset, -235);
    ctx.stroke();

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(96 + swordOffset, -146);
    ctx.lineTo(270 + swordOffset, -235);
    ctx.stroke();

    // ランジ時のスピードアクセント線
    if (lunging) {
        ctx.strokeStyle = "rgba(255,255,255,.8)";
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(-140, -5);
        ctx.lineTo(-165, -5);
        ctx.moveTo(-132, 8);
        ctx.lineTo(-155, 15);
        ctx.stroke();
    }

    ctx.restore();
}

function drawPiste() {
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#1e293b";
    ctx.fillRect(40, 240, canvas.width - 80, 100);

    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(40, 292);
    ctx.lineTo(canvas.width - 40, 292);
    ctx.stroke();

    ctx.strokeStyle = "#ef4444";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 240);
    ctx.lineTo(canvas.width / 2, 340);
    ctx.stroke();
}

function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    drawPiste();
    
    if (gameState === 'playing' || gameState === 'round_over') {
        update();
    }

    drawFencer(p1);
    drawFencer(p2);

    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
