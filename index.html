<!DOCTYPE html>
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FENCING ELITE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080e1b;color:white;font-family:Arial,sans-serif;text-align:center}
button{border:1px solid #6ca9ff;background:#172b4b;color:white;padding:13px 22px;border-radius:10px;font-size:17px;font-weight:bold;margin:6px;cursor:pointer;touch-action:manipulation}
button:active{background:#2865a9}
h1{font-size:clamp(30px,7vw,56px);letter-spacing:3px;color:#fff;text-shadow:0 0 20px #238bff}
h2{color:#9ecbff}
.panel{max-width:950px;margin:20px auto;padding:16px}
.hidden{display:none!important}
#arena{height:340px;max-width:950px;margin:auto;position:relative;overflow:hidden;background:linear-gradient(#182b49 0%,#101a30 60%,#273c58 60%,#273c58 100%);border:2px solid #526d91;border-radius:14px}
#arena:before{content:"FENCING ELITE";position:absolute;top:18px;left:0;right:0;color:#536a8b;font-size:clamp(18px,4vw,32px);font-weight:bold;letter-spacing:5px}
.piste{position:absolute;left:0;right:0;bottom:35px;height:65px;background:linear-gradient(90deg,#d8e1e9,#f8fafc,#d8e1e9);border-top:3px solid #fff;border-bottom:3px solid #7e8b9c}
.line{position:absolute;left:50%;height:100%;border-left:2px solid #8192a6}
.fencer{position:absolute;bottom:91px;width:95px;height:175px;transition:left .12s;z-index:2}
.body{position:absolute;left:28px;top:49px;width:40px;height:73px;background:#f5f6f7;border:2px solid #a9b6c5;border-radius:12px 12px 5px 5px}
.mask{position:absolute;top:10px;left:22px;width:52px;height:42px;border-radius:15px;background:repeating-linear-gradient(0deg,#d3dce5 0px,#d3dce5 3px,#63758b 4px,#63758b 5px);border:3px solid #f8fafc}
.leg{position:absolute;top:115px;width:16px;height:55px;background:#eef2f5;border:2px solid #9eacbb;border-radius:5px}
.leg.one{left:27px;transform:rotate(12deg)}
.leg.two{left:52px;transform:rotate(-10deg)}
.arm{position:absolute;top:55px;left:57px;width:46px;height:13px;background:#f4f5f6;border:2px solid #9eacbb;border-radius:8px;transform-origin:left center;transform:rotate(-12deg)}
.sword{position:absolute;left:88px;top:47px;width:90px;height:3px;background:#dcecff;box-shadow:0 0 4px #fff;transform-origin:left center}
.guard .body{background:#c8ddff}
.attack .arm{transform:rotate(-2deg)}
.attack .sword{width:135px}
#p1{left:calc(24% - 45px)}
#p2{left:calc(76% - 45px);transform:scaleX(-1)}
#hud{display:flex;justify-content:space-around;align-items:center;gap:8px;margin:14px auto;max-width:950px}
.score{font-size:clamp(30px,7vw,48px);font-weight:bold}
.clock{font-size:25px;color:#b9d9ff}
#status{color:#b9d9ff;min-height:25px}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;max-width:950px;margin:12px auto}
.controls button{min-width:65px}
small{color:#a9b9d0}
input,select{font-size:17px;padding:10px;border-radius:8px;margin:5px;max-width:90%}
@media(max-width:600px){#arena{height:300px}.fencer{transform-origin:bottom center;scale:.8}#p2{transform:scaleX(-1) scale(.8)}.piste{bottom:25px;height:55px}.fencer{bottom:75px}}
</style>
</head>
<body>
<section id="home" class="panel">
<h1>FENCING ELITE</h1>
<p>ÉPÉE · THE ULTIMATE DUEL</p>
<h2>フェンシング・エペ</h2>
<button onclick="startGame()">START</button>
<button onclick="showRecords()">RECORDS</button>
<h2>設定</h2>
<label>CPUの強さ
<select id="difficulty"><option value="1">BEGINNER</option><option value="2">INTERMEDIATE</option><option value="3">ADVANCED</option><option value="4">EXPERT</option></select>
</label>
<p><small>15点先取、または3分間の試合。全身が有効面。</small></p>
<div id="records" class="hidden"></div>
</section>
<section id="game" class="panel hidden">
<div id="hud"><div><small>PLAYER</small><div id="s1" class="score">0</div></div><div><div class="clock" id="clock">03:00</div><div id="status">EN GARDE!</div></div><div><small>CPU</small><div id="s2" class="score">0</div></div></div>
<div id="arena">
<div class="piste"><div class="line"></div></div>
<div id="p1" class="fencer"><div class="mask"></div><div class="body"></div><div class="leg one"></div><div class="leg two"></div><div class="arm"></div><div class="sword"></div></div>
<div id="p2" class="fencer"><div class="mask"></div><div class="body"></div><div class="leg one"></div><div class="leg two"></div><div class="arm"></div><div class="sword"></div></div>
</div>
<div class="controls">
<button onclick="move(-1)">◀ 後退</button><button onclick="move(1)">前進 ▶</button>
<button onclick="attack()">⚔ 攻撃</button><button onclick="toggleGuard()">🛡 防御</button>
<button onclick="backHome()">メニュー</button>
</div>
<p><small>PC：← →で移動、↑で攻撃、↓で防御　／　スマホ・iPad：ボタン操作</small></p>
</section>
<script>
let game=null,timer=null,cpuTimer=null,guarding=false,attackLock=false;
function startGame(){
 clearInterval(timer);clearInterval(cpuTimer);
 game={a:0,b:0,x:24,remaining:180,difficulty:Number(document.getElementById('difficulty').value),over:false};
 guarding=false;attackLock=false;
 document.getElementById('home').classList.add('hidden');document.getElementById('game').classList.remove('hidden');
 render();document.getElementById('status').textContent='EN GARDE!';
 timer=setInterval(tick,1000);cpuTimer=setInterval(cpuMove,900);
}
function render(){
 document.getElementById('s1').textContent=game.a;document.getElementById('s2').textContent=game.b;
 document.getElementById('clock').textContent=String(Math.floor(game.remaining/60)).padStart(2,'0')+':'+String(game.remaining%60).padStart(2,'0');
 document.getElementById('p1').style.left='calc('+game.x+'% - 45px)';
 document.getElementById('p1').classList.toggle('guard',guarding);
}
function tick(){
 if(!game||game.over)return;
 game.remaining--;render();
 if(game.a>=15||game.b>=15||game.remaining<=0)finish();
}
function move(d){
 if(!game||game.over)return;
 game.x=Math.max(8,Math.min(45,game.x+d*2));render();
}
function attack(){
 if(!game||game.over||attackLock)return;
 attackLock=true;
 document.getElementById('p1').classList.add('attack');
 const distance=Math.abs(game.x-76);
 const chance=distance<34?0.78:distance<43?0.48:0.12;
 setTimeout(()=>{
  if(!game||game.over)return;
  if(Math.random()<chance){
   if(!guarding){game.a++;document.getElementById('status').textContent='TOUCHÉ! YOU SCORE!';}
   else document.getElementById('status').textContent='PARRIED!';
  }else document.getElementById('status').textContent='ATTACK MISSED';
  document.getElementById('p1').classList.remove('attack');attackLock=false;render();
  if(game.a>=15)finish();
 },350);
}
function toggleGuard(){
 guarding=!guarding;
 document.getElementById('status').textContent=guarding?'GUARD':'EN GARDE!';
 render();
}
function cpuMove(){
 if(!game||game.over)return;
 if(Math.random()<0.55)game.x=Math.max(8,Math.min(45,game.x+(Math.random()<0.5?-1:1)));
 if(Math.random()<0.15+game.difficulty*0.07){
  if(!guarding){game.b++;document.getElementById('status').textContent='CPU TOUCHÉ!';}
  else document.getElementById('status').textContent='CPU ATTACK BLOCKED';
 }
 render();if(game.b>=15)finish();
}
function finish(){
 if(!game||game.over)return;game.over=true;clearInterval(timer);clearInterval(cpuTimer);
 let result=game.a>game.b?'WIN':game.a<game.b?'LOSS':'DRAW';
 document.getElementById('status').textContent='BOUT FINISHED — '+result;
 let list=JSON.parse(localStorage.getItem('fencingRecords')||'[]');
 list.unshift({date:new Date().toLocaleString(),result:result,score:game.a+' - '+game.b});
 localStorage.setItem('fencingRecords',JSON.stringify(list.slice(0,10)));
 alert('試合終了！ '+result+'  '+game.a+' - '+game.b);
}
function showRecords(){
 const box=document.getElementById('records');box.classList.toggle('hidden');
 const list=JSON.parse(localStorage.getItem('fencingRecords')||'[]');
 box.innerHTML='<h2>戦績</h2>'+(list.length?list.map(x=>'<p>'+x.date+'｜'+x.result+'｜'+x.score+'</p>').join(''):'<p>まだ記録がありません</p>');
}
function backHome(){clearInterval(timer);clearInterval(cpuTimer);game=null;document.getElementById('game').classList.add('hidden');document.getElementById('home').classList.remove('hidden');}
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft')move(-1);
 if(e.key==='ArrowRight')move(1);
 if(e.key==='ArrowUp')attack();
 if(e.key==='ArrowDown'&&!guarding)toggleGuard();
});
document.addEventListener('keyup',e=>{if(e.key==='ArrowDown'&&guarding)toggleGuard();});
</script>
</body>
</html>
